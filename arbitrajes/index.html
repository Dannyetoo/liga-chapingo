/* ---------- dashboard ---------- */
function vistaDash(v){
  var f = {ed:U.dashEd||'', di:U.dashDi||'', ra:U.dashRa||''};
  var eqs = equiposDe(f);
  var cob=0, deb=0, jug=0;
  eqs.forEach(function(e){ cob+=cobradoEquipo(e.id); var s=saldoEquipo(e.id); if(s>0) deb+=s; jug+=(e.jugadores||[]).length; });
  /* los gastos se leen con el mismo filtro que los ingresos: nada de mezclar ámbitos */
  var gas = totalGastos(f), neto = cob-gas;

  function selF(idc, lista, actual, todos){
    return '<label class="f" style="min-width:150px"><span>'+esc(todos)+'</span><select id="'+idc+'">'
     + '<option value="">Todas</option>'
     + lista.map(function(x){ return '<option value="'+x.id+'"'+(actual===x.id?' selected':'')+'>'+esc(x.nombre)+'</option>'; }).join('')
     + '</select></label>';
  }
  var head = el('<div class="row" style="align-items:flex-end"><div><h3 style="font-size:19px">Dashboard</h3>'
   + '<div class="muted" style="font-size:12.5px">Todo lo que necesitas para decidir hoy.</div></div>'
   + '<span class="spacer"></span>'
   + selF('d-ed', S.ediciones, U.dashEd, 'Edición')
   + selF('d-di', S.disciplinas, U.dashDi, 'Disciplina')
   + selF('d-ra', S.ramas, U.dashRa, 'Rama')
   + '</div>');
  v.appendChild(head);
  head.querySelector('#d-ed').onchange = function(e){ U.dashEd=e.target.value; render(); };
  head.querySelector('#d-di').onchange = function(e){ U.dashDi=e.target.value; render(); };
  head.querySelector('#d-ra').onchange = function(e){ U.dashRa=e.target.value; render(); };

  var gr = gruposEquipo(eqs);
  v.appendChild(el('<div class="tiles">'
   + tile('Cobrado', mxn(cob), gr.length+' equipos · '+eqs.length+' registros · '+jug+' jugadores','')
   + tile('Saldo pendiente', mxn(deb), 'Registrado a crédito','')
   + tile('Gastos', mxn(gas), gastosAmbito(f).length+' movimientos en este filtro','')
   + tile('Rendimiento neto', mxn(neto), 'Ingresos reales menos gastos reales', neto<0?'neg':'hero')
   + '</div>'));
  var mulPend = totalMultasPendientes(), mulN = personasConMulta(true).length;
  if(mulN){
    var cm = el('<div class="card" style="border-left:4px solid var(--warn)"><div class="row">'
     + '<div><h3 style="font-size:15.5px">Multas individuales pendientes</h3>'
     + '<div class="sub">'+mulN+' jugador'+(mulN===1?'':'es')+' con adeudo personal. La multa los sigue de equipo, categoría y edición.</div></div>'
     + '<span class="spacer"></span>'
     + '<span class="num" style="font-family:Archivo,sans-serif;font-weight:700;font-size:22px;color:var(--bad)">'+esc(mxn(mulPend))+'</span>'
     + '<button class="btn" id="ir-mul2">Ver jugadores</button></div></div>');
    v.appendChild(cm);
    cm.querySelector('#ir-mul2').onclick = function(){ irA('multas'); };
  }

  /* ---- semáforo de inscripciones ---- */
  var cE = resumenEstados(eqs);
  var sem = el('<div class="card"><header><div><h3>Estado de inscripción</h3>'
   + '<div class="sub">Se calcula solo con los pagos de inscripción; el estado fijado a mano lleva un punto.</div></div></header>'
   + '<div class="tiles">'
   + ESTADOS.map(function(x){
       return '<div class="tile" style="border-left:4px solid '+x.color+'">'
        + '<span class="eyebrow">'+esc(x.nombre)+'</span>'
        + '<span class="v num">'+cE[x.id]+'</span>'
        + '<span class="m">'+(eqs.length? Math.round(cE[x.id]/eqs.length*100):0)+'% de los registros</span></div>';
     }).join('')
   + '</div></div>');
  v.appendChild(sem);

  /* ---- rendimiento financiero y jornadas ---- */
  tarjetaRendimiento(v, f);
  tarjetaJornadas(v, f);

  /* ---- una gráfica apilada por categoría ---- */
  var combos = combinaciones(f);
  var mapaColor = coloresConcepto();
  if(!combos.length){
    v.appendChild(el('<div class="card"><div class="empty">Todavía no hay equipos en este filtro.</div></div>'));
  }
  var TOPE = 8;
  if(combos.length > TOPE){
    v.appendChild(el('<div class="banner">Hay '+combos.length+' categorías con equipos. Se grafican las primeras '
      + TOPE+'; usa los filtros de arriba para ver el resto. La tabla de abajo sí las incluye todas.</div>'));
  }
  combos.slice(0, TOPE).forEach(function(cb){
    var conceptos = conceptosDe(cb.equipos);
    var eqOrd = cb.equipos.slice().sort(function(a,b){
      return pagadoTotal(b)-pagadoTotal(a) || a.nombre.localeCompare(b.nombre,'es'); });
    var series = conceptos.map(function(cn){
      return {nombre:cn, color:mapaColor(cn), valores: eqOrd.map(function(e){ return pagadoPorConcepto(e.id, cn); })};
    });
    series.push({nombre:'Saldo pendiente', color:'var(--bad)', pend:true,
      valores: eqOrd.map(function(e){ return Math.max(0, saldoEquipo(e.id)); })});

    var card = el('<div class="card"><header><div><h3>'+esc(cb.titulo)+'</h3>'
     + '<div class="sub">Lo que ha pagado cada equipo, desglosado por concepto. La barra roja es lo que queda a crédito.</div></div></header>'
     + '<div class="legend" id="lg"></div><div style="height:12px"></div><div id="ch"></div></div>');
    v.appendChild(card);
    var lg = card.querySelector('#lg');
    series.forEach(function(s){
      if(s.valores.every(function(x){ return !x; })) return;
      lg.appendChild(el('<span class="lgi"><span class="dot" style="background:'+s.color+'"></span>'+esc(s.nombre)+'</span>'));
    });
    barChartApilado(card.querySelector('#ch'), {
      labels: eqOrd.map(function(e){ return e.nombre; }),
      ids: eqOrd.map(function(e){ return e.id; }),
      series: series,
      onClick: function(i){ abrirGrupo(grupoClave(eqOrd[i])); }
    });
  });

  /* ---- tabla equipo × concepto ---- */
  if(combos.length){
    var t = el('<div class="card"><header><div><h3>Pagos por equipo y concepto</h3>'
     + '<div class="sub">Cada categoría por separado. La inscripción es un solo cargo; el arbitraje se acumula jornada tras jornada — el ×N indica cuántos movimientos lleva. Pendiente es lo registrado a crédito.</div></div>'
     + '<button class="btn sm" id="x-mat">Exportar tabla (CSV)</button></header>'
     + '<div id="secs"></div></div>');
    v.appendChild(t);
    var secs = t.querySelector('#secs');
    combos.forEach(function(cb, k){
      var conceptos = conceptosDe(cb.equipos);
      var eqOrd = cb.equipos.slice().sort(function(a,b){ return a.nombre.localeCompare(b.nombre,'es'); });
      var tot = {}, totPend = 0, totTot = 0;
      conceptos.forEach(function(c){ tot[c]=0; });
      var filas = eqOrd.map(function(e){
        var pend = Math.max(0, saldoEquipo(e.id)), suma = 0;
        var celdas = conceptos.map(function(cn){
          var p = pagadoPorConcepto(e.id, cn), n = movsConcepto(e.id, cn);
          tot[cn] += p; suma += p;
          if(!p && !n) return '<td class="num muted">—</td>';
          return '<td class="num">'+esc(mxn(p))+(n>1? '<span class="vc">×'+n+'</span>':'')+'</td>';
        }).join('');
        totPend += pend; totTot += suma;
        return '<tr class="clickable" data-e="'+e.id+'"><td><b>'+esc(e.nombre)+'</b></td>'
         + '<td>'+pillEstado(e)+'</td>'
         + '<td class="muted" style="font-size:12px">'+esc(e.encargado||'—')+'</td>'
         + celdas
         + '<td class="num" style="color:'+(pend>0?'var(--bad)':'var(--muted)')+';font-weight:'+(pend>0?'600':'400')+'">'+(pend>0? esc(mxn(pend)):'—')+'</td>'
         + '<td class="num" style="font-weight:600">'+esc(mxn(suma))+'</td></tr>';
      }).join('');
      var sec = el('<div class="sec">'
       + '<div class="eyebrow" style="margin:'+(k?'22px':'0')+' 0 9px">'+esc(cb.titulo)+'</div>'
       + '<div class="tblwrap"><table><thead><tr><th>Equipo</th><th>Estado</th><th>Encargado</th>'
       + conceptos.map(function(c){ return '<th class="num">'+esc(c)+'</th>'; }).join('')
       + '<th class="num">Pendiente</th><th class="num">Total</th></tr></thead>'
       + '<tbody>'+(filas || '<tr><td colspan="5"><div class="empty">Sin equipos.</div></td></tr>')+'</tbody>'
       + '<tfoot><tr><td colspan="3" class="tf">Total de la categoría</td>'
       + conceptos.map(function(c){ return '<td class="num tf">'+esc(mxn(tot[c]))+'</td>'; }).join('')
       + '<td class="num tf" style="color:'+(totPend>0?'var(--bad)':'inherit')+'">'+esc(mxn(totPend))+'</td>'
       + '<td class="num tf">'+esc(mxn(totTot))+'</td></tr></tfoot></table></div></div>');
      sec.querySelectorAll('[data-e]').forEach(function(tr){
        tr.onclick = function(){ abrirGrupo(grupoClave(byId(S.equipos, tr.getAttribute('data-e')))); }; });
      secs.appendChild(sec);
    });
    t.querySelector('#x-mat').onclick = function(){ exportarMatriz(combos); };

    /* ---- gasto y rendimiento de cada categoría deportiva ---- */
    tarjetaGastosCategoria(v, combos, f);
  }

  /* ---- quién movió el dinero ---- */
  seccionRastreo(v, enFiltro(eqs));

  /* ---- concepto y rama ---- */
  var g2 = el('<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px"></div>');
  var c2 = el('<div class="card"><header><div><h3>Cobrado por concepto</h3><div class="sub">De dónde viene el dinero.</div></div></header><div id="ch2"></div></div>');
  var c3 = el('<div class="card"><header><div><h3>Saldo pendiente por rama</h3><div class="sub">Dónde está el dinero por recuperar.</div></div></header><div id="ch3"></div></div>');
  g2.appendChild(c2); g2.appendChild(c3); v.appendChild(g2);

  var enF = {}; eqs.forEach(function(e){ enF[e.id]=1; });
  var porC = {};
  S.movs.forEach(function(m){ if(!enF[m.equipoId]) return; porC[m.concepto]=(porC[m.concepto]||0)+(Number(m.recibido)||0); });
  barChart(c2.querySelector('#ch2'), Object.keys(porC).sort(function(a,b){return porC[b]-porC[a];}).map(function(k,i){
    return {label:k, value:porC[k], color:'var(--s1)', top:i<3}; }),
    {aria:'Cobrado por concepto', height:190, step:48, barW:32, labelH:84});

  var porR = {};
  eqs.forEach(function(e){
    var s = saldoEquipo(e.id); if(s<=0) return;
    var k = nom(S.disciplinas,e.disciplinaId)+' '+nom(S.ramas,e.ramaId);
    porR[k] = (porR[k]||0)+s;
  });
  barChart(c3.querySelector('#ch3'), Object.keys(porR).sort(function(a,b){return porR[b]-porR[a];}).map(function(k,i){
    return {label:k, value:porR[k], color:'var(--s8)', top:i<3}; }),
    {aria:'Saldo pendiente por rama', height:190, step:48, barW:32, labelH:84});

  /* ---- cobranza por día ---- */
  var porD = {};
  S.movs.forEach(function(m){ if(!enF[m.equipoId]) return; porD[m.fecha]=(porD[m.fecha]||0)+(Number(m.recibido)||0); });
  var dias = Object.keys(porD).sort().slice(-30);
  var c4 = el('<div class="card"><header><div><h3>Cobranza por día</h3><div class="sub">'
   + (dias.length===1?'Un solo día con movimiento.':'Últimos '+dias.length+' días con movimiento.')+'</div></div></header><div id="ch4"></div></div>');
  v.appendChild(c4);

    var ing = ingresosAmbito(f2), gas = totalGastos(f2);

/* gasto total de cada categoría deportiva, clasificado por categoría de gasto */
function tarjetaGastosCategoria(v, combos, f){

/* todos los gastos de un ámbito, agrupados por categoría de gasto y concepto */
function abrirGastosAmbito(f, titulo){
  var porCat = gastosPorCatGasto(f), claves = Object.keys(porCat).sort(function(a,b){ return porCat[b]-porCat[a]; });
  var tot = totalGastos(f), ing = ingresosAmbito(f);
  var cuerpo = claves.map(function(cat){
    var conc = gastosPorConcepto(f, cat), ck = Object.keys(conc).sort(function(a,b){ return conc[b]-conc[a]; });
    return '<div class="eyebrow" style="margin:16px 0 8px">'+esc(cat)+'</div>'
     + '<div class="tblwrap"><table><thead><tr><th>Concepto</th><th class="num">Total</th></tr></thead><tbody>'
     + ck.map(function(k){ return '<tr><td>'+esc(k)+'</td><td class="num">'+esc(mxn(conc[k]))+'</td></tr>'; }).join('')
     + '</tbody><tfoot><tr><td class="tf">'+esc(cat)+'</td><td class="num tf">'+esc(mxn(porCat[cat]))+'</td></tr></tfoot></table></div>';
  }).join('');
  var b = el('<div>'
   + '<div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">'
   + tile('Ingresos', mxn(ing), 'Cobrado en este ámbito','')
   + tile('Gastos', mxn(tot), gastosAmbito(f).length+' movimientos','')
   + tile('Neto', mxn(ing-tot), 'Ingresos menos gastos', (ing-tot)<0?'neg':'hero')
   + '</div>'
   + (cuerpo || '<div class="empty">Sin gastos en este ámbito.</div>')
   + '</div>');
  modal(titulo||'Gastos del ámbito', b, null, 'Desglose por categoría de gasto y concepto');
}

   + '<td class="num tf">'+esc(mxn(T.arb))+'</td><td class="num tf">'+esc(mxn(T.sup))+'</td>'

/* ---------- helpers del dashboard ---------- */
function cargosEquipo(id){ var t=0; S.movs.forEach(function(m){ if(m.equipoId===id) t+=Number(m.importe)||0; }); return t; }
function pagadoTotal(e){ return cobradoEquipo(e.id); }
function pagadoPorConcepto(id, cn){
  var t=0; S.movs.forEach(function(m){ if(m.equipoId===id && m.concepto===cn) t+=Number(m.recibido)||0; }); return t;
}
function movsConcepto(id, cn){
  var n=0; S.movs.forEach(function(m){ if(m.equipoId===id && m.concepto===cn) n++; }); return n;
}
function conceptosDe(equipos){
  var vis={}, orden=[];
  S.conceptos.forEach(function(c){ vis[c.nombre]=0; });
  equipos.forEach(function(e){
    S.movs.forEach(function(m){ if(m.equipoId===e.id) vis[m.concepto]=1; });
  });
  S.conceptos.forEach(function(c){ if(vis[c.nombre]) orden.push(c.nombre); });
  Object.keys(vis).sort().forEach(function(k){ if(vis[k] && orden.indexOf(k)<0) orden.push(k); });
  return orden;
}
function coloresConcepto(){
  var idx = {};
  S.conceptos.forEach(function(c,i){ idx[c.nombre] = i; });
  var extra = S.conceptos.length;
  return function(cn){
    if(!(cn in idx)) idx[cn] = extra++;
    return 'var(--s'+((idx[cn]%8)+1)+')';
  };
}
function combinaciones(f){
  var m = {};
  equiposDe(f).forEach(function(e){
    var k = e.edicionId+'|'+e.disciplinaId+'|'+e.ramaId+'|'+e.categoriaId;
    if(!m[k]) m[k] = {clave:k, ed:e.edicionId, di:e.disciplinaId, ra:e.ramaId, ca:e.categoriaId, equipos:[],
      titulo: nom(S.ediciones,e.edicionId)+' · '+nom(S.disciplinas,e.disciplinaId)+' · '
            + nom(S.ramas,e.ramaId)+' · '+nom(S.categorias,e.categoriaId)};
    m[k].equipos.push(e);
  });
  function pos(lista,id){ for(var i=0;i<lista.length;i++) if(lista[i].id===id) return i; return 99; }
  return Object.keys(m).map(function(k){ return m[k]; }).sort(function(a,b){
    return pos(S.ediciones,a.ed)-pos(S.ediciones,b.ed)
        || pos(S.disciplinas,a.di)-pos(S.disciplinas,b.di)
        || pos(S.ramas,a.ra)-pos(S.ramas,b.ra)
        || pos(S.categorias,a.ca)-pos(S.categorias,b.ca);
  });
}
function grupoClave(e){ return e? e.edicionId+'|'+e.disciplinaId+'|'+e.ramaId+'|'+norm(e.nombre) : ''; }
function gruposEquipo(equipos){
  var m = {};
  equipos.forEach(function(e){
    var k = grupoClave(e);
    if(!m[k]) m[k] = {clave:k, nombre:e.nombre, edicionId:e.edicionId, disciplinaId:e.disciplinaId,
                      ramaId:e.ramaId, regs:[], encargados:[], cobrado:0, cargos:0, pendiente:0, jugadores:0};
    var g = m[k];
    g.regs.push(e);
    g.cobrado += cobradoEquipo(e.id);
    g.cargos  += cargosEquipo(e.id);
    g.pendiente += Math.max(0, saldoEquipo(e.id));
    g.jugadores += (e.jugadores||[]).length;
    if(e.encargado && g.encargados.indexOf(e.encargado)<0) g.encargados.push(e.encargado);
  });
  return Object.keys(m).map(function(k){ return m[k]; });
}

/* ---------- ficha agrupada del equipo ---------- */
function abrirGrupo(clave){
  var regs = S.equipos.filter(function(e){ return grupoClave(e)===clave; });
  if(!regs.length) return;
  var cerrado = regs.filter(function(e){ return !permiso(e); })[0];

  if(regs.length===1){ abrirEstado(regs[0].id); return; }
  var g = gruposEquipo(regs)[0];
  var ms = [];
  regs.forEach(function(e){ movsDe(e.id).forEach(function(m){ ms.push({m:m, e:e}); }); });

   + '<div class="eyebrow" style="margin-bottom:9px">Registros que suman a este equipo</div>'
   + '<div class="tblwrap"><table><thead><tr><th>Categoría</th><th>Estado</th><th>Encargado</th><th class="num">Jugadores</th>'
   + '<th class="num">Cobrado</th><th class="num">Pendiente</th><th></th></tr></thead><tbody>'
   + regs.map(function(e){
       var p = Math.max(0, saldoEquipo(e.id));
       return '<tr><td><b>'+esc(nom(S.categorias,e.categoriaId))+'</b></td>'
        + '<td>'+pillEstado(e)+'</td>'
        + '<td>'+esc(e.encargado||'—')+'</td>'
        + '<td class="num">'+((e.jugadores||[]).length)+'</td>'
        + '<td class="num">'+esc(mxn(cobradoEquipo(e.id)))+'</td>'
        + '<td class="num" style="color:'+(p>0?'var(--bad)':'inherit')+'">'+esc(mxn(p))+'</td>'
        + '<td class="ta-r" style="white-space:nowrap">'
        + '<button class="btn ghost sm" data-est="'+e.id+'">Estado</button>'
        + '<button class="btn ghost sm" data-car="'+e.id+'">Cobrar</button></td></tr>';
     }).join('')
   + '</tbody></table></div>'
   + (g.encargados.length>1? '<div class="banner" style="margin-top:12px">Este equipo está registrado con '
       + g.encargados.length+' encargados distintos: '+esc(g.encargados.join(', '))+'.</div>' : '')
   + '<div style="height:18px"></div>'
   + '<div class="eyebrow" style="margin-bottom:9px">Movimientos de todas sus categorías</div>'
   + '<div class="tblwrap"><table><thead><tr><th>Fecha</th><th>Categoría</th><th>Concepto</th>'
   + '<th class="num">Cargo</th><th class="num">Recibido</th><th></th></tr></thead><tbody>'
   + (ms.length? ms.map(function(x){
       return '<tr><td class="num muted">'+esc(fecha(x.m.fecha))+'</td>'
        + '<td>'+esc(nom(S.categorias,x.e.categoriaId))+'</td>'
        + '<td><b>'+esc(x.m.concepto)+'</b>'+(x.m.nota? '<br><span class="muted" style="font-size:11.5px">'+esc(x.m.nota)+'</span>':'')+'</td>'
        + '<td class="num">'+esc(mxn(x.m.importe))+'</td>'
        + '<td class="num">'+esc(mxn(x.m.recibido))+'<br><span class="muted" style="font-size:11px">'+esc(x.m.forma||'')+'</span></td>'
        + '<td class="ta-r"><button class="btn ghost sm" data-tk="'+x.m.id+'">Ticket</button></td></tr>';
     }).join('') : '<tr><td colspan="6"><div class="empty">Sin movimientos.</div></td></tr>')
   + '</tbody></table></div></div>');
  modal(g.nombre, b, null, nom(S.ediciones,g.edicionId)+' · '+nom(S.disciplinas,g.disciplinaId)+' · '+nom(S.ramas,g.ramaId));

}

/* ---------- barras apiladas ---------- */
function barChartApilado(host, opt){
  host.innerHTML = '';
  var labels = opt.labels||[], series = opt.series||[];
  if(!labels.length){ host.innerHTML = '<div class="empty">Sin equipos en esta categoría.</div>'; return; }
  var plotH=(opt.height||210), step=48, barW=34, labelH=86, padT=18, padL=64;
  var W = Math.max(padL + labels.length*step + 12, 40), H = plotH+padT+labelH;
  var totales = labels.map(function(_,i){
    return series.reduce(function(a,s){ return a + (Number(s.valores[i])||0); }, 0); });
  var max = Math.max.apply(null, totales.concat([0]));
  var ticks = niceTicks(max), top = ticks[ticks.length-1]||1;
  var y = function(val){ return padT + plotH - (val/top)*plotH; };

  var wrap = el('<div class="chartwrap"></div>');
  var ys = ['<svg class="yaxis" width="62" height="'+H+'" role="presentation">'];
  ticks.forEach(function(t){ ys.push('<text class="axlbl" x="56" y="'+(y(t)+3.5)+'" text-anchor="end">'+esc(mxn0(t))+'</text>'); });
  ys.push('<line class="bline" x1="61.5" y1="'+padT+'" x2="61.5" y2="'+(padT+plotH)+'"></line></svg>');
  wrap.appendChild(el(ys.join('')));

  var s = ['<svg width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(opt.aria||'Pagos por equipo y concepto')+'">'];
  ticks.forEach(function(t){ s.push('<line class="gline" x1="0" y1="'+y(t)+'" x2="'+W+'" y2="'+y(t)+'"></line>'); });
  s.push('<line class="bline" x1="0" y1="'+(padT+plotH)+'" x2="'+W+'" y2="'+(padT+plotH)+'"></line>');

  labels.forEach(function(lb, i){
    var x = padL + i*step + (step-barW)/2, base = padT+plotH, acum = 0;
    var ultimo = -1;
    series.forEach(function(sr, k){ if((Number(sr.valores[i])||0) > 0) ultimo = k; });
    if(ultimo < 0){
      s.push('<rect class="bar bar-zero" x="'+x+'" y="'+(base-2)+'" width="'+barW+'" height="2"></rect>');
    } else {
      series.forEach(function(sr, k){
        var val = Number(sr.valores[i])||0; if(val<=0) return;
        var y1 = y(acum), y0 = y(acum+val);
        acum += val;
        var alto = Math.max(y1-y0, 1.5);
        var hueco = (k===ultimo)? 0 : 2;                    // separación entre segmentos
        var altoV = Math.max(alto-hueco, 1);
        var yv = y1 - alto;
        if(k===ultimo){
          var r = Math.min(4, barW/2, altoV);
          s.push('<path class="bar" fill="'+sr.color+'" d="M'+x+','+(yv+altoV)+' V'+(yv+r)
            +' Q'+x+','+yv+' '+(x+r)+','+yv+' H'+(x+barW-r)+' Q'+(x+barW)+','+yv+' '+(x+barW)+','+(yv+r)
            +' V'+(yv+altoV)+' Z"></path>');
        } else {
          s.push('<rect class="bar" fill="'+sr.color+'" x="'+x+'" y="'+(yv+hueco)+'" width="'+barW+'" height="'+altoV+'"></rect>');
        }
      });
      if(labels.length<=14)
        s.push('<text class="vlbl" x="'+(x+barW/2)+'" y="'+(y(totales[i])-6)+'" text-anchor="middle">'+esc(mxn0(totales[i]))+'</text>');
    }
    s.push('<text class="axlbl" transform="rotate(-45,'+(x+barW/2)+','+(base+12)+')" x="'+(x+barW/2)+'" y="'+(base+12)+'" text-anchor="end">'+esc(recorta(lb,18))+'</text>');
    s.push('<rect class="bar-hit" data-i="'+i+'" x="'+(padL+i*step)+'" y="'+padT+'" width="'+step+'" height="'+(plotH+labelH)+'"></rect>');
  });
  s.push('</svg>');
  var sc = el('<div class="scroller"></div>'); sc.appendChild(el(s.join('')));
  wrap.appendChild(sc);
  var tip = el('<div class="tip"></div>'); wrap.appendChild(tip);
  host.appendChild(wrap);

  sc.addEventListener('mousemove', function(ev){
    var t = ev.target.closest('[data-i]'); if(!t){ tip.style.opacity=0; return; }
    var i = +t.getAttribute('data-i');
    var lineas = series.filter(function(sr){ return (Number(sr.valores[i])||0)>0; })
      .map(function(sr){ return '<span style="color:'+sr.color+'">■</span> '+esc(sr.nombre)+' '+mxn(sr.valores[i]); });
    tip.innerHTML = '<b>'+esc(labels[i])+'</b><br>'+(lineas.join('<br>')||'Sin movimientos')
      + '<br><b>Total '+mxn(totales[i])+'</b>';
    tip.style.opacity = 1;
    var hb = wrap.getBoundingClientRect();
    tip.style.left = Math.min(ev.clientX-hb.left+12, wrap.clientWidth-tip.offsetWidth-6)+'px';
    tip.style.top = Math.max(ev.clientY-hb.top-10,0)+'px';
  });
  sc.addEventListener('mouseleave', function(){ tip.style.opacity=0; });
  if(opt.onClick) sc.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-i]'); if(t) opt.onClick(+t.getAttribute('data-i'));
  });
}

/* ---------- barras agrupadas (admite valores negativos: ingreso / gasto / neto) ---------- */
function barChartGrupos(host, opt){
  host.innerHTML = '';
  var labels = opt.labels||[], series = opt.series||[];
  if(!labels.length){ host.innerHTML = '<div class="empty">Sin datos todavía.</div>'; return; }
  var nS = Math.max(series.length,1), barW = opt.barW||15, sep = 3;
  var grupoW = nS*barW + (nS-1)*sep, step = grupoW + 28;
  var plotH = opt.height||220, padT = 18, padL = 64, labelH = opt.labelH||92;
  var W = Math.max(padL + labels.length*step + 12, 40), H = plotH + padT + labelH;
  var max = 0, min = 0;
  series.forEach(function(s){ (s.valores||[]).forEach(function(x){
    var v = Number(x)||0; if(v>max) max=v; if(v<min) min=v; }); });
  var tk = niceTicks(max), top = tk[tk.length-1]||1;
  var paso = tk.length>1? (tk[1]-tk[0]) : top;
  var bot = 0, ticks = tk.slice();
  if(min < 0 && paso > 0){ while(bot > min){ bot -= paso; ticks.unshift(bot); } }
  var rango = (top - bot) || 1;
  var y = function(v){ return padT + plotH - ((v-bot)/rango)*plotH; };
  var cero = y(0);

  var wrap = el('<div class="chartwrap"></div>');
  var ys = ['<svg class="yaxis" width="62" height="'+H+'" role="presentation">'];
  ticks.forEach(function(t){ ys.push('<text class="axlbl" x="56" y="'+(y(t)+3.5)+'" text-anchor="end">'+esc(mxn0(t))+'</text>'); });
  ys.push('<line class="bline" x1="61.5" y1="'+padT+'" x2="61.5" y2="'+(padT+plotH)+'"></line></svg>');
  wrap.appendChild(el(ys.join('')));

  var s = ['<svg width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(opt.aria||'Comparativo')+'">'];
  ticks.forEach(function(t){ s.push('<line class="gline" x1="0" y1="'+y(t)+'" x2="'+W+'" y2="'+y(t)+'"></line>'); });
  s.push('<line class="bline" x1="0" y1="'+cero+'" x2="'+W+'" y2="'+cero+'"></line>');
  labels.forEach(function(lb, i){
    var x0 = padL + i*step + (step-grupoW)/2;
    series.forEach(function(sr, k){
      var v = Number((sr.valores||[])[i])||0, x = x0 + k*(barW+sep);
      var yv = y(v), alto = Math.abs(yv-cero);
      if(alto < 2){ alto = 2; yv = v<0? cero : cero-2; }
      else if(v < 0) yv = cero;
      s.push('<rect class="bar" fill="'+sr.color+'" x="'+x+'" y="'+yv+'" width="'+barW+'" height="'+alto+'" rx="2"></rect>');
    });
    s.push('<text class="axlbl" transform="rotate(-45,'+(x0+grupoW/2)+','+(padT+plotH+12)+')" x="'+(x0+grupoW/2)
      +'" y="'+(padT+plotH+12)+'" text-anchor="end">'+esc(recorta(lb,20))+'</text>');
    s.push('<rect class="bar-hit" data-i="'+i+'" x="'+(padL+i*step)+'" y="'+padT+'" width="'+step+'" height="'+(plotH+labelH)+'"></rect>');
  });
  s.push('</svg>');
  var sc = el('<div class="scroller"></div>'); sc.appendChild(el(s.join('')));
  wrap.appendChild(sc);
  var tip = el('<div class="tip"></div>'); wrap.appendChild(tip);
  host.appendChild(wrap);
  sc.addEventListener('mousemove', function(ev){
    var t = ev.target.closest('[data-i]'); if(!t){ tip.style.opacity=0; return; }
    var i = +t.getAttribute('data-i');
    tip.innerHTML = '<b>'+esc(labels[i])+'</b><br>'+series.map(function(sr){
      return '<span style="color:'+sr.color+'">■</span> '+esc(sr.nombre)+' '+mxn(Number((sr.valores||[])[i])||0); }).join('<br>');
    tip.style.opacity = 1;
    var hb = wrap.getBoundingClientRect();
    tip.style.left = Math.min(ev.clientX-hb.left+12, wrap.clientWidth-tip.offsetWidth-6)+'px';
    tip.style.top  = Math.max(ev.clientY-hb.top-10, 0)+'px';
  });
  sc.addEventListener('mouseleave', function(){ tip.style.opacity=0; });
  if(opt.onClick) sc.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-i]'); if(t) opt.onClick(+t.getAttribute('data-i'));
  });
}

/* ---------- rastreo de dinero: quién entrega y quién recibe ---------- */
function enFiltro(eqs){ var m={}; eqs.forEach(function(e){ m[e.id]=1; }); return m; }
function gastosFiltrados(){
  return gastosAmbito({ed:U.dashEd||'', di:U.dashDi||'', ra:U.dashRa||''});
}
function SINREG(){ return '(sin registrar)'; }

function personasDinero(enF){
  var m = {};
  function fila(n){
    n = (n||'').trim() || SINREG();
    if(!m[n]) m[n] = {nombre:n, cobrado:0, nCob:0, pagado:0, nPag:0, conceptos:{}};
    return m[n];
  }
  S.movs.forEach(function(mv){
    if(!enF[mv.equipoId]) return;
    var r = Number(mv.recibido)||0; if(r<=0) return;
    var f = fila(mv.cajero);
    f.cobrado += r; f.nCob++;
    f.conceptos[mv.concepto] = (f.conceptos[mv.concepto]||0) + r;
  });
  gastosFiltrados().forEach(function(g){
    var f = fila(pagadorGasto(g));
    f.pagado += Number(g.monto)||0; f.nPag++;
  });
  return Object.keys(m).map(function(k){ return m[k]; })
    .sort(function(a,b){ return (b.cobrado+b.pagado)-(a.cobrado+a.pagado); });
}

function bitacora(enF){
  var out = [];
  S.movs.forEach(function(mv){
    if(!enF[mv.equipoId]) return;
    var e = byId(S.equipos, mv.equipoId) || {nombre:'—'};
    var credito = (Number(mv.importe)||0) - (Number(mv.recibido)||0);
    out.push({tipo:'Ingreso', id:mv.id, fecha:mv.fecha, hora:mv.hora||'', ref:folioTxt(mv.folio),
      concepto:mv.concepto, credito: credito>0? credito : 0,
      detalle: e.nombre+' · '+nom(S.categorias,e.categoriaId)+(credito>0? ' · quedó a crédito '+mxn(credito):''),
      ambito: nom(S.ediciones,e.edicionId)+' · '+nom(S.ramas,e.ramaId)+' · '+nom(S.categorias,e.categoriaId),
      de: mv.entrego || e.encargado || e.nombre, para: mv.cajero||'',
      monto: Number(mv.recibido)||0, forma: mv.forma||''});
  });
  gastosFiltrados().forEach(function(g){
    out.push({tipo:'Egreso', id:g.id, fecha:g.fecha, hora:g.hora||'', ref:folioGTxt(g.folio),
      concepto:g.concepto, detalle:etiquetaCatGasto(g)+(g.jornada? ' · '+txtJornada(g.jornada):''),
      ambito: ambitoTxtGasto(g),
      de: pagadorGasto(g)||'', para: g.beneficiario||'',
      monto: Number(g.monto)||0, forma:''});
  });
  /* las transferencias se ven en la bitácora pero no suman ni restan al resultado */
  S.transferencias.forEach(function(t){
    out.push({tipo:'Transferencia', id:t.id, fecha:t.fecha, hora:t.hora||'', ref:folioTTxt(t.folio),
      concepto:'Transferencia interna', detalle:t.detalles||'Movimiento entre cuentas de tesorería',
      ambito:'Tesorería',
      de: nombreCuenta(t.deId,t.deNombre)||'', para: nombreCuenta(t.paraId,t.paraNombre)||'',
      monto: Number(t.monto)||0, forma:''});
  });
  return out.sort(function(a,b){ return String(b.fecha+b.hora).localeCompare(String(a.fecha+a.hora)); });
}

function seccionRastreo(v, enF){
  var per = personasDinero(enF);
  var totCob = 0, totPag = 0;
  per.forEach(function(x){ totCob+=x.cobrado; totPag+=x.pagado; });

  /* --- corte por persona --- */
  var c = el('<div class="card"><header><div><h3>Quién movió el dinero</h3>'
   + '<div class="sub">Cuánto cobró y cuánto pagó cada persona de la mesa. La diferencia es lo que debería tener en mano si no ha entregado corte.</div></div>'
   + '<button class="btn sm" id="x-bit">Exportar bitácora (CSV)</button></header>'
   + '<div class="tblwrap"><table><thead><tr><th>Persona</th><th class="num">Cobró</th><th class="num">Movimientos</th>'
   + '<th class="num">Pagó egresos</th><th class="num">Movimientos</th><th class="num">En mano</th></tr></thead><tbody>'
   + (per.length? per.map(function(x){
       var dif = x.cobrado - x.pagado;
       return '<tr class="clickable" data-p="'+esc(x.nombre)+'"><td><b>'+esc(x.nombre)+'</b></td>'
        + '<td class="num">'+esc(mxn(x.cobrado))+'</td><td class="num muted">'+x.nCob+'</td>'
        + '<td class="num">'+esc(mxn(x.pagado))+'</td><td class="num muted">'+x.nPag+'</td>'
        + '<td class="num" style="font-weight:600;color:'+(dif>0?'var(--accent)':dif<0?'var(--bad)':'inherit')+'">'+esc(mxn(dif))+'</td></tr>';
     }).join('') : '<tr><td colspan="6"><div class="empty">Todavía no hay movimientos con persona registrada.</div></td></tr>')
   + '</tbody><tfoot><tr><td class="tf">Total</td><td class="num tf">'+esc(mxn(totCob))+'</td><td></td>'
   + '<td class="num tf">'+esc(mxn(totPag))+'</td><td></td>'
   + '<td class="num tf">'+esc(mxn(totCob-totPag))+'</td></tr></tfoot></table></div>'
   + '<div class="muted" style="font-size:11.5px;margin-top:9px">Da clic en una persona para ver todo lo que pasó por sus manos.</div></div>');
  v.appendChild(c);
  c.querySelectorAll('[data-p]').forEach(function(tr){ tr.onclick=function(){ abrirPersona(tr.getAttribute('data-p'), enF); }; });
  c.querySelector('#x-bit').onclick = function(){ exportarBitacora(enF); };

  /* --- ingresos por cobrador y concepto --- */
  var conCobro = per.filter(function(x){ return x.cobrado>0; });
  if(conCobro.length){
    var nombresC = [];
    conCobro.forEach(function(x){ Object.keys(x.conceptos).forEach(function(k){ if(nombresC.indexOf(k)<0) nombresC.push(k); }); });
    var ordenCat = {}; S.conceptos.forEach(function(cc,i){ ordenCat[cc.nombre]=i; });
    nombresC.sort(function(a,b){ return (ordenCat[a]==null?99:ordenCat[a]) - (ordenCat[b]==null?99:ordenCat[b]) || a.localeCompare(b,'es'); });
    var color = coloresConcepto();
    var cc1 = el('<div class="card"><header><div><h3>Ingresos por cobrador y concepto</h3>'
     + '<div class="sub">Qué cobró cada quien, desglosado por concepto.</div></div></header>'
     + '<div class="legend" id="lg2"></div><div style="height:12px"></div><div id="chp"></div></div>');
    v.appendChild(cc1);
    var lg2 = cc1.querySelector('#lg2');
    nombresC.forEach(function(k){
      lg2.appendChild(el('<span class="lgi"><span class="dot" style="background:'+color(k)+'"></span>'+esc(k)+'</span>'));
    });
    barChartApilado(cc1.querySelector('#chp'), {
      aria:'Ingresos por cobrador y concepto',
      labels: conCobro.map(function(x){ return x.nombre; }),
      series: nombresC.map(function(k){
        return {nombre:k, color:color(k), valores: conCobro.map(function(x){ return x.conceptos[k]||0; })};
      }),
      onClick: function(i){ abrirPersona(conCobro[i].nombre, enF); }
    });
  }

  /* --- egresos por beneficiario --- */
  var gs = gastosFiltrados();
  if(gs.length){
    var porBen = {}, quien = {};
    gs.forEach(function(g){
      var k = (g.beneficiario||'').trim() || SINREG();
      porBen[k] = (porBen[k]||0) + (Number(g.monto)||0);
      quien[k] = quien[k] || {};
      quien[k][(g.pagador||'').trim() || SINREG()] = 1;
    });
    var cc2 = el('<div class="card"><header><div><h3>Egresos por beneficiario</h3>'
     + '<div class="sub">A quién le sale el dinero de la liga y quién se lo entregó.</div></div></header><div id="chb"></div></div>');
    v.appendChild(cc2);
    barChart(cc2.querySelector('#chb'), Object.keys(porBen).sort(function(a,b){ return porBen[b]-porBen[a]; }).map(function(k,i){
      return {label:k, value:porBen[k], color:'var(--s2)', top:i<3,
        tip: mxn(porBen[k])+'<br>Pagado por '+esc(Object.keys(quien[k]).join(', '))};
    }), {aria:'Egresos por beneficiario', height:190, step:50, barW:32, labelH:86});
  }

  /* --- bitácora --- */
  var bit = bitacora(enF);
  var gente = [];
  bit.forEach(function(r){ [r.de, r.para].forEach(function(n){ n=(n||'').trim(); if(n && gente.indexOf(n)<0) gente.push(n); }); });
  gente.sort(function(a,b){ return a.localeCompare(b,'es'); });
  var fPer = U.dashPer||'', fTipo = U.dashTipo||'';
  var vis = bit.filter(function(r){
    return (!fTipo || r.tipo===fTipo)
        && (!fPer || (r.de||'').trim()===fPer || (r.para||'').trim()===fPer);
  });
  var sumaI = 0, sumaE = 0, sumaT = 0;
  vis.forEach(function(r){
    if(r.tipo==='Ingreso') sumaI += r.monto;
    else if(r.tipo==='Egreso') sumaE += r.monto;
    else sumaT += r.monto;                 /* transferencias: fuera del neto */
  });

  var cb = el('<div class="card"><header><div><h3>Bitácora de movimientos</h3>'
   + '<div class="sub">Cada peso que entró, salió o cambió de manos. Las transferencias se listan, pero no suman al neto.</div></div>'
   + '<div class="row">'
   + '<label class="f" style="min-width:150px"><span>Persona</span><select id="b-per"><option value="">Todas</option>'
     + gente.map(function(n){ return '<option value="'+esc(n)+'"'+(fPer===n?' selected':'')+'>'+esc(n)+'</option>'; }).join('')+'</select></label>'
   + '<label class="f" style="min-width:140px"><span>Tipo</span><select id="b-tip">'
     + ['','Ingreso','Egreso','Transferencia'].map(function(t){ return '<option value="'+t+'"'+(fTipo===t?' selected':'')+'>'+(t||'Todos')+'</option>'; }).join('')
     + '</select></label></div></header>'
   + '<div class="row" style="margin-bottom:10px"><span class="pill ok">Ingresos '+esc(mxn(sumaI))+'</span>'
   + '<span class="pill ba">Egresos '+esc(mxn(sumaE))+'</span>'
   + '<span class="pill nt">Neto '+esc(mxn(sumaI-sumaE))+'</span>'
   + (sumaT? '<span class="pill wa">Transferido '+esc(mxn(sumaT))+' (no afecta el neto)</span>':'')
   + '<span class="spacer"></span><span class="muted" style="font-size:11.5px">'+vis.length+' movimientos</span></div>'
   + '<div class="tblwrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Folio</th><th>Concepto</th><th>Entregó</th><th>Recibió</th>'
   + '<th>Ámbito</th><th class="num">Monto</th><th></th></tr></thead><tbody>'
   + (vis.length? vis.slice(0,80).map(function(r){
       var cls = r.tipo==='Ingreso'?'ok':r.tipo==='Egreso'?'ba':'wa';
       var col = r.tipo==='Ingreso'?'var(--accent)':r.tipo==='Egreso'?'var(--bad)':'var(--ink-2)';
       var sig = r.tipo==='Ingreso'?'':r.tipo==='Egreso'?'−':'↔ ';
       var bt  = r.tipo==='Ingreso'? '<button class="btn ghost sm" data-tk="'+r.id+'">Ticket</button>'
               : r.tipo==='Egreso' ? '<button class="btn ghost sm" data-tg="'+r.id+'">Ticket</button>'

/* ========== lector de .xlsx y .csv (sin librerías externas) ========== */
function leerArchivoTabla(file){
  var n = (file.name||'').toLowerCase();
  if(/\.(csv|txt|tsv)$/.test(n)) return file.text().then(function(t){ return {hojas:[{nombre:file.name, filas:parseCSV(t)}]}; });
  return file.arrayBuffer().then(leerXLSX);
}
function colIndice(ref){
  var n = 0;
  for(var i=0;i<ref.length;i++){
    var c = ref.charCodeAt(i);
    if(c>=65 && c<=90) n = n*26 + (c-64);
    else if(c>=97 && c<=122) n = n*26 + (c-96);
    else break;
  }
  return n>0? n-1 : 0;
}
function serieAFecha(n){
  n = Number(n); if(!isFinite(n)) return '';
  var ms = Math.round((n - 25569) * 86400000);      // 25569 = 1970-01-01 en serie de Excel
  var d = new Date(ms);
  if(isNaN(d.getTime())) return '';
  return d.getUTCFullYear()+'-'+z2(d.getUTCMonth()+1)+'-'+z2(d.getUTCDate());
}
function zipEntradas(buf){
  var dv = new DataView(buf), u8 = new Uint8Array(buf), i = u8.length - 22;
  for(; i>=0; i--){ if(dv.getUint32(i, true) === 0x06054b50) break; }
  if(i < 0) throw new Error('El archivo no parece un .xlsx válido.');
  var total = dv.getUint16(i+10, true), p = dv.getUint32(i+16, true), out = {}, td = new TextDecoder();
  for(var k=0;k<total;k++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    var metodo = dv.getUint16(p+10, true), comp = dv.getUint32(p+20, true);
    var ln = dv.getUint16(p+28, true), le = dv.getUint16(p+30, true), lc = dv.getUint16(p+32, true);
    var lho = dv.getUint32(p+42, true);
    var nombre = td.decode(u8.subarray(p+46, p+46+ln));
    var ln2 = dv.getUint16(lho+26, true), le2 = dv.getUint16(lho+28, true);
    var ini = lho + 30 + ln2 + le2;
    out[nombre] = {metodo:metodo, datos: u8.subarray(ini, ini+comp)};
    p += 46 + ln + le + lc;
  }
  return out;
}
function inflar(e){
  if(!e) return Promise.resolve(null);
  if(e.metodo === 0) return Promise.resolve(e.datos);
  if(typeof DecompressionStream === 'undefined')
    return Promise.reject(new Error('Este navegador no puede abrir .xlsx. Guarda la hoja como CSV e inténtalo otra vez.'));
  return new Response(new Blob([e.datos]).stream().pipeThrough(new DecompressionStream('deflate-raw')))
    .arrayBuffer().then(function(ab){ return new Uint8Array(ab); });
}
function txt(u8){ return u8? new TextDecoder('utf-8').decode(u8) : ''; }

function leerXLSX(buf){
  var zip = zipEntradas(buf);
  var pendientes = ['xl/sharedStrings.xml','xl/styles.xml','xl/workbook.xml','xl/_rels/workbook.xml.rels'];
  var hojasRuta = Object.keys(zip).filter(function(k){ return /^xl\/worksheets\/sheet\d+\.xml$/.test(k); })
    .sort(function(a,b){ return (+a.replace(/\D/g,'')) - (+b.replace(/\D/g,'')); });
  return Promise.all(pendientes.concat(hojasRuta).map(function(k){ return inflar(zip[k]); }))
  .then(function(res){
    var shared = leerShared(txt(res[0]));
    var esFecha = leerEstilos(txt(res[1]));
    var nombres = leerNombresHoja(txt(res[2]), txt(res[3]), hojasRuta);
    var hojas = hojasRuta.map(function(ruta, i){
      return {nombre: nombres[ruta] || ('Hoja '+(i+1)), filas: parseHoja(txt(res[4+i]), shared, esFecha)};
    }).filter(function(h){ return h.filas.length; });
    if(!hojas.length) throw new Error('El archivo no tiene filas con datos.');
    return {hojas:hojas};
  });
}
function leerShared(xml){
  if(!xml) return [];
  var doc = new DOMParser().parseFromString(xml, 'application/xml');
  var si = doc.getElementsByTagName('si'), out = [];
  for(var i=0;i<si.length;i++){
    var ts = si[i].getElementsByTagName('t'), s = '';
    for(var j=0;j<ts.length;j++) s += ts[j].textContent;
    out.push(s);
  }
  return out;
}
function leerEstilos(xml){
  var esFecha = {};
  if(!xml) return esFecha;
  var doc = new DOMParser().parseFromString(xml, 'application/xml');
  var fmt = {};
  var nf = doc.getElementsByTagName('numFmt');
  for(var i=0;i<nf.length;i++) fmt[nf[i].getAttribute('numFmtId')] = nf[i].getAttribute('formatCode')||'';
  var builtin = {14:1,15:1,16:1,17:1,18:1,19:1,20:1,21:1,22:1,45:1,46:1,47:1};
  var xfs = doc.getElementsByTagName('cellXfs')[0];
  if(!xfs) return esFecha;
  var lista = xfs.getElementsByTagName('xf');
  for(var k=0;k<lista.length;k++){
    var id = lista[k].getAttribute('numFmtId') || '0';
    var code = fmt[id] || '';
    esFecha[k] = !!builtin[+id] || /[dy]/.test(code.replace(/\[[^\]]*\]/g,'').replace(/"[^"]*"/g,''));
  }
  return esFecha;
}
function leerNombresHoja(wbXml, relsXml, rutas){
  var out = {};
  try{
    var wb = new DOMParser().parseFromString(wbXml, 'application/xml');
    var rels = new DOMParser().parseFromString(relsXml, 'application/xml');
    var mapa = {}, rs = rels.getElementsByTagName('Relationship');
    for(var i=0;i<rs.length;i++){
      var t = rs[i].getAttribute('Target')||'';
      mapa[rs[i].getAttribute('Id')] = 'xl/' + t.replace(/^\/?xl\//,'').replace(/^\.\//,'');
    }
    var sh = wb.getElementsByTagName('sheet');
    for(var k=0;k<sh.length;k++){
      var rid = sh[k].getAttribute('r:id') || sh[k].getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
      if(mapa[rid]) out[mapa[rid]] = sh[k].getAttribute('name');
    }
  }catch(e){}
  return out;
}
function parseHoja(xml, shared, esFecha){
  if(!xml) return [];
  var doc = new DOMParser().parseFromString(xml, 'application/xml');
  var rows = doc.getElementsByTagName('row'), out = [];
  for(var i=0;i<rows.length;i++){
    var cs = rows[i].getElementsByTagName('c'), fila = [];
    for(var j=0;j<cs.length;j++){
      var c = cs[j], col = colIndice(c.getAttribute('r')||'');
      var t = c.getAttribute('t'), st = +(c.getAttribute('s')||0);
      var v = c.getElementsByTagName('v')[0], is = c.getElementsByTagName('is')[0];
      var val = '';
      if(t === 'inlineStr' && is) val = is.textContent;
      else if(v){
        val = v.textContent;
        if(t === 's') val = shared[+val] || '';
        else if(t !== 'str' && t !== 'e' && val !== '' && esFecha[st]) val = serieAFecha(val);
      }
      while(fila.length < col) fila.push('');
      fila[col] = String(val).trim();
    }
    out.push(fila);
  }
  while(out.length && !out[out.length-1].join('')) out.pop();
  return out;
}
function parseCSV(texto){
  texto = String(texto).replace(/^﻿/,'');
  var prim = texto.split(/\r?\n/)[0] || '';
  var sep = (prim.split(';').length > prim.split(',').length) ? ';'
          : (prim.split('\t').length > prim.split(',').length) ? '\t' : ',';
  var filas = [], fila = [], campo = '', i = 0, comillas = false;
  while(i < texto.length){
    var ch = texto[i];
    if(comillas){
      if(ch === '"'){ if(texto[i+1] === '"'){ campo += '"'; i++; } else comillas = false; }
      else campo += ch;
    } else if(ch === '"') comillas = true;
    else if(ch === sep){ fila.push(campo.trim()); campo = ''; }
    else if(ch === '\n'){ fila.push(campo.trim()); filas.push(fila); fila = []; campo = ''; }
    else if(ch !== '\r') campo += ch;
    i++;
  }
  if(campo !== '' || fila.length){ fila.push(campo.trim()); filas.push(fila); }
  while(filas.length && !filas[filas.length-1].join('')) filas.pop();
  return filas;
}
/* fecha en cualquier formato razonable -> ISO */
function aISO(v){
  v = String(v||'').trim();
  if(!v) return '';
  var m = v.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return m[1]+'-'+z2(+m[2])+'-'+z2(+m[3]);
  m = v.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
  if(m){
    var a = +m[3]; if(a < 100) a += a < 40 ? 2000 : 1900;
    return a+'-'+z2(+m[2])+'-'+z2(+m[1]);
  }
  if(/^\d{5}$/.test(v)) return serieAFecha(+v);
  if(/^\d{10}$/.test(v)) return deMarca(+v * 1000);
  if(/^\d{12,14}$/.test(v)) return deMarca(+v);
  return '';
}
function deMarca(ms){
  var d = new Date(ms);
  if(isNaN(d.getTime())) return '';
  var a = d.getUTCFullYear();
  if(a < 1900 || a > 2100) return '';
  return a+'-'+z2(d.getUTCMonth()+1)+'-'+z2(d.getUTCDate());
}
function fechaCorta(iso){
  if(!iso) return '';
  var p = String(iso).split('-');
  return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : iso;
}

/* ========== identidad del jugador y regla de no duplicados ========== */
function identDe(j){ return {nombre:j.nombre||'', matricula:j.matricula||'', nac:j.nac||''}; }
function claveMat(v){ return String(v||'').replace(/[^0-9a-zA-Z]/g,'').toUpperCase(); }

/* Prioridad: matrícula > fecha de nacimiento + nombre > nombre.
   Devuelve null, {dup:true,motivo} o {aviso:true,motivo}. */
function comparaJug(a, b){
  var ma = claveMat(a.matricula), mb = claveMat(b.matricula);
  if(ma && mb) return ma === mb ? {dup:true, motivo:'misma matrícula ('+a.matricula+')'} : null;
  var na = a.nac||'', nb = b.nac||'', mismoNombre = norm(a.nombre) === norm(b.nombre) && norm(a.nombre) !== '';
  if(na && nb && na === nb){
    if(mismoNombre) return {dup:true, motivo:'misma fecha de nacimiento y mismo nombre'};
    return {aviso:true, motivo:'misma fecha de nacimiento ('+fechaCorta(na)+'), nombre distinto'};
  }
  if(mismoNombre) return {dup:true, motivo:'mismo nombre'};
  return null;
}
/* Ámbito donde un jugador no puede repetirse.
   Normal: edición + disciplina + rama (no puede estar en dos categorías).
   Relámpago (o edición marcada por categoría): además la categoría. */
function edicionPorCategoria(edId){
  var ed = byId(S.ediciones, edId);
  if(!ed) return false;
  if(typeof ed.ambitoCategoria === 'boolean') return ed.ambitoCategoria;
  return /rel[áa]mpago/i.test(ed.nombre||'');
}
function ambitoDe(e){
  return e.edicionId+'|'+e.disciplinaId+'|'+e.ramaId + (edicionPorCategoria(e.edicionId)? '|'+e.categoriaId : '');
}
function textoAmbito(e){
  return edicionPorCategoria(e.edicionId)
    ? nom(S.ediciones,e.edicionId)+' · '+nom(S.disciplinas,e.disciplinaId)+' · '+nom(S.ramas,e.ramaId)+' · '+nom(S.categorias,e.categoriaId)
    : nom(S.ediciones,e.edicionId)+' · '+nom(S.disciplinas,e.disciplinaId)+' · '+nom(S.ramas,e.ramaId);
}
/* busca al jugador dentro del ámbito del equipo destino (excluyendo su propio registro) */
function buscarRepetido(jug, destino, exceptoJugId){
  var amb = ambitoDe(destino), avisos = null;
  for(var i=0;i<S.equipos.length;i++){
    var e = S.equipos[i];
    if(ambitoDe(e) !== amb) continue;
    var js = e.jugadores||[];
    for(var k=0;k<js.length;k++){
      if(js[k].id === exceptoJugId) continue;
      var r = comparaJug(jug, js[k]);
      if(r && r.dup) return {jug:js[k], equipo:e, motivo:r.motivo, dup:true};
      if(r && r.aviso && !avisos) avisos = {jug:js[k], equipo:e, motivo:r.motivo, aviso:true};
    }
  }
  return avisos;
}
/* alta central de jugadores: aplica la regla y devuelve el resultado */
function altaJugador(equipo, datos, opciones){
  opciones = opciones || {};
  var jug = {
    id: uid('j'),
    nombre: String(datos.nombre||'').trim(),
    matricula: String(datos.matricula||'').trim(),
    nac: datos.nac||'',
    num: String(datos.num||'').trim(),
    tel: String(datos.tel||'').trim(),
    obs: String(datos.obs||'').trim(),
    cred: !!datos.cred
  };
  if(!jug.nombre) return {ignorado:true, jug:jug};
  var rep = buscarRepetido(jug, equipo);
  if(rep && rep.dup && !opciones.forzar) return {rechazado:true, jug:jug, contra:rep};
  equipo.jugadores = equipo.jugadores || [];
  equipo.jugadores.push(jug);
  return {ok:true, jug:jug, aviso: rep && rep.aviso ? rep : null};
}

/* ========== multas individuales (siguen a la persona) ========== */
function multasDe(j){
  return S.multas.filter(function(m){ var r = comparaJug(m.ident, j); return !!(r && r.dup); });
}
function saldoMultas(j){
  return multasDe(j).reduce(function(a,m){ return a + Math.max(0, (Number(m.monto)||0) - (Number(m.pagado)||0)); }, 0);
}
function nuevaMulta(ident, monto, concepto, origen, equipoId, nota){
  S.multas.push({id:uid('mu'), ident:{nombre:ident.nombre||'', matricula:ident.matricula||'', nac:ident.nac||''},
    monto:Math.round((Number(monto)||0)*100)/100, pagado:0, concepto:concepto||'Multa',
    origen:origen||'individual', equipoId:equipoId||'', fecha:hoy(), nota:nota||'', movs:[]});
}
function aplicarPagoMultas(j, monto, movId){
  var resto = Number(monto)||0;
  multasDe(j).forEach(function(m){
    if(resto <= 0) return;
    var falta = Math.max(0, (Number(m.monto)||0) - (Number(m.pagado)||0));
    if(falta <= 0) return;
    var usa = Math.min(falta, resto);
    m.pagado = Math.round(((Number(m.pagado)||0) + usa)*100)/100;
    resto = Math.round((resto - usa)*100)/100;
    m.movs = m.movs || []; if(movId) m.movs.push(movId);
  });
}
/* todas las personas con multas, con su registro actual si lo tienen */
function personasConMulta(soloPendientes){
  var grupos = [];
  S.multas.forEach(function(m){
    var g = null;
    for(var i=0;i<grupos.length;i++){
      var r = comparaJug(grupos[i].ident, m.ident);
      if(r && r.dup){ g = grupos[i]; break; }
    }
    if(!g){ g = {ident:m.ident, multas:[], total:0, pagado:0, registros:[]}; grupos.push(g); }
    g.multas.push(m);
    g.total += Number(m.monto)||0;
    g.pagado += Number(m.pagado)||0;
    if(!g.ident.matricula && m.ident.matricula) g.ident = m.ident;
  });
  grupos.forEach(function(g){
    g.saldo = Math.round((g.total - g.pagado)*100)/100;
    S.equipos.forEach(function(e){
      (e.jugadores||[]).forEach(function(j){
        var r = comparaJug(g.ident, j);
        if(r && r.dup) g.registros.push({equipo:e, jug:j});
      });
    });
  });
  if(soloPendientes) grupos = grupos.filter(function(g){ return g.saldo > 0.009; });
  return grupos.sort(function(a,b){ return b.saldo - a.saldo || String(a.ident.nombre).localeCompare(String(b.ident.nombre),'es'); });
}
function totalMultasPendientes(){
  return personasConMulta(true).reduce(function(a,g){ return a + g.saldo; }, 0);
}

/* ========== importar .xlsx / .csv ========== */
var CAMPOS_IMP = [
  {id:'equipo',    et:'Equipo',              soloEquipos:true, req:true,
   claves:['equipo','equipe','time','team','club','clube','escuadra','nombre del equipo','nome do time','nome da equipe']},
  {id:'nombre',    et:'Nombre',              req:true,
   claves:['nombre','nome','jugador','jogador','atleta','nombre completo','nome completo','nombre del jugador','first name','name']},
  {id:'apellido',  et:'Apellido (si viene aparte)',
   claves:['apellido','apellidos','sobrenome','last name','apelido']},
  {id:'matricula', et:'Matrícula',
   claves:['matricula','matrícula','documento','doc','cpf','rg','identificacion','identificación','ine','curp','cedula','cédula','dni','registro','id','numero de documento']},
  {id:'nac',       et:'Fecha de nacimiento',
   claves:['fecha de nacimiento','fecha nacimiento','nacimiento','data de nascimento','nascimento','fec nac','nac','birth','birthdate','data nasc']},
  {id:'num',       et:'Número',
   claves:['numero','número','camisa','dorsal','playera','jersey','no','n','n°','nº','num','numero de camisa']},
  {id:'tel',       et:'Teléfono',
   claves:['telefono','teléfono','celular','whatsapp','movil','móvil','fone','telefone','contacto']},
  {id:'encargado', et:'Encargado', soloEquipos:true,
   claves:['encargado','delegado','responsable','responsavel','responsável','representante','capitan','capitán',
           'capitao','capitão','tecnico','técnico','treinador','dirigente','contacto del equipo']},
  {id:'obs',       et:'Observaciones',
   claves:['observaciones','observacion','observación','observacoes','observação','notas','nota','obs','comentarios','comentario']}
];
function normEnc(s){ return norm(s).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function detectarEncabezado(filas){
  var mejor = 0, punt = -1;
  for(var i=0;i<Math.min(filas.length, 15);i++){
    var p = 0;
    filas[i].forEach(function(c){
      var t = normEnc(c); if(!t) return;
      CAMPOS_IMP.forEach(function(f){ if(f.claves.indexOf(t) >= 0) p += 2; });
      if(t.length && t.length < 30) p += 0.2;
    });
    if(p > punt){ punt = p; mejor = i; }
  }
  return punt >= 2 ? mejor : 0;
}
function autoMapear(encabezados, modo){
  var mapa = {};
  CAMPOS_IMP.forEach(function(f){
    if(f.soloEquipos && modo !== 'equipos') return;
    for(var i=0;i<encabezados.length;i++){
      var t = normEnc(encabezados[i]);
      if(!t || mapaUsado(mapa, i)) continue;
      if(f.claves.indexOf(t) >= 0){ mapa[f.id] = i; return; }
    }
    for(var k=0;k<encabezados.length;k++){
      var t2 = normEnc(encabezados[k]);
      if(!t2 || mapaUsado(mapa, k)) continue;
      for(var c=0;c<f.claves.length;c++){
        if(t2.indexOf(f.claves[c]) >= 0 && f.claves[c].length > 3){ mapa[f.id] = k; return; }
      }
    }
  });
  return mapa;
}
function mapaUsado(mapa, i){
  for(var k in mapa) if(mapa[k] === i) return true;
  return false;
}

function abrirImportador(modo, ctx){
  var estado = {hojas:null, hoja:0, enc:0, mapa:{}, filas:[]};
  var destino = modo === 'equipos'
    ? destinoTxt()
    : (function(){ var e = byId(S.equipos, ctx.equipoId); return e? e.nombre+' · '+ruta(e) : ''; })();

  var b = el('<div>'
   + '<p class="muted" style="margin-top:0;font-size:13px">'
   + (modo==='equipos'
      ? 'Desde un archivo .xlsx o .csv, o directo del API de Copa Fácil. Cada renglón es un jugador; la columna de equipo los agrupa. Se dan de alta en <b>'+esc(destino)+'</b>.'
      : 'Desde un archivo .xlsx o .csv, o directo del API de Copa Fácil, para la plantilla de <b>'+esc(destino)+'</b>.')
   + '</p>'
   + '<div class="tabsm"><button class="tabm on" data-t="arch">Archivo</button>'
   + '<button class="tabm" data-t="cf">Copa Fácil</button></div>'
   + '<div id="pan-arch"><input type="file" id="im-file" accept=".xlsx,.csv,.txt,.tsv"></div>'
   + '<div id="pan-cf" style="display:none"></div>'
   + '<div id="im-cfg" style="display:none">'
   + '<div style="height:14px"></div><div class="grid-f">'
   + '<label class="f" id="w-hoja" style="display:none"><span>Hoja</span><select id="im-hoja"></select></label>'
   + '<label class="f"><span>Renglón de encabezados</span><select id="im-enc"></select></label>'
   + '</div>'
   + '<div style="height:16px"></div><div class="eyebrow" style="margin-bottom:9px">Columnas</div>'
   + '<div class="grid-f" id="im-mapa"></div>'
   + '<div style="height:16px"></div><div class="eyebrow" style="margin-bottom:9px">Vista previa</div>'
   + '<div class="tblwrap" id="im-prev"></div>'
   + '<div style="height:16px"></div><div class="row"><span class="muted" id="im-info" style="font-size:12px"></span>'
   + '<span class="spacer"></span><button class="btn primary" id="im-ok">Importar</button></div>'
   + '</div>'
   + '<div id="im-err" class="banner" style="display:none;margin-top:14px"></div></div>');
  modal(modo==='equipos'? 'Importar equipos' : 'Importar jugadores', b, null, destino);

  var err = b.querySelector('#im-err');
  function fallo(msg){ err.style.display=''; err.textContent = msg; }

  b.querySelectorAll('.tabm').forEach(function(t){
    t.onclick = function(){
      b.querySelectorAll('.tabm').forEach(function(x){ x.classList.toggle('on', x===t); });
      var cf = t.getAttribute('data-t') === 'cf';
      b.querySelector('#pan-arch').style.display = cf? 'none':'';
      b.querySelector('#pan-cf').style.display = cf? '':'none';
      b.querySelector('#im-cfg').style.display = 'none';
      err.style.display = 'none';
      if(cf) panelCopaFacil(b.querySelector('#pan-cf'), modo, function(hoja){
        estado.hojas = [hoja]; estado.hoja = 0;
        b.querySelector('#im-cfg').style.display = '';
        recalcular(true);
        b.querySelector('#im-cfg').scrollIntoView({block:'nearest'});
      });
    };
  });

  b.querySelector('#im-file').onchange = function(ev){
    var f = ev.target.files && ev.target.files[0]; if(!f) return;
    err.style.display = 'none';
    leerArchivoTabla(f).then(function(r){
      estado.hojas = r.hojas;
      estado.hoja = 0;
      var mayor = 0;
      r.hojas.forEach(function(h,i){ if(h.filas.length > mayor){ mayor = h.filas.length; estado.hoja = i; } });
      b.querySelector('#im-cfg').style.display = '';
      var selH = b.querySelector('#im-hoja');
      if(r.hojas.length > 1){
        b.querySelector('#w-hoja').style.display = '';
        selH.innerHTML = r.hojas.map(function(h,i){ return '<option value="'+i+'"'+(i===estado.hoja?' selected':'')+'>'+esc(h.nombre)+' ('+h.filas.length+' renglones)</option>'; }).join('');
        selH.onchange = function(){ estado.hoja = +selH.value; recalcular(true); };
      }
      recalcular(true);
    }).catch(function(e){ fallo(e && e.message ? e.message : 'No se pudo leer el archivo.'); });
  };

  function recalcular(reset){
    var hoja = estado.hojas[estado.hoja];
    if(reset){
      estado.enc = detectarEncabezado(hoja.filas);
      estado.mapa = autoMapear(hoja.filas[estado.enc]||[], modo);
    }
    var selE = b.querySelector('#im-enc');
    selE.innerHTML = hoja.filas.slice(0, 15).map(function(f,i){
      return '<option value="'+i+'"'+(i===estado.enc?' selected':'')+'>'+(i+1)+' — '+esc(recorta(f.filter(Boolean).join(' | '),46) || '(vacío)')+'</option>';
    }).join('');
    selE.onchange = function(){ estado.enc = +selE.value; estado.mapa = autoMapear(hoja.filas[estado.enc]||[], modo); recalcular(false); };

    var enc = hoja.filas[estado.enc] || [];
    var cols = Math.max.apply(null, hoja.filas.map(function(f){ return f.length; }).concat([enc.length]));
    var cont = b.querySelector('#im-mapa');
    cont.innerHTML = CAMPOS_IMP.filter(function(f){ return !(f.soloEquipos && modo !== 'equipos'); }).map(function(f){
      var opts = '<option value="">— no usar —</option>';
      for(var i=0;i<cols;i++){
        var t = (enc[i]||'').trim() || ('Columna '+(i+1));
        opts += '<option value="'+i+'"'+(estado.mapa[f.id]===i?' selected':'')+'>'+esc(recorta(t,28))+'</option>';
      }
      return '<label class="f"><span>'+esc(f.et)+(f.req?' *':'')+'</span><select data-campo="'+f.id+'">'+opts+'</select></label>';
    }).join('');
    cont.querySelectorAll('[data-campo]').forEach(function(sel){
      sel.onchange = function(){
        var c = sel.getAttribute('data-campo');
        if(sel.value === '') delete estado.mapa[c]; else estado.mapa[c] = +sel.value;
        recalcular(false);
      };
    });
    pintarPrevia();
  }

  function filasDatos(){
    var hoja = estado.hojas[estado.hoja];
    return hoja.filas.slice(estado.enc + 1).filter(function(f){ return f.join('').trim() !== ''; });
  }
  function leerFila(f){
    function v(c){ var i = estado.mapa[c]; return i == null ? '' : String(f[i]||'').trim(); }
    var nombre = v('nombre'), ap = v('apellido');
    if(ap) nombre = (nombre + ' ' + ap).trim();
    return {equipo:v('equipo'), nombre:nombre, matricula:v('matricula'), nac:aISO(v('nac')),
            num:v('num'), tel:v('tel'), encargado:v('encargado'), obs:v('obs')};
  }
  function pintarPrevia(){
    var datos = filasDatos(), muestra = datos.slice(0, 8).map(leerFila);
    var campos = CAMPOS_IMP.filter(function(f){ return f.id!=='apellido' && !(f.soloEquipos && modo!=='equipos'); });
    b.querySelector('#im-prev').innerHTML = '<table><thead><tr>'
      + campos.map(function(f){ return '<th>'+esc(f.et)+'</th>'; }).join('')
      + '</tr></thead><tbody>'
      + (muestra.length? muestra.map(function(r){
          return '<tr>'+campos.map(function(f){
            var val = f.id==='nac' ? fechaCorta(r.nac) : r[f.id];
            return '<td>'+(val? esc(val) : '<span class="muted">—</span>')+'</td>';
          }).join('')+'</tr>';
        }).join('') : '<tr><td colspan="'+campos.length+'"><div class="empty">Sin renglones de datos.</div></td></tr>')
      + '</tbody></table>';
    var faltan = CAMPOS_IMP.filter(function(f){ return f.req && !(f.soloEquipos && modo!=='equipos') && estado.mapa[f.id] == null; });
    var info = b.querySelector('#im-info'), btn = b.querySelector('#im-ok');
    if(faltan.length){
      info.textContent = 'Falta asignar: ' + faltan.map(function(f){ return f.et; }).join(', ');
      btn.disabled = true;
    } else {
      info.textContent = datos.length + ' renglones listos para importar.';
      btn.disabled = !datos.length;
    }
  }

  b.querySelector('#im-ok').onclick = function(){
    var datos = filasDatos().map(leerFila);
    var rep = {altas:0, equipos:0, rechazados:[], avisos:[], ignorados:0};
    if(modo === 'equipos'){
      var porEquipo = {};
      datos.forEach(function(r){
        var nom2 = r.equipo.trim() || 'Sin equipo';
        (porEquipo[nom2] = porEquipo[nom2] || []).push(r);
      });
      Object.keys(porEquipo).forEach(function(nombre){
        var filas = porEquipo[nombre];
        var e = equiposDe({ed:U.ed, di:U.di, ra:U.ra, ca:U.ca}).filter(function(x){ return norm(x.nombre) === norm(nombre); })[0];
        if(!e){
          e = {id:uid('e'), nombre:nombre, edicionId:U.ed, disciplinaId:U.di, ramaId:U.ra, categoriaId:U.ca,
               encargado:'', tel:'', obs:'', estado:'', jugadores:[]};
          S.equipos.push(e); rep.equipos++;
        }
        var enc = filas.map(function(f){ return f.encargado; }).filter(Boolean)[0];
        if(enc && !e.encargado) e.encargado = enc;
        filas.forEach(function(r){ meter(e, r, rep); });
      });
    } else {
      var eq = byId(S.equipos, ctx.equipoId);
      if(eq) datos.forEach(function(r){ meter(eq, r, rep); });
    }
    cerrarModal(); marcar(); render();
    reporteImportacion(rep);
  };
  function meter(equipo, r, rep){
    var res = altaJugador(equipo, r);
    if(res.ignorado){ rep.ignorados++; return; }
    if(res.rechazado){ rep.rechazados.push({jug:res.jug, equipo:equipo, contra:res.contra}); return; }
    rep.altas++;
    if(res.aviso) rep.avisos.push({jug:res.jug, equipo:equipo, contra:res.aviso});
  }
}

/* ---------- reporte final de la importación ---------- */
function reporteImportacion(rep){
  function ficha(j){
    return '<b>'+esc(j.nombre)+'</b>'
     + '<br><span class="muted" style="font-size:11.5px">'
     + (j.matricula? 'Matrícula '+esc(j.matricula) : 'Sin matrícula')
     + (j.nac? ' · Nace '+esc(fechaCorta(j.nac)) : '')
     + (j.num? ' · #'+esc(j.num) : '')
     + '</span>';
  }
  function tabla(titulo, lista, sub){
    if(!lista.length) return '';
    return '<div class="eyebrow" style="margin:18px 0 8px">'+esc(titulo)+'</div>'
     + '<div class="muted" style="font-size:12px;margin-bottom:9px">'+esc(sub)+'</div>'
     + '<div class="tblwrap"><table style="min-width:640px"><thead><tr><th>Jugador del archivo</th><th>Equipo destino</th>'
     + '<th>Ya registrado como</th><th>Dónde</th><th>Motivo</th></tr></thead><tbody>'
     + lista.map(function(x){
         return '<tr><td>'+ficha(x.jug)+'</td>'
          + '<td>'+esc(x.equipo.nombre)+'<br><span class="muted" style="font-size:11.5px">'+esc(nom(S.categorias,x.equipo.categoriaId))+'</span></td>'
          + '<td>'+ficha(x.contra.jug)+'</td>'
          + '<td style="white-space:nowrap">'+esc(x.contra.equipo.nombre)
          + '<br><span class="muted" style="font-size:11px">'+esc(nom(S.categorias,x.contra.equipo.categoriaId))
          + ' · '+esc(nom(S.ediciones,x.contra.equipo.edicionId))+'</span></td>'
          + '<td><span class="pill '+(x.contra.dup?'ba':'wa')+'">'+esc(x.contra.motivo)+'</span></td></tr>';
       }).join('')
     + '</tbody></table></div>';
  }
  var b = el('<div>'
   + '<div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'
   + tile('Jugadores dados de alta', String(rep.altas), rep.equipos? rep.equipos+' equipos nuevos' : 'Sin equipos nuevos', rep.altas? 'hero':'')
   + tile('Rechazados por duplicado', String(rep.rechazados.length), 'No se registraron', rep.rechazados.length? 'neg':'')
   + tile('Por revisar', String(rep.avisos.length), 'Sí se registraron', '')
   + '</div>'
   + (rep.ignorados? '<div class="muted" style="font-size:12px;margin-top:10px">'+rep.ignorados+' renglones sin nombre se omitieron.</div>' : '')
   + tabla('No se registraron — ya están en el mismo ámbito', rep.rechazados,
       'Un jugador no puede estar en dos equipos de la misma rama y edición (en los torneos relámpago, de la misma categoría). Corrige la matrícula o dalo de baja del otro equipo si es un error.')
   + tabla('Posibles duplicados — revísalos', rep.avisos,
       'Coinciden en fecha de nacimiento pero el nombre es distinto. Sí quedaron registrados; verifica que no sea la misma persona.')
   + (!rep.rechazados.length && !rep.avisos.length && rep.altas
      ? '<div class="banner" style="margin-top:16px;background:var(--good-soft);color:var(--good)">Sin duplicados. Todos los jugadores quedaron registrados.</div>' : '')
   + '<div style="height:18px"></div><div class="row"><span class="spacer"></span>'
   + (rep.rechazados.length? '<button class="btn" id="rp-csv">Descargar los rechazados (CSV)</button>':'')
   + '<button class="btn primary" id="rp-ok">Entendido</button></div></div>');
  modal('Resultado de la importación', b, 'ancho');
  b.querySelector('#rp-ok').onclick = cerrarModal;
  var csvb = b.querySelector('#rp-csv');
  if(csvb) csvb.onclick = function(){
    var rows = [['Jugador','Matrícula','Nacimiento','Equipo destino','Categoría destino','Ya registrado como','Matrícula registrada','Equipo actual','Ubicación actual','Motivo']];
    rep.rechazados.forEach(function(x){
      rows.push([x.jug.nombre, x.jug.matricula, fechaCorta(x.jug.nac), x.equipo.nombre, nom(S.categorias,x.equipo.categoriaId),
        x.contra.jug.nombre, x.contra.jug.matricula, x.contra.equipo.nombre, ruta(x.contra.equipo), x.contra.motivo]);
    });
    descargar('duplicados-'+hoy()+'.csv','﻿'+csv(rows),'text/csv');
  };
}

/* ========== crédito del equipo repartido entre 6 ========== */
function abrirCreditoEquipo(id){
  var e = byId(S.equipos, id); if(!e) return;
  if(!permiso(e)) return conPermiso(e, function(){ abrirCreditoEquipo(id); });
  var js = e.jugadores || [];
  var b = el('<div>'
   + '<p class="muted" style="margin-top:0;font-size:13px">El adeudo se divide entre <b>6</b> y esa parte queda como multa individual '
   + 'de cada jugador que marques. La tendrán que cubrir para participar en el siguiente torneo. '
   + 'No cambia el saldo del equipo: es el registro personal de cada quien.</p>'
   + '<div class="grid-f">'
   + '<label class="f"><span>Crédito pendiente del equipo</span><input id="cr-monto" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></label>'
   + '<label class="f"><span>Entre</span><input id="cr-div" type="number" step="1" min="1" value="6"></label>'
   + '<label class="f" style="grid-column:span 2"><span>Concepto</span><input id="cr-con" value="Adeudo de equipo" placeholder="Adeudo de equipo"></label>'
   + '</div>'
   + '<div class="row" style="margin:14px 0"><span class="muted" style="font-size:12.5px">Cada jugador marcado:</span>'
   + '<span class="spacer"></span><span class="num" id="cr-cada" style="font-family:Archivo,sans-serif;font-weight:700;font-size:18px">$0.00</span></div>'
   + '<div class="eyebrow" style="margin-bottom:9px">A quién se le aplica</div>'
   + (js.length? '<div class="row" style="margin-bottom:8px"><button class="btn ghost sm" id="cr-todos">Marcar todos</button>'
        + '<button class="btn ghost sm" id="cr-nadie">Desmarcar</button></div>'
        + '<div class="implist" id="cr-list">'
        + js.map(function(j){
            var s = saldoMultas(j);
            return '<label class="impi"><input type="checkbox" data-j="'+j.id+'" checked>'
             + '<span style="flex:1;min-width:0"><span class="n">'+esc(j.nombre)+'</span>'
             + '<span class="p">'+(j.matricula? 'Matrícula '+esc(j.matricula):'Sin matrícula')+(s>0? ' · ya debe '+mxn(s):'')+'</span></span></label>';
          }).join('') + '</div>'
      : '<div class="empty">Este equipo no tiene jugadores registrados. Cárgalos primero.</div>')
   + '<div style="height:16px"></div><div class="row"><span class="spacer"></span>'
   + '<button class="btn primary" id="cr-ok"'+(js.length?'':' disabled')+'>Aplicar multa</button></div></div>');
  modal(e.nombre, b, null, 'Crédito pendiente · '+ruta(e));

  var mo = b.querySelector('#cr-monto'), dv = b.querySelector('#cr-div'), cada = b.querySelector('#cr-cada');
  function calc(){
    var d = Math.max(1, Number(dv.value)||6);
    cada.textContent = mxn(Math.round(((Number(mo.value)||0)/d)*100)/100);
  }
  mo.oninput = calc; dv.oninput = calc; calc();
  var todos = b.querySelector('#cr-todos'), nadie = b.querySelector('#cr-nadie');
  if(todos) todos.onclick = function(){ b.querySelectorAll('[data-j]').forEach(function(c){ c.checked = true; }); };
  if(nadie) nadie.onclick = function(){ b.querySelectorAll('[data-j]').forEach(function(c){ c.checked = false; }); };
  b.querySelector('#cr-ok').onclick = function(){
    var total = Number(mo.value)||0, d = Math.max(1, Number(dv.value)||6);
    if(total <= 0) return;
    var parte = Math.round((total/d)*100)/100;
    var con = b.querySelector('#cr-con').value.trim() || 'Adeudo de equipo';
    var n = 0;
    b.querySelectorAll('[data-j]').forEach(function(c){
      if(!c.checked) return;
      var j = byId(e.jugadores, c.getAttribute('data-j')); if(!j) return;
      nuevaMulta(identDe(j), parte, con, 'equipo', e.id, 'Adeudo de '+e.nombre+' repartido entre '+d);
      n++;
    });
    if(!n) return;
    cerrarModal(); marcar(); render();
    avisoSimple('Multa aplicada', n+' jugador'+(n===1?'':'es')+' quedó con '+mxn(parte)+' de multa individual. La arrastra aunque cambie de equipo, categoría o edición, hasta que se le cobre.');
  };
}
function avisoSimple(titulo, texto){
  var b = el('<div><p style="margin:0 0 16px">'+esc(texto)+'</p><div class="row"><span class="spacer"></span>'
   + '<button class="btn primary" data-ok>Entendido</button></div></div>');
  modal(titulo, b, 'slim');
  b.querySelector('[data-ok]').onclick = cerrarModal;
}

/* ========== multa individual ========== */
function abrirMultaIndividual(equipoId, jugId){
  var e = byId(S.equipos, equipoId); if(!e) return;
  var j = byId(e.jugadores||[], jugId); if(!j) return;
  var b = el('<div><div class="grid-f">'
   + '<label class="f"><span>Monto</span><input id="mi-monto" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></label>'
   + '<label class="f" style="grid-column:span 2"><span>Concepto</span><input id="mi-con" placeholder="Tarjeta roja, conducta antideportiva…"></label>'
   + '<label class="f" style="grid-column:1/-1"><span>Nota</span><input id="mi-nota" placeholder="Jornada, incidente, acuerdo…"></label>'
   + '</div><div style="height:16px"></div>'
   + '<div class="row"><span class="muted" style="font-size:12px">Es personal: no toca el saldo del equipo.</span>'
