<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B6B45">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tesorería PC">
<title>Tesorería Premier Chapingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="app-style">
:root{
  color-scheme: light;
  --page:#F1F3ED; --surface:#FBFCF9; --surface-2:#E9ECE3; --surface-3:#F6F7F2;
  --ink:#12150F; --ink-2:#545A4C; --muted:#868C79;
  --line:#DEE2D6; --line-2:#C7CCBB;
  --accent:#1B6B45; --accent-ink:#FFFFFF; --accent-soft:#E0EFE6;
  --good:#1B6B45; --good-soft:#E0EFE6;
  --warn:#8F6300; --warn-soft:#F6EDD5;
  --bad:#AE322F; --bad-soft:#F7E4E2; --on-bad:#FFFFFF;
  --apro:#1D5FA8; --apro-soft:#DDEAF8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --grid:#E4E7DC; --axis:#C7CCBB;
  --ring:0 0 0 1px rgba(18,21,15,.09);
  --shadow:0 1px 2px rgba(18,21,15,.05), 0 8px 24px -12px rgba(18,21,15,.18);
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0D0F0B; --surface:#171A15; --surface-2:#20241C; --surface-3:#1C201A;
    --ink:#F2F5EE; --ink-2:#B4BAAA; --muted:#868C79;
    --line:#292E24; --line-2:#3A4034;
    --accent:#4FB37C; --accent-ink:#0D0F0B; --accent-soft:#18291F;
    --good:#4FB37C; --good-soft:#18291F;
    --warn:#E0A62F; --warn-soft:#2A2312;
    --bad:#E06A66; --bad-soft:#2C1917; --on-bad:#1A0F0E;
    --apro:#6FA8E8; --apro-soft:#15233A;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --grid:#262B21; --axis:#3A4034;
    --ring:0 0 0 1px rgba(255,255,255,.09);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0D0F0B; --surface:#171A15; --surface-2:#20241C; --surface-3:#1C201A;
  --ink:#F2F5EE; --ink-2:#B4BAAA; --muted:#868C79;
  --line:#292E24; --line-2:#3A4034;
  --accent:#4FB37C; --accent-ink:#0D0F0B; --accent-soft:#18291F;
  --good:#4FB37C; --good-soft:#18291F;
  --warn:#E0A62F; --warn-soft:#2A2312;
  --bad:#E06A66; --bad-soft:#2C1917; --on-bad:#1A0F0E;
  --apro:#6FA8E8; --apro-soft:#15233A;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --grid:#262B21; --axis:#3A4034;
  --ring:0 0 0 1px rgba(255,255,255,.09);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Archivo",system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:"Archivo",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.spacer{flex:1}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}

/* ---------- encabezado ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px}
.crest{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-family:"Archivo",sans-serif;font-weight:800;font-size:12.5px;flex:none}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand .txt{display:block;min-width:0}
.brand .txt b{display:block;font-family:"Archivo",sans-serif;font-weight:800;font-size:15px;line-height:1.15}
.brand .txt span{display:block;font-size:11px;color:var(--muted)}
.ico{width:38px;height:38px;border-radius:10px;border:0;background:var(--surface-2);color:var(--ink-2);
  display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:var(--ring)}
.ico:hover{background:var(--line);color:var(--ink)}
.ico.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.ico{position:relative}
.ico .lk{position:absolute;right:-5px;bottom:-5px;width:17px;height:17px;border-radius:50%;
  background:var(--warn-soft);display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.ico .lk svg{width:11px;height:11px;stroke-width:2.6;stroke:var(--warn)}
.badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--bad);color:var(--on-bad);font-size:10px;font-weight:700;display:grid;place-items:center;
  box-shadow:0 0 0 2px var(--surface)}
.ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.crumbs{background:var(--surface-3);border-bottom:1px solid var(--line)}
.crumbs-in{max-width:1180px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:6px;
  overflow-x:auto;white-space:nowrap;font-size:12.5px}
.crumbs button{background:none;border:0;padding:2px 4px;cursor:pointer;color:var(--ink-2);border-radius:6px}
.crumbs button:hover{background:var(--surface-2);color:var(--ink)}
.crumbs .sep{color:var(--line-2)}
.crumbs .aqui{color:var(--ink);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:20px 18px 90px}
.view{display:flex;flex-direction:column;gap:18px}

/* ---------- primitivas ---------- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--ring);padding:16px}
.card>header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card h3{font-size:15.5px;font-weight:700}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.btn{appearance:none;border:0;border-radius:9px;padding:9px 14px;background:var(--surface-2);color:var(--ink);
  font-weight:600;font-size:13.5px;cursor:pointer;box-shadow:var(--ring);white-space:nowrap}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink-2);padding:7px 9px}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn svg{width:16px;height:16px;vertical-align:-3px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn.solo{padding:7px;line-height:0}
.btn.solo svg{width:17px;height:17px;display:block;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.45;cursor:default}
:where(button,a,input,select,textarea):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink-2);min-width:0}
input,select,textarea{background:var(--surface-3);border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;font-size:14px;width:100%}
textarea{resize:vertical;min-height:80px;font-family:"IBM Plex Mono",monospace;font-size:13px}
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.wa{background:var(--warn-soft);color:var(--warn)}
.pill.ba{background:var(--bad-soft);color:var(--bad)}
.pill.nt{background:var(--surface-2);color:var(--ink-2)}
.pill.st-completa{background:var(--good-soft);color:var(--good)}
.pill.st-credito{background:var(--warn-soft);color:var(--warn)}
.pill.st-confirmar{background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.pill.st-aprobado{background:var(--apro-soft);color:var(--apro)}
.eq{border-left:4px solid var(--line-2)}
.est-res{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.est-res span{display:inline-flex;align-items:center;gap:5px}
.candado{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;
  background:var(--warn-soft);color:var(--warn);flex:none}
.candado svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.candado.grande{width:58px;height:58px;margin:0 auto}
.candado.grande svg{width:28px;height:28px}
.nav-card .cand{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--warn);font-weight:600}
.nav-card .cand svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lgerr2{color:var(--bad);font-size:12.5px;min-height:18px;margin-top:8px}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.empty{padding:30px 20px;text-align:center;color:var(--muted);font-size:13.5px}

/* ---------- navegación por tarjetas ---------- */
.nivel{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
.nav-card{background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--ring);padding:17px 18px;
  text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:9px;min-height:118px;
  transition:transform .12s ease, box-shadow .12s ease}
.nav-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.nav-card .tt{font-family:"Archivo",sans-serif;font-weight:700;font-size:17px;line-height:1.2}
.nav-card .mt{font-size:12.5px;color:var(--muted)}
.nav-card .bar{height:4px;border-radius:2px;background:var(--accent);width:34px}
.nav-card .deb{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- tarjeta de equipo ---------- */
.equipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px}
.eq{background:var(--surface);border-radius:var(--r);box-shadow:var(--ring);padding:15px 16px;display:flex;flex-direction:column;gap:12px}
.eq-top{display:flex;align-items:flex-start;gap:10px}
.eq-nom{font-family:"Archivo",sans-serif;font-weight:700;font-size:16.5px;line-height:1.2;flex:1;min-width:0}
.eq-meta{font-size:12px;color:var(--muted);margin-top:3px}
.eq-acc{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.eq-acc.cuatro{grid-template-columns:repeat(4,1fr)}
@media (max-width:760px){.eq-acc.cuatro{grid-template-columns:repeat(2,1fr)}}
.eq-acc button{border:0;border-radius:9px;padding:9px 4px;background:var(--surface-2);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.eq-acc button:hover{background:var(--line);color:var(--ink)}
.eq-acc button.cta{background:var(--accent);color:var(--accent-ink)}
.eq-acc button.cta:hover{filter:brightness(1.08)}
.eq-acc svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nuevo{background:transparent;border:1.5px dashed var(--line-2);border-radius:var(--r);min-height:118px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:16px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer}
.chk input{width:auto;margin:0}
.implist{max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.tabsm{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabm{appearance:none;background:none;border:0;padding:8px 13px 10px;cursor:pointer;color:var(--ink-2);
  font-weight:600;font-size:13.5px;border-bottom:2px solid transparent}
.tabm:hover{color:var(--ink)}
.tabm.on{color:var(--ink);border-bottom-color:var(--accent)}
.impi{display:flex;align-items:center;gap:11px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.impi:last-child{border-bottom:0}
.impi:hover{background:var(--surface-3)}
.impi input{width:auto;margin:0;flex:none}
.impi.rep{opacity:.5;cursor:default}
.impi .n{display:block;font-weight:600;font-size:14px}
.impi .p{display:block;font-size:11.5px;color:var(--muted)}

/* ---------- buscador ---------- */
.buscador{position:relative}
.buscador input{padding:13px 15px 13px 42px;font-size:15px;border-radius:11px;background:var(--surface)}
.buscador svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;
  stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.res{display:flex;flex-direction:column;gap:1px;margin-top:12px}
.res-i{display:flex;align-items:center;gap:12px;padding:11px 13px;background:var(--surface);cursor:pointer;
  border:0;text-align:left;width:100%}
.res-i:first-child{border-radius:var(--r) var(--r) 0 0}
.res-i:last-child{border-radius:0 0 var(--r) var(--r)}
.res-i:only-child{border-radius:var(--r)}
.res-i:hover{background:var(--surface-3)}
.res-i .n{font-weight:600;font-size:14.5px}
.res-i .p{font-size:12px;color:var(--muted)}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--ring);padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.tile .v{font-family:"Archivo",sans-serif;font-weight:700;font-size:25px;letter-spacing:-.025em;line-height:1.1}
.tile .m{font-size:11.5px;color:var(--muted)}
.tile.hero{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.tile.hero .eyebrow,.tile.hero .m{color:color-mix(in srgb,var(--accent-ink) 78%,transparent)}
.tile.hero .v{font-size:30px}
.tile.neg{background:var(--bad);color:var(--on-bad);box-shadow:none}
.tile.neg .eyebrow,.tile.neg .m{color:color-mix(in srgb,var(--on-bad) 78%,transparent)}

/* ---------- gráfico ---------- */
.chartwrap{display:flex;position:relative}
.yaxis{flex:none}
.scroller{overflow-x:auto;overflow-y:hidden;flex:1;scrollbar-width:thin}
.bar{pointer-events:none}
.bar-zero{fill:var(--line-2)}
.bar-hit{fill:transparent;cursor:pointer}
.tip{position:absolute;pointer-events:none;z-index:30;background:var(--ink);color:var(--page);border-radius:8px;
  padding:8px 10px;font-size:12px;line-height:1.4;box-shadow:var(--shadow);max-width:240px;opacity:0;transition:opacity .1s}
.tip b{font-family:"Archivo",sans-serif}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.lgi{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);cursor:pointer;border:0;background:none;padding:2px 0}
.lgi.off{opacity:.35}
.axlbl{fill:var(--muted);font-size:10.5px;font-family:"IBM Plex Sans",sans-serif}
.gline{stroke:var(--grid);stroke-width:1}
.bline{stroke:var(--axis);stroke-width:1}
.vlbl{fill:var(--ink-2);font-size:10px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- tablas ---------- */
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-family:"Archivo",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);padding:0 10px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--surface-3)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.ta-r{text-align:right}
tfoot td{border-bottom:0;border-top:1px solid var(--line-2);padding-top:10px}
td.tf{font-weight:700;font-family:"Archivo",sans-serif;font-size:12.5px}
.vc{display:inline-block;margin-left:5px;font-size:10.5px;font-weight:600;color:var(--muted)}
.sec{min-width:0}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,10,7,.55);z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--surface);border-radius:15px;box-shadow:var(--shadow);width:min(680px,100%);max-height:92vh;overflow:auto}
.modal.slim{width:min(430px,100%)}
.modal.ancho{width:min(920px,100%)}
.modal>header{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:12px;
  padding:15px 18px;border-bottom:1px solid var(--line);z-index:2}
.modal>header h3{font-size:16.5px}
.modal>header .rt{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:1px}
.modal-body{padding:18px}
.jug{display:flex;align-items:center;gap:11px;padding:9px 6px;border-bottom:1px solid var(--line);
  cursor:pointer;border-radius:8px}
.jug:hover{background:var(--surface-3)}
.jug .n{width:32px;height:32px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;
  font-family:"Archivo",sans-serif;font-weight:700;font-size:12.5px;flex:none;color:var(--ink-2)}
.jug .jn{display:block;font-weight:600;font-size:14px;line-height:1.25}
.jug .jm{display:block;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- ticket 58mm ---------- */
.ticket{width:58mm;background:#fff;color:#000;padding:3mm 3mm 5mm;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;line-height:1.4;margin:0 auto}
.ticket .tk-brand{font-family:"Archivo",sans-serif;font-weight:800;font-size:14px;text-align:center;line-height:1.1}
.ticket .tk-sub{text-align:center;font-size:9px;margin-top:.6mm}
.ticket hr{border:0;border-top:1px dashed #000;margin:1.8mm 0}
.ticket .kv{display:flex;justify-content:space-between;gap:5px}
.ticket .tk-eq{font-weight:600;font-size:11.5px;line-height:1.25;margin-bottom:.4mm}
.ticket .li{display:flex;justify-content:space-between;gap:5px;margin:.4mm 0}
.ticket .big{display:flex;justify-content:space-between;font-weight:600;font-size:12.5px;margin:.6mm 0}
.ticket .aviso{text-align:center;font-size:8.5px;font-weight:600;line-height:1.3;white-space:pre-line;margin-top:1mm}
.ticket .foot{text-align:center;font-size:8.5px;margin-top:2mm;white-space:pre-line}
.ticket .sign{margin-top:7mm;border-top:1px solid #000;text-align:center;font-size:8px;padding-top:1mm}
.ticketbox{background:var(--surface-2);padding:16px;border-radius:11px;display:flex;justify-content:center}
#print-area{display:none}
@media print{
  @page{size:58mm auto;margin:0}
  body{background:#fff}
  body>*{display:none !important}
  #print-area{display:block !important}
  #print-area .ticket{width:58mm;margin:0;padding:2mm 3mm 4mm;background:#fff;color:#000}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
@media (max-width:640px){

<script id="app-code">
(function(){
"use strict";

var S = JSON.parse(document.getElementById('estado').textContent);
var COLS = ['ediciones','disciplinas','ramas','categorias','conceptos','equipos','movs','gastos','multas',
            'cuentas','transferencias','conceptosGasto'];
COLS.forEach(function(k){ S[k] = S[k] || []; });

var U = {vista:'inicio', ed:null, di:null, ra:null, ca:null, q:'', modal:null, arg:null,
         dashEd:'', dashDi:'', dashRa:'', dashPer:'', dashTipo:'', multasTodas:false, multasQ:'',
         dashAmbito:'ed',
         gfEd:'', gfRa:'', gfCa:'', gfCat:'', gfCon:'', gfJor:'', gfPag:'', gfD1:'', gfD2:'',
         cuenta:''};
try{ var su = sessionStorage.getItem('pc_ui2'); if(su) U = Object.assign(U, JSON.parse(su)); }catch(e){}
function saveUI(){ try{ sessionStorage.setItem('pc_ui2', JSON.stringify(U)); }catch(e){} }

var readOnly = false, dirty = false;

/* ========== utilidades ========== */
var AVISO_CRED = 'PAGO A CRÉDITO\nCubrir antes de su próximo juego. Si no, Disciplina puede sancionar (resta de puntos).';
function avisoCredito(){ return S.liga.avisoCredito != null ? S.liga.avisoCredito : AVISO_CRED; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function mxn(n){ n=Number(n)||0; return (n<0?'-$':'$')+Math.abs(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function mxn0(n){ n=Number(n)||0; return (n<0?'-$':'$')+Math.abs(n).toLocaleString('es-MX',{maximumFractionDigits:0}); }
function uid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function z2(x){ return (x<10?'0':'')+x; }
function hoy(){ var d=new Date(); return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate()); }
function ahora(){ var d=new Date(); return z2(d.getHours())+':'+z2(d.getMinutes()); }
function fecha(s){ if(!s) return ''; var p=String(s).slice(0,10).split('-'); return p.length===3? p[2]+'/'+p[1]+'/'+p[0] : s; }
function folioTxt(n){ return 'PC-'+String(n).padStart(5,'0'); }
/* folios independientes por tipo de operación: PC- ingresos, G- gastos, T- transferencias */
function folioGTxt(n){ return 'G-'+String(n||0).padStart(5,'0'); }
function folioTTxt(n){ return 'T-'+String(n||0).padStart(5,'0'); }
function byId(arr,id){ for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i]; return null; }
function nom(arr,id){ var x=byId(arr,id); return x? x.nombre : '—'; }
function el(html){ var t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function ico(d){ return '<svg viewBox="0 0 24 24" aria-hidden="true">'+d+'</svg>'; }
var I = {
  grafica:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  gasto:'<path d="M12 3v18M17 8H9.5a2.5 2.5 0 0 0 0 5h5a2.5 2.5 0 0 1 0 5H6"/>',
  config:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>',
  buscar:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  jug:'<path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3.2"/><path d="M19 11h4M21 9v4"/>',
  cargo:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/>',
  estado:'<path d="M3 17l5-5 3.5 3.5L21 6"/><path d="M15 6h6v6"/>',
  casa:'<path d="M4 11l8-7 8 7v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/>',
  candado:'<rect x="4.5" y="10.5" width="15" height="10" rx="2.2"/><path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/>',
  abierto:'<rect x="4.5" y="10.5" width="15" height="10" rx="2.2"/><path d="M8 10.5V7.6a4 4 0 0 1 7.7-1.4"/>',
  editar:'<path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M15 6l3 3"/>',
  multa:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16h.01"/>',
  subir:'<path d="M12 16V4M7.5 8.5L12 4l4.5 4.5"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/>',
  cuentas:'<rect x="3" y="6" width="18" height="13" rx="2.2"/><path d="M3 10h18M16.5 14.5h2"/>',
  transfer:'<path d="M4 8h13M13.5 4.5L17 8l-3.5 3.5"/><path d="M20 16H7M10.5 12.5L7 16l3.5 3.5"/>',
  persona:'<circle cx="12" cy="8" r="3.4"/><path d="M5 20v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/>',
  ticket:'<path d="M4 7.5A1.5 1.5 0 0 1 5.5 6h13A1.5 1.5 0 0 1 20 7.5V10a2 2 0 0 0 0 4v2.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 16.5V14a2 2 0 0 0 0-4z"/>'
};

/* ========== derivados ========== */
function equipoEnAmbito(e, f){
  f = f||{};
  return !!e && (!f.ed || e.edicionId===f.ed) && (!f.di || e.disciplinaId===f.di)
      && (!f.ra || e.ramaId===f.ra)   && (!f.ca || e.categoriaId===f.ca);
}
function equiposDe(f){
  return S.equipos.filter(function(e){ return equipoEnAmbito(e, f); });
}
function movsDe(id){ return S.movs.filter(function(m){ return m.equipoId===id; }); }
function saldoEquipo(id){
  var t=0; S.movs.forEach(function(m){ if(m.equipoId===id) t += (Number(m.importe)||0)-(Number(m.recibido)||0); });
  return t;
}
function cobradoEquipo(id){ var t=0; S.movs.forEach(function(m){ if(m.equipoId===id) t+=Number(m.recibido)||0; }); return t; }
function resumen(f){
  var eqs = equiposDe(f), cob=0, deb=0, jug=0;
  eqs.forEach(function(e){
    cob += cobradoEquipo(e.id);
    var s = saldoEquipo(e.id); if(s>0) deb += s;
    jug += (e.jugadores||[]).length;
  });
  return {equipos:eqs.length, cobrado:cob, deben:deb, jugadores:jug};
}
function totCobrado(f){ var t=0; equiposDe(f).forEach(function(e){ t+=cobradoEquipo(e.id); }); return t; }
function totGastos(f){ return totalGastos(f); }

/* ==========================================================================
   MODELO FINANCIERO
   Ingreso  = dinero recibido de los equipos (S.movs.recibido)      → sube el neto
   Gasto    = dinero pagado a un tercero     (S.gastos)             → baja el neto
   Transfer = dinero que pasa de una cuenta interna a otra          → neto 0
   Nada de esto se guarda calculado: todo se deriva de los movimientos.
   ========================================================================== */
var CATG = ['Partido','Premiación','Operativo','Publicidad','Otros'];
var CATG_HIST = 'Histórico';          /* gastos anteriores a esta actualización */
var CONCEPTOS_GASTO_BASE = [
  {cat:'Partido',    nombre:'Arbitraje',    monto:130},
  {cat:'Partido',    nombre:'Supervisión',  monto:50},
  {cat:'Partido',    nombre:'Coordinación', monto:50},
  {cat:'Premiación', nombre:'Trofeos',      monto:0},
  {cat:'Premiación', nombre:'Medallas',     monto:0},
  {cat:'Premiación', nombre:'Efectivo',     monto:0},
  {cat:'Publicidad', nombre:'Flyers',       monto:0},
  {cat:'Publicidad', nombre:'Lona',         monto:0}
];
var CUENTAS_BASE = ['Anabel','Primer Ligue','Adan','Piña'];

/* ---------- cuentas / integrantes de tesorería ---------- */
function cuentasActivas(){ return S.cuentas.filter(function(c){ return c.activa !== false; }); }
function cuentaPorId(id){ return byId(S.cuentas, id); }
function cuentaPorNombre(n){
  var k = norm(n).trim(); if(!k) return null;
  for(var i=0;i<S.cuentas.length;i++) if(norm(S.cuentas[i].nombre).trim()===k) return S.cuentas[i];
  return null;
}
function nombreCuenta(id, alt){ var c = cuentaPorId(id); return c? c.nombre : (alt||''); }
/* quién pagó un gasto: la cuenta si está ligada, el texto histórico si no */
function pagadorGasto(g){ return g.pagadorId? nombreCuenta(g.pagadorId, g.pagador) : (g.pagador||''); }
function cuentaDeGasto(g){
  if(g.pagadorId && cuentaPorId(g.pagadorId)) return g.pagadorId;
  var c = cuentaPorNombre(g.pagador);
  return c? c.id : '';
}
function opcionesCuenta(sel, incluir){
  var vistas = {}, out = [];
  S.cuentas.forEach(function(c){
    if(c.activa === false && c.id !== sel) return;
    vistas[c.id] = 1;
    out.push('<option value="'+esc(c.id)+'"'+(c.id===sel?' selected':'')+'>'+esc(c.nombre)+'</option>');
  });
  if(sel && !vistas[sel]){
    var c2 = cuentaPorId(sel);
    if(c2) out.push('<option value="'+esc(c2.id)+'" selected>'+esc(c2.nombre)+' (inactiva)</option>');
  }
  if(incluir) out.unshift('<option value="">'+esc(incluir)+'</option>');
  return out.join('');
}

/* ---------- ámbito deportivo de un gasto ---------- */
function gastoEnAmbito(g, f){
  f = f||{};
  if(f.ed && g.edicionId    !== f.ed) return false;
  if(f.di && g.disciplinaId !== f.di) return false;
  if(f.ra && g.ramaId       !== f.ra) return false;
  if(f.ca && g.categoriaId  !== f.ca) return false;
  return true;
}
function gastosAmbito(f){ return S.gastos.filter(function(g){ return gastoEnAmbito(g, f); }); }
function totalGastos(f){
  return gastosAmbito(f).reduce(function(a,g){ return a+(Number(g.monto)||0); }, 0);
}
function ingresosAmbito(f){
  var en = {}; equiposDe(f).forEach(function(e){ en[e.id]=1; });
  return S.movs.reduce(function(a,m){ return en[m.equipoId]? a+(Number(m.recibido)||0) : a; }, 0);
}
function pendienteAmbito(f){
  var t = 0;
  equiposDe(f).forEach(function(e){ var s = saldoEquipo(e.id); if(s>0) t += s; });
  return t;
}
/* NETO = INGRESOS REALES − GASTOS REALES (las transferencias no entran) */
function netoAmbito(f){ return ingresosAmbito(f) - totalGastos(f); }
function catGasto(g){ return g.categoriaGasto || CATG_HIST; }
function etiquetaCatGasto(g){
  return g.categoriaGasto || (g.categoria? CATG_HIST+' · '+g.categoria : CATG_HIST);
}
function gastosPorCatGasto(f){
  var m = {};
  gastosAmbito(f).forEach(function(g){ var k = catGasto(g); m[k] = (m[k]||0)+(Number(g.monto)||0); });
  return m;
}
function gastosPorConcepto(f, cat){
  var m = {};
  gastosAmbito(f).forEach(function(g){
    if(cat && catGasto(g)!==cat) return;
    var k = (g.concepto||'').trim() || '(sin concepto)';
    m[k] = (m[k]||0)+(Number(g.monto)||0);
  });
  return m;
}
function ambitoTxtGasto(g){
  var p = [];
  if(g.edicionId)    p.push(nom(S.ediciones, g.edicionId));
  if(g.disciplinaId) p.push(nom(S.disciplinas, g.disciplinaId));
  if(g.ramaId)       p.push(nom(S.ramas, g.ramaId));
  if(g.categoriaId)  p.push(nom(S.categorias, g.categoriaId));
  return p.join(' · ') || 'Sin clasificar';
}

/* ---------- transferencias ---------- */
function transferenciasDe(id){
  return S.transferencias.filter(function(t){ return t.deId===id || t.paraId===id; });
}
function transferenciasEnviadas(id){
  return S.transferencias.filter(function(t){ return t.deId===id; })
    .reduce(function(a,t){ return a+(Number(t.monto)||0); }, 0);
}
function transferenciasRecibidas(id){
  return S.transferencias.filter(function(t){ return t.paraId===id; })
    .reduce(function(a,t){ return a+(Number(t.monto)||0); }, 0);
}

/* ---------- estado de cuenta de un integrante ----------
   El saldo SIEMPRE sale de estos movimientos; nunca se guarda a mano. */
function movsCuenta(id){
  var c = cuentaPorId(id); if(!c) return [];
  var nm = norm(c.nombre).trim(), out = [];
  S.transferencias.forEach(function(t){
    if(t.paraId===id) out.push({fecha:t.fecha, hora:t.hora||'', tipo:'Transferencia', folio:folioTTxt(t.folio),
      concepto:'Transferencia recibida', detalles:'De '+nombreCuenta(t.deId,t.deNombre)+(t.detalles? ' · '+t.detalles:''),
      entra:Number(t.monto)||0, sale:0, tkT:t.id});
    if(t.deId===id)  out.push({fecha:t.fecha, hora:t.hora||'', tipo:'Transferencia', folio:folioTTxt(t.folio),
      concepto:'Transferencia enviada', detalles:'Para '+nombreCuenta(t.paraId,t.paraNombre)+(t.detalles? ' · '+t.detalles:''),
      entra:0, sale:Number(t.monto)||0, tkT:t.id});
  });
  S.gastos.forEach(function(g){
    if(cuentaDeGasto(g)!==id) return;
    out.push({fecha:g.fecha, hora:g.hora||'', tipo:'Gasto', folio:folioGTxt(g.folio),
      concepto:g.concepto||'Gasto', detalles:etiquetaCatGasto(g)+(g.beneficiario? ' · recibió '+g.beneficiario:''),
      entra:0, sale:Number(g.monto)||0, tkG:g.id});
  });
  if(nm) S.movs.forEach(function(m){
    var r = Number(m.recibido)||0;
    if(r<=0 || norm(m.cajero).trim()!==nm) return;
    var e = byId(S.equipos, m.equipoId) || {nombre:'—'};
    out.push({fecha:m.fecha, hora:m.hora||'', tipo:'Ingreso', folio:folioTxt(m.folio),
      concepto:m.concepto||'Cobro', detalles:'Cobrado a '+e.nombre,
      entra:r, sale:0, tk:m.id});
  });
  return out.sort(function(a,b){
    return String(a.fecha+a.hora).localeCompare(String(b.fecha+b.hora)) || String(a.folio).localeCompare(String(b.folio));
  });
}
function saldoCuenta(id){
  return movsCuenta(id).reduce(function(a,x){ return a + x.entra - x.sale; }, 0);
}
function resumenCuenta(id){
  var ms = movsCuenta(id), r = {saldo:0, cobrado:0, recibido:0, transferido:0, gastos:0, n:ms.length};
  ms.forEach(function(x){
    r.saldo += x.entra - x.sale;
    if(x.tipo==='Ingreso') r.cobrado += x.entra;
    else if(x.tipo==='Gasto') r.gastos += x.sale;
    else { r.recibido += x.entra; r.transferido += x.sale; }
  });
  return r;
}

/* ---------- jornadas y partidos ---------- */
function jornadasTope(){
  var n = Number(S.liga.jornadas)||10;
  S.gastos.forEach(function(g){ if((Number(g.jornada)||0) > n) n = Number(g.jornada); });
  S.movs.forEach(function(m){ if((Number(m.jornada)||0) > n) n = Number(m.jornada); });
  return Math.max(1, n);
}
function txtJornada(n){ n = Number(n)||0; return n? 'J'+n : 'Sin jornada'; }
function parEquipos(a, b){ return [a||'', b||''].sort().join('~'); }
function clavePartido(ed, di, ra, ca, jor, a, b){
  return [ed||'', di||'', ra||'', ca||'', Number(jor)||0, parEquipos(a,b)].join('|');
}
function nombreEquipo(id){ var e = byId(S.equipos, id); return e? e.nombre : ''; }
/* Arma las filas de jornada cruzando gastos de partido con los ingresos que
   el usuario asoció explícitamente. Nunca inventa asociaciones. */
function partidosAmbito(f){
  var m = {}, orden = [];
  function reg(k, base){
    if(!m[k]){
      m[k] = {clave:k, jornada:base.jornada||0, aId:base.aId||'', bId:base.bId||'',
              ed:base.ed||'', di:base.di||'', ra:base.ra||'', ca:base.ca||'',
              ingreso:0, pendiente:0, totalGasto:0, conceptos:{}, nGastos:0};
      orden.push(k);
    }
    return m[k];
  }
  gastosAmbito(f).forEach(function(g){
    if(g.categoriaGasto !== 'Partido') return;
    if(!g.jornada && !g.equipoAId && !g.equipoBId) return;   /* sin datos de partido */
    var p = reg(clavePartido(g.edicionId,g.disciplinaId,g.ramaId,g.categoriaId,g.jornada,g.equipoAId,g.equipoBId),
      {jornada:g.jornada, aId:g.equipoAId, bId:g.equipoBId,
       ed:g.edicionId, di:g.disciplinaId, ra:g.ramaId, ca:g.categoriaId});
    var mo = Number(g.monto)||0;
    p.totalGasto += mo; p.nGastos++;
    var cn = (g.concepto||'').trim() || '(sin concepto)';
    p.conceptos[cn] = (p.conceptos[cn]||0) + mo;
  });
  var sueltos = [];
  S.movs.forEach(function(mv){
    var jor = Number(mv.jornada)||0; if(!jor) return;
    var e = byId(S.equipos, mv.equipoId); if(!equipoEnAmbito(e, f)) return;
    var reg2 = {mv:mv, e:e, jor:jor};
    if(mv.rivalId){
      var p = reg(clavePartido(e.edicionId,e.disciplinaId,e.ramaId,e.categoriaId,jor,e.id,mv.rivalId),
        {jornada:jor, aId:e.id, bId:mv.rivalId, ed:e.edicionId, di:e.disciplinaId, ra:e.ramaId, ca:e.categoriaId});
      p.ingreso    += Number(mv.recibido)||0;
      p.pendiente  += Math.max(0,(Number(mv.importe)||0)-(Number(mv.recibido)||0));
    } else sueltos.push(reg2);
  });
  /* ingreso con jornada pero sin rival: solo se asigna si hay UN partido posible */
  sueltos.forEach(function(x){
    var cand = orden.filter(function(k){
      var p = m[k];
      return p.jornada===x.jor && p.ed===x.e.edicionId && p.di===x.e.disciplinaId
          && p.ra===x.e.ramaId && p.ca===x.e.categoriaId && (p.aId===x.e.id || p.bId===x.e.id);
    });
    var p = cand.length===1
      ? m[cand[0]]
      : reg(clavePartido(x.e.edicionId,x.e.disciplinaId,x.e.ramaId,x.e.categoriaId,x.jor,x.e.id,''),
          {jornada:x.jor, aId:x.e.id, bId:'', ed:x.e.edicionId, di:x.e.disciplinaId, ra:x.e.ramaId, ca:x.e.categoriaId});

/* ========== guardado en el servidor ========== */
var API = 'api.php';
var rev = 0, base = null, modoLocal = false, guardando = false, timer = null, poll = null, downloadsApi = null;
var SYNC = ['ediciones','disciplinas','ramas','categorias','conceptos','equipos','movs','gastos',
            'multas','cuentas','transferencias','conceptosGasto'];

function clon(x){ return JSON.parse(JSON.stringify(x)); }

function pedir(accion, cuerpo){
  var op = {method: cuerpo?'POST':'GET', headers:{'Accept':'application/json'}, credentials:'same-origin'};
  if(cuerpo){ op.headers['Content-Type']='application/json'; op.body=JSON.stringify(cuerpo); }
  return fetch(API+'?a='+accion, op).then(function(r){
    if(r.status===401) return {ok:false, auth:false};
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  });
}

/* Fusión a tres bandas: servidor + local, con la última copia sincronizada como
   base para distinguir "esto lo agregué yo" de "esto lo borró el otro". */
function fusionar(srv, loc, bs){
  var out = clon(srv);
  SYNC.forEach(function(k){
    var sa=srv[k]||[], la=loc[k]||[], ba=(bs&&bs[k])||[];
    var mapL={}, mapS={}, enBase={};
    la.forEach(function(x){ mapL[x.id]=x; });
    sa.forEach(function(x){ mapS[x.id]=x; });
    ba.forEach(function(x){ enBase[x.id]=1; });
    var res=[];
    sa.forEach(function(x){
      if(mapL[x.id]) res.push(mapL[x.id]);        // está en los dos: gana mi versión
      else if(!enBase[x.id]) res.push(x);         // alta del otro usuario
      /* si estaba en la base y ya no lo tengo, yo lo borré: se omite */
    });
    la.forEach(function(x){
      if(!mapS[x.id] && !enBase[x.id]) res.push(x); // alta mía que el servidor no conoce
    });
    out[k] = res;
  });
  out.liga = (bs && JSON.stringify(bs.liga)!==JSON.stringify(loc.liga)) ? clon(loc.liga) : clon(srv.liga);
  /* contraseñas de categoría: se combinan clave por clave, gana la que cambió */
  var cs = srv.claves || {}, cl = loc.claves || {}, cb = (bs && bs.claves) || {}, res = {};
  Object.keys(cs).forEach(function(k){ res[k] = cs[k]; });
  Object.keys(cl).forEach(function(k){ if(cl[k] !== cb[k]) res[k] = cl[k]; });
  Object.keys(cb).forEach(function(k){ if(!(k in cl) && cb[k] === cs[k]) delete res[k]; });
  out.claves = res;
  /* contraseña de administración: gana la que cambió respecto a la base */
  out.admin = (bs && JSON.stringify(bs.admin) !== JSON.stringify(loc.admin)) ? clon(loc.admin || {clave:'',secc:{}}) : clon(srv.admin || {clave:'',secc:{}});
  var maxF = 1;
  (out.movs||[]).forEach(function(m){ if(m.folio>=maxF) maxF = m.folio+1; });
  out.liga.folio = Math.max(maxF, (srv.liga&&srv.liga.folio)||1, (loc.liga&&loc.liga.folio)||1);
  /* mismos cuidados para los folios de gasto y de transferencia */
  var maxG = 1;
  (out.gastos||[]).forEach(function(g){ if(g.folio>=maxG) maxG = g.folio+1; });
  out.liga.folioGasto = Math.max(maxG, (srv.liga&&srv.liga.folioGasto)||1, (loc.liga&&loc.liga.folioGasto)||1);
  var maxT = 1;
  (out.transferencias||[]).forEach(function(t){ if(t.folio>=maxT) maxT = t.folio+1; });
  out.liga.folioTransf = Math.max(maxT, (srv.liga&&srv.liga.folioTransf)||1, (loc.liga&&loc.liga.folioTransf)||1);
  return out;
}

/* Red de seguridad para la transición: si el servidor todavía no conoce una
   colección nueva —porque una pestaña con la versión anterior del archivo guardó
   encima— no se pierde la copia local. Hay que mirar el JSON crudo ANTES de
   normalizarlo, porque normaliza() crea las propiedades faltantes. */
var COLS_NUEVAS = ['cuentas','transferencias','conceptosGasto'];
function faltantes(crudo){
  return COLS_NUEVAS.filter(function(k){ return !crudo || !(k in crudo); });
}
function restaurar(faltan, destino, local){
  faltan.forEach(function(k){
    if(local && (local[k]||[]).length) destino[k] = clon(local[k]);
  });
  return destino;
}

function normaliza(j){
  j = j || {};
  j.liga = j.liga || {nombre:'PREMIER CHAPINGO', pie:'', folio:1, cajero:'', cajeros:[]};
  j.liga.cajeros = j.liga.cajeros || [];
  if(!j.claves || typeof j.claves !== 'object' || Array.isArray(j.claves)) j.claves = {};
  if(!j.admin || typeof j.admin !== 'object' || Array.isArray(j.admin)) j.admin = {clave:'', secc:{}};
  if(!j.admin.secc || typeof j.admin.secc !== 'object' || Array.isArray(j.admin.secc)) j.admin.secc = {};
  SYNC.forEach(function(k){ j[k] = j[k] || []; });
  return migrar(j);
}

function marcar(){ dirty=true; clearTimeout(timer); timer=setTimeout(guardar,1200); pintarBarraGuardado(); }

function guardar(){
  clearTimeout(timer);
  if(!dirty || guardando) return;
  saveUI();
  if(modoLocal){
    try{ localStorage.setItem('pc_estado2', JSON.stringify(S)); dirty=false; }catch(e){}
    pintarBarraGuardado(); return;
  }
  guardando = true; pintarBarraGuardado();
  pedir('guardar', {rev:rev, estado:S}).then(function(r){
    guardando = false;
    if(r.auth === false){ pedirClave(); return; }
    if(r.conflicto){
      var falt = faltantes(r.estado), prev = S;
      S = restaurar(falt, fusionar(normaliza(r.estado), S, base), prev);
      rev = r.rev; base = clon(S);
      pintarBarraGuardado(); render();
      guardar();                                  // reintenta con la revisión nueva
      return;
    }
    if(r.ok){ rev = r.rev; base = clon(S); dirty = false; }
    pintarBarraGuardado(!r.ok);
  }).catch(function(){
    guardando = false; pintarBarraGuardado(true);
    try{ localStorage.setItem('pc_estado2_respaldo', JSON.stringify(S)); }catch(e){}
  });
}

function refrescar(){
  if(modoLocal || dirty || guardando || document.querySelector('.scrim')) return;
  pedir('rev').then(function(r){
    if(r && r.ok && r.rev > rev){
      return pedir('estado').then(function(e){
        if(e && e.ok){
          var falt = faltantes(e.estado), prev = S;
          S = restaurar(falt, normaliza(e.estado), prev);
          rev = e.rev; base = clon(S);
          if(falt.length && COLS_NUEVAS.some(function(k){ return (S[k]||[]).length; })){
            dirty = true; guardar();          // devuelve al servidor lo que le faltaba
          }
          render();
        }
      });
    }
  }).catch(function(){});
}

function pintarBarraGuardado(error){
  var n = document.getElementById('savebar'); if(!n) return;
  var txt = guardando ? 'Guardando…'
          : error     ? 'Sin conexión'
          : dirty     ? 'Sin guardar'
          : modoLocal ? 'Guardado en este equipo'
                      : 'Guardado';
  n.innerHTML = '<span class="savedot'+(dirty||error?' dirty':'')+'"></span>'
   + '<span class="muted" style="font-size:12px">'+esc(txt)+'</span>'
   + ((dirty||error)? ' <button class="btn sm primary" id="btn-guardar">Guardar</button>':'')
   + (modoLocal? '' : ' <button class="btn ghost sm" id="btn-salir">Salir</button>');
  var b=document.getElementById('btn-guardar'); if(b) b.onclick = guardar;
  var x=document.getElementById('btn-salir');
  if(x) x.onclick = function(){ pedir('salir').then(function(){ location.reload(); }).catch(function(){ location.reload(); }); };
}

/* ========== gráfico de barras vertical ========== */
function barChart(host, data, opt){
  opt = opt||{};
  host.innerHTML = '';
  if(!data.length){ host.innerHTML = '<div class="empty">Sin datos todavía.</div>'; return; }
  var plotH=opt.height||240, step=opt.step||38, barW=opt.barW||26, labelH=opt.labelH||96;
  var padT=16, padL=opt.padL||64, W=Math.max(padL+data.length*step+12,40), H=plotH+padT+labelH;
  var max=0; data.forEach(function(d){ max=Math.max(max, d.value||0); });
  var ticks=niceTicks(max), top=ticks[ticks.length-1]||1;
  var y=function(v){ return padT+plotH-(v/top)*plotH; };
  var wrap = el('<div class="chartwrap"></div>');
  var ys = ['<svg class="yaxis" width="62" height="'+H+'" role="presentation">'];
  ticks.forEach(function(t){ ys.push('<text class="axlbl" x="56" y="'+(y(t)+3.5)+'" text-anchor="end">'+esc(mxn0(t))+'</text>'); });
  ys.push('<line class="bline" x1="61.5" y1="'+padT+'" x2="61.5" y2="'+(padT+plotH)+'"></line></svg>');
  wrap.appendChild(el(ys.join('')));
  var s = ['<svg width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(opt.aria||'Gráfico')+'">'];
  ticks.forEach(function(t){ s.push('<line class="gline" x1="0" y1="'+y(t)+'" x2="'+W+'" y2="'+y(t)+'"></line>'); });
  s.push('<line class="bline" x1="0" y1="'+(padT+plotH)+'" x2="'+W+'" y2="'+(padT+plotH)+'"></line>');
  data.forEach(function(d,k){
    var x=padL+k*step+(step-barW)/2, v=Number(d.value)||0, yy=y(v), h=padT+plotH-yy, r=Math.min(4,barW/2,Math.max(h,0));
    if(v>0&&h<2){ h=2; yy=padT+plotH-2; r=0; }
    if(h>0) s.push('<path class="bar" data-i="'+k+'" fill="'+d.color+'" d="M'+x+','+(padT+plotH)+' V'+(yy+r)
      +' Q'+x+','+yy+' '+(x+r)+','+yy+' H'+(x+barW-r)+' Q'+(x+barW)+','+yy+' '+(x+barW)+','+(yy+r)
      +' V'+(padT+plotH)+' Z"></path>');
    else s.push('<rect class="bar bar-zero" data-i="'+k+'" x="'+x+'" y="'+(padT+plotH-2)+'" width="'+barW+'" height="2"></rect>');
    if(d.top) s.push('<text class="vlbl" x="'+(x+barW/2)+'" y="'+(yy-5)+'" text-anchor="middle">'+esc(mxn0(v))+'</text>');
    s.push('<text class="axlbl" transform="rotate(-45,'+(x+barW/2)+','+(padT+plotH+12)+')" x="'+(x+barW/2)+'" y="'+(padT+plotH+12)+'" text-anchor="end">'+esc(recorta(d.label,18))+'</text>');
    s.push('<rect class="bar-hit" data-i="'+k+'" x="'+(padL+k*step)+'" y="'+padT+'" width="'+step+'" height="'+(plotH+labelH)+'"></rect>');
  });
  s.push('</svg>');
  var sc = el('<div class="scroller"></div>'); sc.appendChild(el(s.join('')));
  wrap.appendChild(sc);
  var tip = el('<div class="tip"></div>'); wrap.appendChild(tip);
  host.appendChild(wrap);
  sc.addEventListener('mousemove', function(ev){
    var t=ev.target.closest('[data-i]'); if(!t){ tip.style.opacity=0; return; }
    var d=data[+t.getAttribute('data-i')]; if(!d) return;
    tip.innerHTML='<b>'+esc(d.label)+'</b><br>'+(d.tip||esc(mxn(d.value)));
    tip.style.opacity=1;
    var hb=wrap.getBoundingClientRect();
    tip.style.left=Math.min(ev.clientX-hb.left+12, wrap.clientWidth-tip.offsetWidth-6)+'px';
    tip.style.top=Math.max(ev.clientY-hb.top-10,0)+'px';
  });
  sc.addEventListener('mouseleave', function(){ tip.style.opacity=0; });
  if(opt.onClick) sc.addEventListener('click', function(ev){
    var t=ev.target.closest('[data-i]'); if(t) opt.onClick(data[+t.getAttribute('data-i')]);
  });
}
function recorta(s,n){ s=String(s); return s.length>n? s.slice(0,n-1)+'…':s; }
function niceTicks(max){
  if(!(max>0)) return [0];
  var raw=max/4, mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)), n=raw/mag;
  var st=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag, out=[], v=0;
  while(v<max+st*0.001){ out.push(Math.round(v*100)/100); v+=st; }
  if(out[out.length-1]<max) out.push(Math.round((out[out.length-1]+st)*100)/100);
  return out;
}

     + '<span class="sep">/</span><span class="aqui">'+t+'</span></div></div>';
  }
  if(!U.ed) return '';
  var p = ['<button data-miga="inicio">Inicio</button>'];
  function add(txt, tag, ultimo){
    p.push('<span class="sep">/</span>');
    p.push(ultimo? '<span class="aqui">'+esc(txt)+'</span>' : '<button data-miga="'+tag+'">'+esc(txt)+'</button>');
  }
  add(nom(S.ediciones,U.ed),'ed', !U.di);
  if(U.di) add(nom(S.disciplinas,U.di),'di', !U.ra);
  if(U.ra) add(nom(S.ramas,U.ra),'ra', !U.ca);
  if(U.ca) add(nom(S.categorias,U.ca),'ca', true);
  return '<div class="crumbs"><div class="crumbs-in">'+p.join('')+'</div></div>';
}

function pintarResultados(host){
  host.innerHTML = '';
  var q = norm(U.q).trim();
  if(!q) return;
  var hits = [];
  S.equipos.forEach(function(e){
    if(norm(e.nombre).indexOf(q)>=0) hits.push({e:e, por:''});
    else {
      var j = (e.jugadores||[]).filter(function(x){
        return norm(x.nombre).indexOf(q)>=0 || (x.matricula && String(x.matricula).indexOf(q)>=0); });
      if(j.length) hits.push({e:e, por:'Jugador: '+j[0].nombre+(j[0].matricula? ' ('+j[0].matricula+')':'')});
    }
  });
  if(!hits.length){ host.appendChild(el('<div class="card"><div class="empty">Sin coincidencias para “'+esc(U.q)+'”.</div></div>')); return; }
  var cont = el('<div class="res"></div>');
  hits.slice(0,40).forEach(function(h){
    var s = saldoEquipo(h.e.id);
    var it = el('<button class="res-i"><span style="flex:1;min-width:0">'
     + '<span class="n">'+esc(h.e.nombre)+'</span><br>'
     + '<span class="p">'+esc(ruta(h.e))+(h.por? ' · '+esc(h.por):'')+'</span></span>'
     + pillEstado(h.e)+pillSaldo(s)+'</button>');
    it.onclick = function(){
      irA('equipos',{ed:h.e.edicionId, di:h.e.disciplinaId, ra:h.e.ramaId, ca:h.e.categoriaId, q:''});
      if(permiso(h.e)) abrirCargo(h.e.id);
    };
    cont.appendChild(it);
  });
  host.appendChild(cont);
  if(hits.length>40) host.appendChild(el('<div class="muted" style="font-size:12px;padding:8px 4px">Se muestran 40 de '+hits.length+' resultados.</div>'));
}

/* ---------- importar equipos de otras ediciones ---------- */
function importarEquipos(){
  var yaAqui = {};
  equiposDe({ed:U.ed, di:U.di, ra:U.ra, ca:U.ca}).forEach(function(e){ yaAqui[norm(e.nombre)] = 1; });
  var candidatos = S.equipos.filter(function(e){
    return !(e.edicionId===U.ed && e.disciplinaId===U.di && e.ramaId===U.ra && e.categoriaId===U.ca);
  });
  var sel = {};
  var b = el('<div>'
   + '<div class="grid-f" style="margin-bottom:12px">'
   + '<label class="f"><span>Edición de origen</span><select id="i-ed"><option value="">Todas</option>'
     + S.ediciones.map(function(x){ return '<option value="'+x.id+'">'+esc(x.nombre)+'</option>'; }).join('')+'</select></label>'
   + '<label class="f"><span>Disciplina</span><select id="i-di"><option value="">Todas</option>'
     + S.disciplinas.map(function(x){ return '<option value="'+x.id+'">'+esc(x.nombre)+'</option>'; }).join('')+'</select></label>'
   + '<label class="f" style="grid-column:span 2"><span>Buscar</span><input id="i-q" placeholder="Nombre del equipo…"></label>'
   + '</div>'
   + '<div class="row" style="margin-bottom:10px">'
   + '<label class="chk"><input type="checkbox" id="i-jug" checked> Traer también a los jugadores</label>'
   + '<span class="spacer"></span><button class="btn ghost sm" id="i-todos">Marcar todos</button></div>'
   + '<div class="implist" id="i-list"></div>'
   + '<div style="height:14px"></div><div class="row">'
   + '<span class="muted" style="font-size:12px">Llegan a '+esc(destinoTxt())+' con saldo en cero.</span>'
   + '<span class="spacer"></span><button class="btn primary" id="i-ok">Importar</button></div></div>');
  modal('Importar equipos', b, null, 'Equipos que ya participaron en otra edición, rama o categoría');

  var lista = b.querySelector('#i-list');
  function pinta(){
    var qe = b.querySelector('#i-ed').value, qd = b.querySelector('#i-di').value, q = norm(b.querySelector('#i-q').value);
    var vis = candidatos.filter(function(e){
      return (!qe || e.edicionId===qe) && (!qd || e.disciplinaId===qd) && (!q || norm(e.nombre).indexOf(q)>=0);
    }).sort(function(a,b2){ return a.nombre.localeCompare(b2.nombre,'es'); });
    if(!vis.length){ lista.innerHTML = '<div class="empty">Ningún equipo coincide.</div>'; actualiza(); return; }
    lista.innerHTML = vis.map(function(e){
      var rep = yaAqui[norm(e.nombre)];
      var nj = (e.jugadores||[]).length;
      return '<label class="impi'+(rep?' rep':'')+'">'
       + '<input type="checkbox" data-i="'+e.id+'"'+(sel[e.id]?' checked':'')+(rep?' disabled':'')+'>'
       + '<span style="flex:1;min-width:0"><span class="n">'+esc(e.nombre)+'</span>'
       + '<span class="p">'+esc(ruta(e))+' · '+nj+' jugador'+(nj===1?'':'es')+'</span></span>'
       + (rep? '<span class="pill nt">Ya está aquí</span>':'')+'</label>';
    }).join('');
    lista.querySelectorAll('[data-i]').forEach(function(c){
      c.onchange = function(){ if(c.checked) sel[c.getAttribute('data-i')]=1; else delete sel[c.getAttribute('data-i')]; actualiza(); };
    });
    actualiza();
  }
  function actualiza(){
    var n = Object.keys(sel).length;
    var btn = b.querySelector('#i-ok');
    btn.textContent = n? 'Importar '+n+' equipo'+(n===1?'':'s') : 'Importar';
    btn.disabled = !n;
  }
  b.querySelector('#i-ed').onchange = pinta;
  b.querySelector('#i-di').onchange = pinta;
  b.querySelector('#i-q').oninput = pinta;
  b.querySelector('#i-todos').onclick = function(){
    lista.querySelectorAll('[data-i]:not(:disabled)').forEach(function(c){ c.checked = true; sel[c.getAttribute('data-i')]=1; });
    actualiza();
  };
  b.querySelector('#i-ok').onclick = function(){
    var conJug = b.querySelector('#i-jug').checked, n = 0;
    Object.keys(sel).forEach(function(eid){
      var o = byId(S.equipos, eid); if(!o) return;
      S.equipos.push({id:uid('e'), nombre:o.nombre, edicionId:U.ed, disciplinaId:U.di, ramaId:U.ra, categoriaId:U.ca,
        encargado:o.encargado||'', tel:o.tel||'',
        obs:'', estado:'',
        jugadores: conJug? (o.jugadores||[]).map(function(j){
          return {id:uid('j'), nombre:j.nombre, matricula:j.matricula||'', nac:j.nac||'', num:j.num||'',
                  tel:j.tel||'', obs:j.obs||'', cred:false};
        }) : []});
      n++;
    });
    cerrarModal(); marcar(); render();
  };
  pinta();
}

   + '<button class="btn sm" id="j-imp">De otro equipo</button></div>'

   + '<label class="f"><span>Matrícula</span><input id="j-mat" inputmode="numeric" placeholder="1234567"></label>'
   + '<label class="f"><span>Fecha de nacimiento</span><input id="j-nac" type="date"></label>'
   + '<label class="f" style="max-width:100px"><span>Número</span><input id="j-num" inputmode="numeric"></label>'
   + '<button class="btn primary" id="j-add">Agregar</button></div>'
   + '<div style="height:12px"></div>'
   + '<label class="f"><span>O pega la lista — un jugador por línea: nombre, matrícula, número, nacimiento</span>'
   + '<textarea id="j-lista" placeholder="Juan Pérez López, 1234567, 10, 12/03/2001\nLuis Ramírez Soto, 1234568, 7\nMiguel Ángel Soto"></textarea></label>'
   + '<div style="height:10px"></div><div class="row"><span class="muted" style="font-size:11.5px">Todo menos el nombre es opcional.</span>'
   + '<span class="spacer"></span><button class="btn" id="j-bulk">Agregar lista</button></div></div>');
  modal(e.nombre, b, null, 'Jugadores · '+ruta(e));

  var rechazos = [], avisos = [];
  function agregar(datos){
    var res = altaJugador(e, datos);
    if(res.ignorado) return;
    if(res.rechazado){ rechazos.push({jug:res.jug, equipo:e, contra:res.contra}); return; }
    if(res.aviso) avisos.push({jug:res.jug, equipo:e, contra:res.aviso});
  }
  function cerrarCon(){
    marcar(); render();
    if(rechazos.length || avisos.length)
      reporteImportacion({altas:0, equipos:0, rechazados:rechazos, avisos:avisos, ignorados:0});
  }
  b.querySelector('#j-add').onclick = function(){
    agregar({nombre:b.querySelector('#j-nom').value.trim(), matricula:b.querySelector('#j-mat').value,
             nac:b.querySelector('#j-nac').value, num:b.querySelector('#j-num').value});
    cerrarCon();
  };
  b.querySelector('#j-bulk').onclick = function(){
    b.querySelector('#j-lista').value.split('\n').forEach(function(l){
      l = l.trim(); if(!l) return;
      if(l.indexOf(',') >= 0){
        var p = l.split(',').map(function(x){ return x.trim(); });
        agregar({nombre:p[0], matricula:p[1], num:p[2], nac:aISO(p[3])});
      } else {
        var m = l.match(/^(\d{1,3})[\s.\-)]+(.+)$/), g = l.match(/^(\d{4,})[\s.\-)]+(.+)$/);
        if(g) agregar({nombre:g[2].trim(), matricula:g[1]});
        else if(m) agregar({nombre:m[2].trim(), num:m[1]});
        else agregar({nombre:l});
      }
    });
    cerrarCon();
  };
  b.querySelectorAll('[data-del]').forEach(function(x){ x.onclick=function(ev){
    ev.stopPropagation();
    var jid = x.getAttribute('data-del');
    e.jugadores = e.jugadores.filter(function(j){ return j.id!==jid; });
    marcar(); render(); }; });
  b.querySelectorAll('.jug').forEach(function(fila){ fila.onclick=function(ev){
    if(ev.target.closest('button')) return;
    abrirJugador(id, fila.getAttribute('data-j')); }; });
  b.querySelector('#j-imp').onclick = function(){ importarJugadores(id); };
  b.querySelector('#j-xls').onclick = function(){ abrirImportador('jugadores', {equipoId:id}); };
}

/* ---------- ficha del jugador ---------- */
function abrirJugador(eqId, jId){
  var e = byId(S.equipos,eqId); if(!e) return;
  var j = byId(e.jugadores||[], jId); if(!j) return;
  var otros = [];
  S.equipos.forEach(function(o){
    if(o.id===eqId) return;
    (o.jugadores||[]).forEach(function(k){
      var r = comparaJug(j, k);
      if(r && r.dup) otros.push({equipo:o, motivo:r.motivo});
    });
  });
  var mus = multasDe(j), saldo = saldoMultas(j);
  var b = el('<div><div class="grid-f">'
   + '<label class="f" style="grid-column:span 2"><span>Nombre completo</span><input id="p-nom" value="'+esc(j.nombre)+'"></label>'
   + '<label class="f"><span>Matrícula</span><input id="p-mat" inputmode="numeric" value="'+esc(j.matricula||'')+'"></label>'
   + '<label class="f"><span>Fecha de nacimiento</span><input id="p-nac" type="date" value="'+esc(j.nac||'')+'"></label>'
   + '<label class="f"><span>Número</span><input id="p-num" inputmode="numeric" value="'+esc(j.num||'')+'"></label>'
   + '<label class="f"><span>Teléfono</span><input id="p-tel" value="'+esc(j.tel||'')+'" placeholder="Opcional"></label>'
   + '<label class="f" style="grid-column:1/-1"><span>Observaciones</span><textarea id="p-obs" style="min-height:52px" placeholder="Sanciones, credencial pendiente, acuerdos…">'+esc(j.obs||'')+'</textarea></label>'
   + '</div><div style="height:12px"></div>'
   + '<label class="chk"><input type="checkbox" id="p-cred"'+(j.cred?' checked':'')+'> Credencial entregada</label>'

   + '<div style="height:18px"></div>'
   + '<div class="row"><span class="eyebrow">Multa individual</span><span class="spacer"></span>'
   + '<span class="num" style="font-family:Archivo,sans-serif;font-weight:700;font-size:18px;color:'
     + (saldo>0?'var(--bad)':'var(--good)')+'">'+esc(mxn(saldo))+'</span></div>'
   + (mus.length
      ? '<div class="tblwrap" style="margin-top:9px"><table><tbody>'
        + mus.map(function(m){
            var falta = Math.max(0,(Number(m.monto)||0)-(Number(m.pagado)||0));
            return '<tr><td class="num muted" style="white-space:nowrap">'+esc(fechaCorta(m.fecha))+'</td>'
             + '<td><b>'+esc(m.concepto)+'</b>'+(m.nota? '<br><span class="muted" style="font-size:11px">'+esc(m.nota)+'</span>':'')+'</td>'
             + '<td class="num">'+esc(mxn(m.monto))+'</td>'
             + '<td class="num">'+(falta>0? '<span style="color:var(--bad);font-weight:600">'+esc(mxn(falta))+'</span>' : '<span class="pill ok">Cubierta</span>')+'</td>'
             + '<td class="ta-r"><button class="btn ghost sm danger" data-qm="'+m.id+'">Quitar</button></td></tr>';
          }).join('')
        + '</tbody></table></div>'
        + '<div class="muted" style="font-size:11.5px;margin-top:8px">La multa lo sigue aunque cambie de equipo, categoría o edición. Solo se cancela cobrándola.</div>'
      : '<div class="muted" style="font-size:12.5px;margin-top:8px">Sin multas registradas.</div>')
   + '<div style="height:10px"></div><div class="row">'
   + '<button class="btn sm" id="p-multa">Agregar multa</button>'
   + (saldo>0? '<button class="btn sm primary" id="p-cobrar">Cobrar multa</button>':'')
   + '</div>'

   + (otros.length? '<div style="height:16px"></div><div class="eyebrow" style="margin-bottom:7px">También aparece en</div>'
      + '<div class="muted" style="font-size:12.5px">'+otros.map(function(o){
          return esc(o.equipo.nombre)+' — '+esc(ruta(o.equipo))+' <span class="pill nt">'+esc(o.motivo)+'</span>'; }).join('<br>')+'</div>' : '')
   + '<div style="height:18px"></div><div class="row">'
   + '<button class="btn danger" id="p-del">Quitar del equipo</button><span class="spacer"></span>'
   + '<button class="btn primary" id="p-ok">Guardar</button></div></div>');
  modal(j.nombre || 'Jugador', b, null, e.nombre+' · '+ruta(e));

  b.querySelector('#p-ok').onclick = function(){
    var n = b.querySelector('#p-nom').value.trim(); if(!n) return;
    j.nombre = n;
    j.matricula = b.querySelector('#p-mat').value.trim();
    j.nac = b.querySelector('#p-nac').value;
    j.num = b.querySelector('#p-num').value.trim();
    j.tel = b.querySelector('#p-tel').value.trim();
    j.obs = b.querySelector('#p-obs').value.trim();
    j.cred = b.querySelector('#p-cred').checked;
    marcar(); render();
  };
  b.querySelector('#p-del').onclick = function(){
    e.jugadores = e.jugadores.filter(function(k){ return k.id!==jId; });
    marcar(); render();
  };
  b.querySelector('#p-multa').onclick = function(){ abrirMultaIndividual(eqId, jId); };
  var cob = b.querySelector('#p-cobrar');
  if(cob) cob.onclick = function(){ cobrarMulta(eqId, jId); };
  b.querySelectorAll('[data-qm]').forEach(function(x){ x.onclick=function(){
    var mid = x.getAttribute('data-qm');
    confirmar('¿Quitar esta multa?','Solo hazlo si fue un error de captura: la regla es que la multa no se perdona, se cobra.', function(){
      S.multas = S.multas.filter(function(m){ return m.id!==mid; });
      marcar(); render(); abrirJugador(eqId, jId);
    }); }; });
}

/* ---------- importar jugadores de otro equipo ---------- */
function importarJugadores(eqId){
  var e = byId(S.equipos,eqId); if(!e) return;
  var origen = S.equipos.filter(function(o){ return o.id!==eqId && (o.jugadores||[]).length; })
    .sort(function(a,b2){ return a.nombre.localeCompare(b2.nombre,'es'); });
  if(!origen.length){
    modal('Importar jugadores', el('<div><div class="empty">Ningún otro equipo tiene jugadores registrados todavía.</div></div>'), 'slim');
    return;
  }
  var b = el('<div>'
   + '<label class="f"><span>Traer los jugadores de</span><select id="ij-eq">'
   + origen.map(function(o){ return '<option value="'+o.id+'">'+esc(o.nombre)+' — '+esc(ruta(o))+' ('+(o.jugadores||[]).length+')</option>'; }).join('')
   + '</select></label><div style="height:12px"></div>'
   + '<div class="implist" id="ij-list"></div>'
   + '<div style="height:12px"></div><div class="row"><button class="btn ghost sm" id="ij-todos">Marcar todos</button>'
   + '<span class="spacer"></span><button class="btn primary" id="ij-ok">Importar</button></div></div>');
  modal('Importar jugadores', b, null, e.nombre+' · '+ruta(e));

  var sel = {}, lista = b.querySelector('#ij-list');
  var yaAqui = {};
  (e.jugadores||[]).forEach(function(j){ yaAqui[norm(j.nombre)] = 1; if(j.matricula) yaAqui['m'+j.matricula] = 1; });
  function pinta(){
    sel = {};
    var o = byId(S.equipos, b.querySelector('#ij-eq').value);
    lista.innerHTML = (o.jugadores||[]).map(function(j){
      var rep = yaAqui[norm(j.nombre)] || (j.matricula && yaAqui['m'+j.matricula]);
      return '<label class="impi'+(rep?' rep':'')+'">'
       + '<input type="checkbox" data-j="'+j.id+'"'+(rep?' disabled':'')+'>'
       + '<span style="flex:1;min-width:0"><span class="n">'+esc(j.nombre)+'</span>'
       + '<span class="p">'+(j.matricula? 'Matrícula '+esc(j.matricula):'Sin matrícula')+(j.num? ' · #'+esc(j.num):'')+'</span></span>'
       + (rep? '<span class="pill nt">Ya está</span>':'')+'</label>';
    }).join('') || '<div class="empty">Ese equipo no tiene jugadores.</div>';
    lista.querySelectorAll('[data-j]').forEach(function(c){
      c.onchange = function(){ if(c.checked) sel[c.getAttribute('data-j')]=1; else delete sel[c.getAttribute('data-j')]; actualiza(); };
    });
    actualiza();
  }
  function actualiza(){
    var n = Object.keys(sel).length, btn = b.querySelector('#ij-ok');
    btn.textContent = n? 'Importar '+n+' jugador'+(n===1?'':'es') : 'Importar';
    btn.disabled = !n;
  }
  b.querySelector('#ij-eq').onchange = pinta;
  b.querySelector('#ij-todos').onclick = function(){
    lista.querySelectorAll('[data-j]:not(:disabled)').forEach(function(c){ c.checked=true; sel[c.getAttribute('data-j')]=1; });
    actualiza();
  };
  b.querySelector('#ij-ok').onclick = function(){
    var o = byId(S.equipos, b.querySelector('#ij-eq').value);
    var rech = [], avi = [];
    (o.jugadores||[]).forEach(function(j){
      if(!sel[j.id]) return;
      var res = altaJugador(e, {nombre:j.nombre, matricula:j.matricula, nac:j.nac, num:j.num, tel:j.tel, obs:j.obs});
      if(res.rechazado) rech.push({jug:res.jug, equipo:e, contra:res.contra});
      else if(res.aviso) avi.push({jug:res.jug, equipo:e, contra:res.aviso});
    });
    marcar(); render();
    if(rech.length || avi.length) reporteImportacion({altas:0, equipos:0, rechazados:rech, avisos:avi, ignorados:0});
  };
  pinta();
}

/* ---------- generar / editar cargo ---------- */
function abrirCargo(id, movId, pre){
  var e = byId(S.equipos,id); if(!e) return;
  if(!permiso(e)) return conPermiso(e, function(){ abrirCargo(id, movId, pre); });
  U.modal='cargo'; U.arg=id; saveUI();
  var m = movId? byId(S.movs,movId) : null;
  pre = pre || null;
  var saldo = saldoEquipo(id) - (m? (Number(m.importe)||0)-(Number(m.recibido)||0) : 0);
  var conceptos = S.conceptos;
  var b = el('<div>'
   + '<div class="row" style="margin-bottom:14px"><span class="muted" style="font-size:12.5px">Saldo antes de este movimiento</span>'
   + '<span class="spacer"></span><span class="num" style="font-family:Archivo,sans-serif;font-weight:700;font-size:18px;color:'
   + (saldo>0?'var(--bad)':'var(--good)')+'">'+esc(mxn(saldo))+'</span></div>'
   + '<div class="grid-f">'
   + '<label class="f" style="grid-column:span 2"><span>Concepto</span><select id="m-con">'
     + conceptos.map(function(c){ return '<option value="'+c.id+'"'+(m&&m.conceptoId===c.id?' selected':'')+'>'+esc(c.nombre)+'</option>'; }).join('')
     + '<option value="_otro"'+((pre || (m&&!m.conceptoId))?' selected':'')+'>Otro — escribir…</option></select></label>'
   + '<label class="f" style="grid-column:span 2;display:none" id="w-otro"><span>Describe el cargo</span><input id="m-otro" value="'+esc(pre? pre.concepto : (m&&!m.conceptoId? m.concepto:''))+'"></label>'
   + '<label class="f"><span>Importe del cargo</span><input id="m-imp" type="number" step="0.01" inputmode="decimal" value="'+(pre? pre.importe : (m? m.importe : (conceptos[0]?conceptos[0].monto:0)))+'"></label>'
   + '<label class="f"><span>Recibido</span><input id="m-rec" type="number" step="0.01" inputmode="decimal" value="'+(pre? pre.importe : (m? m.recibido : (conceptos[0]?conceptos[0].monto:0)))+'"></label>'
   + '<label class="f"><span>Forma de pago</span><select id="m-for">'
     + ['Efectivo','Transferencia','Tarjeta','Crédito'].map(function(x){ return '<option'+(m&&m.forma===x?' selected':'')+'>'+x+'</option>'; }).join('')+'</select></label>'
   + '<label class="f"><span>Fecha</span><input id="m-fec" type="date" value="'+esc(m? m.fecha : hoy())+'"></label>'
   + '<label class="f"><span>Entregó el dinero</span><input id="m-ent" list="l-ent" value="'+esc(m? (m.entrego||'') : (e.encargado||''))+'" placeholder="Quién paga por el equipo">'
     + '<datalist id="l-ent">'+[e.encargado].concat((e.jugadores||[]).map(function(j){return j.nombre;}))
        .filter(Boolean).map(function(c){return '<option value="'+esc(c)+'">';}).join('')+'</datalist></label>'
   + '<label class="f"><span>Recibió el dinero</span><input id="m-caj" list="l-caj" value="'+esc(m? m.cajero : (S.liga.cajero||''))+'" placeholder="Quién cobra por la liga">'
     + '<datalist id="l-caj">'+(S.liga.cajeros||[]).map(function(c){return '<option value="'+esc(c)+'">';}).join('')+'</datalist></label>'
   + '<label class="f" style="grid-column:span 2"><span>Nota (opcional)</span><input id="m-not" value="'+esc(pre? (pre.nota||'') : (m? (m.nota||''):''))+'" placeholder="Jornada 5, abono parcial…"></label>'
   + '<label class="f"><span>Jornada (opcional)</span><select id="m-jor">'+optsJornada(m? m.jornada : '', 'Sin jornada')+'</select></label>'
   + '<label class="f"><span>Rival (opcional)</span><select id="m-riv"><option value="">Sin partido</option>'
     + equiposDe({ed:e.edicionId, di:e.disciplinaId, ra:e.ramaId, ca:e.categoriaId})
        .filter(function(x){ return x.id!==e.id; })
        .sort(function(a,b){ return a.nombre.localeCompare(b.nombre,'es'); })
        .map(function(x){ return '<option value="'+x.id+'"'+(m&&m.rivalId===x.id?' selected':'')+'>'+esc(x.nombre)+'</option>'; }).join('')
     + '</select></label>'
   + '</div>'
   + '<div class="muted" style="font-size:11.5px;margin-top:8px">Jornada y rival son opcionales: sirven para calcular la '
   + 'ganancia real de cada partido. Si los dejas vacíos, el cobro cuenta en los totales de la liga pero no se asigna a ninguna jornada.</div>'
   + '<div class="row" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">'
   + '<span class="muted" style="font-size:12.5px">Saldo después</span><span class="spacer"></span>'
   + '<span class="num" id="m-desp" style="font-family:Archivo,sans-serif;font-weight:700;font-size:18px"></span></div>'
   + '<div style="height:14px"></div>'
   + '<div class="row"><button class="btn" id="m-igual">Recibido = importe</button><button class="btn" id="m-cero">No recibí nada</button>'
   + '<span class="spacer"></span><button class="btn primary" id="m-ok">'+(m?'Guardar cambios':'Guardar e imprimir')+'</button></div></div>');
  modal(e.nombre, b, null, (pre? 'Cobro de multa individual · ' : m? 'Editar movimiento · ' : 'Generar cargo · ')+ruta(e));
  if(pre) b.querySelector('.grid-f').insertAdjacentElement('beforebegin',
    el('<div class="banner" style="margin-bottom:14px;background:var(--warn-soft);color:var(--warn)">'
      + 'Este cobro salda la multa individual de '+esc(pre.concepto.replace(/^.*— /,''))+'. '
      + 'Si recibes menos, la multa queda con el resto pendiente.</div>'));

  var sel=b.querySelector('#m-con'), otro=b.querySelector('#w-otro'), imp=b.querySelector('#m-imp'),
      rec=b.querySelector('#m-rec'), desp=b.querySelector('#m-desp');
  function pintar(){
    otro.style.display = sel.value==='_otro'? '':'none';
    var d = saldo + (Number(imp.value)||0) - (Number(rec.value)||0);
    desp.textContent = mxn(d);
    desp.style.color = d>0? 'var(--bad)' : d<0? 'var(--warn)' : 'var(--good)';
  }
  sel.onchange = function(){
    var c = byId(conceptos, sel.value);
    if(c){ imp.value = c.monto; rec.value = c.monto; }
    else { imp.value = 0; rec.value = 0; }
    pintar();
    if(sel.value==='_otro') b.querySelector('#m-otro').focus();
  };
  imp.oninput = pintar; rec.oninput = pintar;
  b.querySelector('#m-igual').onclick = function(){ rec.value = imp.value; pintar(); };
  b.querySelector('#m-cero').onclick  = function(){ rec.value = 0; pintar(); };
  pintar();

  b.querySelector('#m-ok').onclick = function(){
    var c = byId(conceptos, sel.value);
    var nombre = c? c.nombre : b.querySelector('#m-otro').value.trim();
    if(!nombre){ b.querySelector('#m-otro').focus(); return; }
    var caj = b.querySelector('#m-caj').value.trim();
    if(caj){
      S.liga.cajero = caj;
      S.liga.cajeros = S.liga.cajeros||[];
      if(S.liga.cajeros.indexOf(caj)<0) S.liga.cajeros.push(caj);
    }
    var datos = {
      equipoId:id, conceptoId: c? c.id : '', concepto: nombre,
      importe: Number(imp.value)||0, recibido: Number(rec.value)||0,
      forma: b.querySelector('#m-for').value, fecha: b.querySelector('#m-fec').value || hoy(),
      nota: b.querySelector('#m-not').value.trim(), cajero: caj,
      entrego: b.querySelector('#m-ent').value.trim(),
      jornada: Number(b.querySelector('#m-jor').value)||0,
      rivalId: b.querySelector('#m-riv').value
    };
    if(m){ Object.keys(datos).forEach(function(k){ m[k]=datos[k]; }); cerrarModal(); marcar(); render(); abrirEstado(id); }
    else {
      datos.id = uid('m'); datos.folio = S.liga.folio++; datos.hora = ahora();
      if(pre && pre.jugadorId) datos.jugadorId = pre.jugadorId;
      S.movs.push(datos);
      if(pre && pre.jugadorId){
        var jj = byId(e.jugadores||[], pre.jugadorId);
        if(jj) aplicarPagoMultas(jj, datos.recibido, datos.id);
      }
      cerrarModal(); marcar(); render(); abrirTicket(datos.id);
    }
  };
}

/* ---------- estado de cuenta ---------- */
function abrirEstado(id){
  var e = byId(S.equipos,id); if(!e) return;
  if(!permiso(e)) return conPermiso(e, function(){ abrirEstado(id); });
  U.modal='estado'; U.arg=id; saveUI();
  var ms = movsDe(id).slice().sort(function(a,b){
    return String(a.fecha+a.hora).localeCompare(String(b.fecha+b.hora)) || a.folio-b.folio; });
  var cargos=0, rec=0, acum=0, filas='';
  ms.forEach(function(m){
    cargos += Number(m.importe)||0; rec += Number(m.recibido)||0;
    acum   += (Number(m.importe)||0)-(Number(m.recibido)||0);
    filas += '<tr><td class="num muted">'+esc(fecha(m.fecha))+'</td>'
      + '<td><b>'+esc(m.concepto)+'</b>'+(m.nota? '<br><span class="muted" style="font-size:11.5px">'+esc(m.nota)+'</span>':'')

/* ---------- ticket ---------- */
function ticketHTML(m){
  var e = byId(S.equipos, m.equipoId) || {nombre:'—'};
  var saldo = 0;
  movsDe(m.equipoId).forEach(function(x){
    if(String(x.fecha+x.hora+x.folio) <= String(m.fecha+m.hora+m.folio))
      saldo += (Number(x.importe)||0)-(Number(x.recibido)||0);
  });
  var L = ['<div class="ticket">'];
  L.push('<div class="tk-brand">'+esc(S.liga.nombre)+'</div>');
  L.push('<div class="tk-sub">'+esc(nom(S.ediciones,e.edicionId))+'</div>');
  L.push('<hr>');
  L.push('<div class="kv"><span>'+esc(fecha(m.fecha)+' '+(m.hora||''))+'</span><span>'+esc(folioTxt(m.folio))+'</span></div>');
  L.push('<hr>');
  L.push('<div class="tk-eq">'+esc(e.nombre)+'</div>');
  L.push('<div>'+esc(nom(S.disciplinas,e.disciplinaId)+' · '+nom(S.ramas,e.ramaId)+' · '+nom(S.categorias,e.categoriaId))+'</div>');
  if(e.encargado) L.push('<div>Enc. '+esc(e.encargado)+'</div>');
  L.push('<hr>');
  L.push('<div class="li"><span>'+esc(m.concepto)+'</span><span>'+esc(mxn(m.importe))+'</span></div>');
  if(m.nota) L.push('<div>'+esc(m.nota)+'</div>');
  L.push('<div class="big"><span>RECIBIDO</span><span>'+esc(mxn(m.recibido))+'</span></div>');
  L.push('<div class="li"><span>'+esc(m.forma||'Efectivo')+'</span><span>Saldo '+esc(mxn(saldo))+'</span></div>');
  L.push('<hr>');
  if(m.entrego) L.push('<div>Entregó: '+esc(m.entrego)+'</div>');
  if(m.cajero) L.push('<div>Recibió: '+esc(m.cajero)+'</div>');
  var credito = (Number(m.importe)||0) - (Number(m.recibido)||0);
  if((m.forma==='Crédito' || credito > 0.009) && avisoCredito()){
    L.push('<hr>');
    L.push('<div class="aviso">'+esc(avisoCredito())+'</div>');
  }
  L.push('<div class="foot">'+esc(S.liga.pie||'')+'</div>');
  L.push('<div class="sign">Firma</div>');
  L.push('</div>');
  return L.join('');
}
/* impresión y descarga compartidas por los tres tickets */
function cssTicket(){
  var css = document.getElementById('app-style').textContent;
  return css.split('/* ---------- ticket 58mm ---------- */')[1].split('#print-area')[0];
}
function ventanaTicket(titulo, html, archivo){
  var b = el('<div><div class="ticketbox">'+html+'</div><div style="height:14px"></div>'
   + '<div class="row" style="flex-wrap:nowrap"><button class="btn" id="t-file" style="flex:1">Guardar archivo</button>'
   + '<button class="btn primary" id="t-print" style="flex:1">Imprimir</button></div>'
   + '<div class="muted" style="font-size:11.5px;text-align:center;margin-top:9px">58 mm · imprime sin márgenes</div></div>');
  modal(titulo, b, 'slim');
  b.querySelector('#t-print').onclick = function(){
    document.getElementById('print-area').innerHTML = html;
    window.print();
  };
  b.querySelector('#t-file').onclick = function(){
    descargar(archivo+'.html',
      '<!doctype html><meta charset="utf-8"><style>@page{size:58mm auto;margin:0}body{margin:0}'
      + cssTicket()+'</style>'+html, 'text/html');
  };
  return b;

function abrirTicket(mid){
