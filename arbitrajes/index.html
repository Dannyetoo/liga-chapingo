/* ========== puente con Copa Fácil (API v2) ========== */
function hayServidor(){ return typeof pedir === 'function'; }
function cfCrudo(ruta, opciones){
  opciones = opciones || {};
  if(!hayServidor()) return Promise.reject(new Error('La conexión con Copa Fácil solo funciona en la versión alojada en tu servidor.'));
  return pedir('cf', {ruta:ruta, clave:(S.liga.cfKey||''), lang:'es',
    host:opciones.host||'', sinClave:!!opciones.sinClave}).then(function(r){
    if(r && r.auth === false) throw new Error('La sesión venció. Vuelve a entrar.');
    if(!r || (r.error && r.status == null)) throw new Error((r && r.error) || 'Copa Fácil no respondió.');
    return r;
  });
}
function cfLlamar(ruta, opciones){
  return cfCrudo(ruta, opciones).then(function(r){
    if(!r.ok) throw new Error('Copa Fácil respondió ' + (r.status||'?')
      + (r.crudo? ': ' + String(r.crudo).replace(/\s+/g,' ').slice(0,160) : ''));
    return r.datos;
  });
}
function cfTorneo(){ return normTorneo(S.liga.cfTorneo); }
/* acepta "123456", "premierchapingo" o la URL pegada del torneo */
function normTorneo(v){
  v = String(v||'').trim();
  if(!v) return '';
  var m = v.match(/copafacil[^\/]*\/([^\/?#]+)/i);
  if(m) v = m[1];
  v = v.replace(/^\/+|\/+$/g,'').split(/[\/?#]/)[0];
  if(/^(info|es|en|pt|br|app|www)$/i.test(v)) return '';
  try{ v = decodeURIComponent(v); }catch(e){}
  return v;
}

/* aplana la respuesta de jugadores a filas de tabla, usando header[] como columnas */
function cfAFilas(header, jugadores){
  var claves = [], titulos = [];
  (header||[]).forEach(function(h){
    if(!h || !h.key) return;
    claves.push(h.key); titulos.push(h.title || h.key);
  });
  ['name','team','nickName','position'].forEach(function(k){
    if(claves.indexOf(k) < 0 && jugadores.some(function(j){ return j && j[k] != null; })){
      claves.unshift(k);
      titulos.unshift(k==='name'?'Nombre':k==='team'?'Equipo':k==='nickName'?'Apodo':'Posición');
    }
  });
  var filas = [titulos];
  (jugadores||[]).forEach(function(j){
    filas.push(claves.map(function(k){
      var v = j ? j[k] : '';
      if(v == null) return '';
      if(typeof v === 'object') return v.name || v.title || v.value || JSON.stringify(v);
      return String(v);
    }));
  });
  return filas;
}

var CF_HOSTS_UI = ['https://copafacil.com','https://www1.copafacil.com','https://www.copafacil.com'];

/* La documentación no dice qué parámetros exige cada ruta, así que probamos
   variantes en orden y nos quedamos con la primera que responda 200. */
function cfPrimero(rutas, valida){
  var i = 0, ultimo = '';
  return new Promise(function(ok, mal){
    (function sig(){
      if(i >= rutas.length) return mal(new Error(ultimo || 'ninguna combinación funcionó'));
      cfCrudo(rutas[i]).then(function(r){
        if(r.ok && (!valida || valida(r.datos))) return ok({datos:r.datos, ruta:rutas[i]});
        ultimo = r.ok ? 'respondió 200 pero sin datos aprovechables'
                      : 'HTTP ' + r.status + (r.crudo? ' — ' + String(r.crudo).replace(/\s+/g,' ').slice(0,90) : '');
        i++; sig();
      }).catch(function(e){ ultimo = e.message; i++; sig(); });
    })();
  });
}
/* Copa Fácil devuelve 200 con la lista llena de objetos vacíos cuando los
   parámetros no le gustan; solo aceptamos respuestas con contenido real. */
function conContenido(campo){
  return function(d){
    var a = d && d[campo];
    if(!a || !a.length) return false;
    return a.some(function(x){
      return x && typeof x === 'object' && Object.keys(x).some(function(k){ return x[k] != null && x[k] !== ''; });
    });
  };
}
function qKeys(claves){
  var kk = (claves||[]).map(function(k){ return typeof k === 'string'? k : k.key; }).filter(Boolean);
  if(!kk.length) return [];
  /* repetido primero: con la lista separada por comas responde vacío */
  return [kk.map(function(k){ return 'key='+encodeURIComponent(k); }).join('&'), 'key='+encodeURIComponent(kk.join(','))];
}
function cfFases(t){
  return cfLlamar('/api2/tournament/'+encodeURIComponent(t)+'/stages').then(function(d){
    return (d && d.length ? d : (d && d.stages) || []) || [];
  });
}
function cfClavesEquipo(t){
  return cfLlamar('/api2/tournament/'+encodeURIComponent(t)+'/teams/keys')
    .then(function(d){ return (d && d.header) || []; })
    .catch(function(){ return []; });
}
function cfEquipos(t, fase, clavesEq){
  var base = '/api2/tournament/'+encodeURIComponent(t)+'/teams';
  var ks = qKeys(clavesEq), qf = fase? 'stage='+encodeURIComponent(fase) : '';
  var v = [];
  ks.forEach(function(k){ if(qf) v.push(base+'?'+qf+'&'+k); });
  ks.forEach(function(k){ v.push(base+'?'+k); });
  if(qf) v.push(base+'?'+qf);
  v.push(base);
  return cfPrimero(v, conContenido('teams')).then(function(r){
    return {equipos:(r.datos && r.datos.teams) || [], ruta:r.ruta, header:(r.datos && r.datos.header)||[]};
  });
}
function cfJugadores(t, candidatos, fase, clavesJug){
  var ks = qKeys(clavesJug), qf = fase? '&stage='+encodeURIComponent(fase) : '';
  var v = [];
  (candidatos||[]).forEach(function(id){
    if(id == null || id === '') return;
    var base = '/api2/tournament/'+encodeURIComponent(t)+'/players?team='+encodeURIComponent(id);
    ks.forEach(function(k){ v.push(base+'&'+k); });
    ks.forEach(function(k){ v.push(base+qf+'&'+k); });
    v.push(base);
    if(qf) v.push(base+qf);
  });
  return cfPrimero(v, conContenido('players'));
}

function cfDiagnostico(){
  var t = cfTorneo();
  var esEjemplo = String(S.liga.cfKey||'').replace(/\s/g,'').toUpperCase() === '519K-ICQ5-HSHT';
  var b = el('<div>'
   + (esEjemplo? '<div class="banner" style="background:var(--bad-soft);color:var(--bad)">'
      + 'Esa es la llave de ejemplo de la documentación, no la tuya.</div><div style="height:12px"></div>' : '')
   + '<p class="muted" style="margin-top:0;font-size:13px">Prueba la llave, el torneo y cada combinación de parámetros, '
   + 'porque la documentación no dice cuáles son obligatorios. Torneo: <b>'+esc(t||'(vacío)')+'</b>.</p>'
   + '<div class="tblwrap"><table style="min-width:620px"><thead><tr><th>Prueba</th><th class="num">Código</th><th>Respuesta</th></tr></thead>'
   + '<tbody id="dg"></tbody></table></div>'
   + '<div style="height:14px"></div><div id="dg-con"></div>'
   + '<div style="height:12px"></div><label class="f"><span>Copia esto y mándalo si necesitas ayuda</span>'
   + '<textarea id="dg-txt" style="min-height:130px"></textarea></label></div>');
  modal('Diagnóstico de Copa Fácil', b, 'ancho');
  var tb = b.querySelector('#dg'), lineas = [], base = '/api2/tournament/'+encodeURIComponent(t);
  if(!t){ tb.innerHTML = '<tr><td colspan="3"><div class="empty">Primero escribe el torneo.</div></td></tr>'; return; }

  function corre(et, ruta, op){
    var fila = el('<tr><td>'+esc(et)+'</td><td class="num muted">…</td><td class="muted">consultando</td></tr>');
    tb.appendChild(fila);
    return cfCrudo(ruta, op||{}).then(function(r){
      var cuerpo = String(r.crudo||'').replace(/\s+/g,' ');
      fila.children[1].innerHTML = '<span class="pill '+(r.ok?'ok':'ba')+'">'+(r.status||'?')+'</span>';
      fila.children[2].textContent = cuerpo.slice(0,150) || (r.ok? 'ok':'');
      lineas.push(et + ' → ' + (r.status||'?') + ' ' + cuerpo.slice(0,400));
      return r;
    }).catch(function(e){
      fila.children[1].innerHTML = '<span class="pill ba">—</span>';
      fila.children[2].textContent = e.message;
      lineas.push(et + ' → error: ' + e.message);
      return null;
    });
  }
  var fase = '', kEq = [], okEq = '';
  var sirve = function(r){ return !!(r && r.ok && conContenido('teams')(r.datos)); };
  corre('/stages', base+'/stages')
  .then(function(r){
    var d = r && r.datos, fs = (d && d.length? d : (d && d.stages)||[]) || [];
    if(fs.length && fs[0].id) fase = String(fs[0].id);
    return corre('/stages · SIN llave', base+'/stages', {sinClave:true});
  })
  .then(function(){ return corre('/players/keys', base+'/players/keys'); })
  .then(function(){ return corre('/teams/keys', base+'/teams/keys'); })
  .then(function(r){
    kEq = ((r && r.datos && r.datos.header) || []).map(function(k){ return k.key; }).filter(Boolean);
    return corre('/teams (sin nada)', base+'/teams');
  })
  .then(function(r){ if(sirve(r) && !okEq) okEq = '/teams';
    return fase? corre('/teams?stage', base+'/teams?stage='+encodeURIComponent(fase)) : null; })
  .then(function(r){ if(sirve(r) && !okEq) okEq = '/teams?stage';
    return kEq.length? corre('/teams?key=a&key=b (repetido)', base+'/teams?'+kEq.map(function(k){return 'key='+encodeURIComponent(k);}).join('&')) : null; })
  .then(function(r){ if(sirve(r) && !okEq) okEq = '/teams con key repetido';
    return kEq.length? corre('/teams?key=a,b,c (lista)', base+'/teams?key='+encodeURIComponent(kEq.join(','))) : null; })
  .then(function(r){ if(sirve(r) && !okEq) okEq = '/teams con key en lista';
    return (kEq.length && fase)? corre('/teams?stage + key repetido', base+'/teams?stage='+encodeURIComponent(fase)+'&'+kEq.map(function(k){return 'key='+encodeURIComponent(k);}).join('&')) : null; })
  .then(function(r){ if(sirve(r) && !okEq) okEq = '/teams con stage y key repetido';
    b.querySelector('#dg-txt').value = lineas.join('\n');
    var hay200 = lineas.some(function(l){ return / 200 /.test(l); });
    var m;
    if(okEq) m = 'Los equipos se leen con ' + okEq + '. La app usa esa combinación automáticamente.';
    else if(hay200) m = 'La llave y el torneo sirven, pero ninguna combinación de /teams devolvió equipos con datos. '
      + 'Copia este resultado y mándalo. Mientras tanto, importa por archivo .xlsx.';
    else m = 'Ninguna ruta con llave respondió 200: revisa que la llave sea la tuya y esté activa.';
    b.querySelector('#dg-con').appendChild(el('<div class="banner">'+esc(m)+'</div>'));
  });
}

    if(selF) selF.onchange = function(){ est.fase = selF.value; cargarEquipos(res); };

    if(!est.equipos.length){
      res.appendChild(el('<div class="empty">Esa fase no tiene equipos.</div>'));
      return;
    }
    var lista = el('<div class="implist">'
      + est.equipos.map(function(t,i){
          return '<label class="impi"><input type="checkbox" data-t="'+i+'">'
           + '<span style="flex:1;min-width:0"><span class="n">'+esc(nombreEq(t,i))+'</span>'
           + (String(idEq(t,i)) !== nombreEq(t,i) ? '<span class="p">ID '+esc(String(idEq(t,i)))+'</span>' : '')
           + '</span></label>';
        }).join('') + '</div>');
    res.appendChild(lista);
    if(est.claves.length){
      res.appendChild(el('<div class="muted" style="font-size:11.5px;margin-top:9px">Campos que trae este torneo: '
        + esc(est.claves.map(function(k){ return k.title||k.key; }).join(' · ')) + '</div>'));
      var texto = norm(est.claves.map(function(k){ return (k.title||'')+' '+(k.key||''); }).join(' '));
      var hayMat = /matric|document|cpf|rg|cedula|dni|ine|curp|identific/.test(texto);
      var hayNac = /nacim|nascim|birth|nasc/.test(texto);
      if(!hayMat || !hayNac)
        res.appendChild(el('<div class="banner" style="margin-top:10px">Este torneo no expone '
          + esc([!hayMat?'matrícula':'', !hayNac?'fecha de nacimiento':''].filter(Boolean).join(' ni '))
          + '. Sin esos datos, los repetidos solo se detectan por nombre. Si puedes, agrega esos campos '
          + 'a la plantilla en Copa Fácil, o carga el .xlsx que sí los trae.</div>'));
    }
    res.appendChild(el('<div style="height:14px"></div>'));
    var pie = el('<div class="row"><span class="muted" style="font-size:12px" id="cf-info">Marca los equipos que quieres traer.</span>'
      + '<span class="spacer"></span><button class="btn primary" id="cf-traer" disabled>Traer jugadores</button></div>');
    res.appendChild(pie);

    function actualiza(){
      var n = Object.keys(est.sel).length;
      pie.querySelector('#cf-info').textContent = n? n+' equipo'+(n===1?'':'s')+' seleccionado'+(n===1?'':'s') : 'Marca los equipos que quieres traer.';
      pie.querySelector('#cf-traer').disabled = !n;
    }
    lista.querySelectorAll('[data-t]').forEach(function(c){
      c.onchange = function(){ var i = c.getAttribute('data-t'); if(c.checked) est.sel[i]=1; else delete est.sel[i]; actualiza(); };
    });
    cab.querySelector('#cf-todos').onclick = function(){
      lista.querySelectorAll('[data-t]').forEach(function(c){ c.checked = true; est.sel[c.getAttribute('data-t')] = 1; });
      actualiza();
    };
    pie.querySelector('#cf-traer').onclick = function(){
      var t = cfTorneo();
      var idx = Object.keys(est.sel);
      var ids = idx.map(function(i){ return candidatosEq(est.equipos[i], +i); });
      var nombres = idx.map(function(i){ return nombreEq(est.equipos[i], +i); });
      var btn = pie.querySelector('#cf-traer'), inf = pie.querySelector('#cf-info');
      btn.disabled = true;
      var todos = [], header = null, fallos = [], i = 0;
      (function siguiente(){
        if(i >= ids.length){
          if(!todos.length){
            aviso('Copa Fácil no devolvió jugadores'+(fallos.length? ' ('+fallos[0]+')' : '')
              + '. Revisa que la fase tenga las plantillas cargadas.', true);
            btn.disabled = false; return;
          }
          if(fallos.length) aviso(fallos.length+' equipo(s) no se pudieron leer: '+fallos.join(' · '), false);
          var filas = cfAFilas(header || est.claves, todos);
          var kEnc = claveTitulo(est.headerEq, /represent|encargad|delegad|tecnic|treinador|capitan|dirigent/);
          var kTel = claveTitulo(est.headerEq, /contacto|telefono|celular|whatsapp|movil/);
          if(kEnc || kTel){
            var meta = {};
            est.equipos.forEach(function(e2,ix){
              meta[norm(nombreEq(e2,ix))] = {enc: kEnc? e2[kEnc] : '', tel: kTel? e2[kTel] : ''};
            });
            var iEq = filas[0].indexOf('Equipo');
            if(iEq >= 0){
              if(kEnc) filas[0].push('Representante');
              if(kTel) filas[0].push('Número de contacto');
              for(var f=1; f<filas.length; f++){
                var m2 = meta[norm(filas[f][iEq])] || {};
                if(kEnc) filas[f].push(m2.enc == null? '' : String(m2.enc));
                if(kTel) filas[f].push(m2.tel == null? '' : String(m2.tel));
              }
            }
          }
          alTener({nombre:'CopaFacil', filas: filas});
          return;
        }
        inf.textContent = 'Trayendo '+nombres[i]+' ('+(i+1)+' de '+ids.length+')…';
        cfJugadores(t, ids[i], est.fase, est.claves)
          .then(function(r){
            var d = r.datos;
            if(d && d.header && d.header.length) header = d.header;
            var js = (d && d.players) || [];
            /* el equipo lo sabemos nosotros: la respuesta a veces trae el id */
            js.forEach(function(j){ if(j){ j.team = nombres[i]; todos.push(j); } });
          })
          .catch(function(e){ fallos.push(nombres[i]+': '+e.message); })
          .then(function(){ i++; siguiente(); });
      })();
    };
    actualiza();
  }
}

/* ========== candado por categoría ========== */
function rutaClave(ed, di, ra, ca){ return [ed||'', di||'', ra||'', ca||''].join('|'); }
function claveDe(ed, di, ra, ca){ return (S.claves||{})[rutaClave(ed,di,ra,ca)] || ''; }
function nombreRuta(ed, di, ra, ca){
  return nom(S.ediciones,ed)+' · '+nom(S.disciplinas,di)+' · '+nom(S.ramas,ra)+' · '+nom(S.categorias,ca);
}
function abiertas(){
  try{ return JSON.parse(sessionStorage.getItem('pc_abiertas') || '[]') || []; }catch(e){ return []; }
}
function guardarAbiertas(a){ try{ sessionStorage.setItem('pc_abiertas', JSON.stringify(a)); }catch(e){} }
function abrirCandado(k){ var a = abiertas(); if(a.indexOf(k) < 0){ a.push(k); guardarAbiertas(a); } }
function cerrarCandado(k){ guardarAbiertas(abiertas().filter(function(x){ return x !== k; })); }
function bloqueada(ed, di, ra, ca){
  var k = rutaClave(ed,di,ra,ca);
  return !!claveDe(ed,di,ra,ca) && abiertas().indexOf(k) < 0;
}
function permiso(e){ return !!e && !bloqueada(e.edicionId, e.disciplinaId, e.ramaId, e.categoriaId); }

/* pide la contraseña; al acertar ejecuta lo que se quería hacer */
function pedirClaveCategoria(ed, di, ra, ca, alAbrir){
  var k = rutaClave(ed,di,ra,ca), esperada = claveDe(ed,di,ra,ca);
  if(!esperada){ if(alAbrir) alAbrir(); return; }
  var b = el('<form><div class="row" style="gap:11px;margin-bottom:14px">'
   + '<span class="candado">'+ico(I.candado)+'</span>'
   + '<span><b>'+esc(nom(S.categorias,ca))+'</b><br>'
   + '<span class="muted" style="font-size:12px">'+esc(nom(S.ediciones,ed)+' · '+nom(S.disciplinas,di)+' · '+nom(S.ramas,ra))+'</span></span></div>'
   + '<input type="text" name="usuario" autocomplete="username" value="'+esc(k)+'" style="display:none" readonly>'
   + '<label class="f"><span>Contraseña de la categoría</span>'
   + '<input type="password" id="ck-p" autocomplete="current-password" required></label>'
   + '<div id="ck-e" class="lgerr2"></div>'
   + '<div class="row" style="margin-top:8px"><span class="spacer"></span>'
   + '<button type="button" class="btn" data-x2>Cancelar</button>'
   + '<button type="submit" class="btn primary">Entrar</button></div></form>');
  modal('Categoría protegida', b, 'slim');
  var inp = b.querySelector('#ck-p');
  setTimeout(function(){ inp.focus(); }, 60);
  b.querySelector('[data-x2]').onclick = cerrarModal;
  b.onsubmit = function(ev){
    ev.preventDefault();
    if(inp.value === esperada){
      abrirCandado(k); cerrarModal(); render();
      if(alAbrir) alAbrir();
    } else {
      b.querySelector('#ck-e').textContent = 'Contraseña incorrecta.';
      inp.select();
    }
  };
}
/* envoltura para las acciones que tocan a un equipo */
function conPermiso(e, hacer){
  if(permiso(e)) return hacer();
  pedirClaveCategoria(e.edicionId, e.disciplinaId, e.ramaId, e.categoriaId, hacer);
}
function pantallaBloqueada(v){
  var c = el('<div class="card" style="text-align:center;padding:34px 20px">'
   + '<div class="candado grande">'+ico(I.candado)+'</div>'
   + '<h3 style="font-size:18px;margin-top:14px">'+esc(nom(S.categorias,U.ca))+' está protegida</h3>'
   + '<div class="muted" style="font-size:13px;margin-top:6px">'+esc(nom(S.ediciones,U.ed)+' · '+nom(S.disciplinas,U.di)+' · '+nom(S.ramas,U.ra))+'</div>'
   + '<div style="height:18px"></div><button class="btn primary" id="bl-ok">Escribir la contraseña</button></div>');
  v.appendChild(c);
  c.querySelector('#bl-ok').onclick = function(){ pedirClaveCategoria(U.ed, U.di, U.ra, U.ca); };
}

/* ---------- contraseñas en Catálogo ---------- */
function tarjetaClaves(v){
  S.claves = S.claves || {};
  var c = el('<div class="card"><header><div><h3>Contraseñas por categoría</h3>'
   + '<div class="sub">Cada categoría puede pedir su propia contraseña al entrar, distinta en cada edición y cada rama. '
   + 'Deja el campo vacío para que quede abierta. Quien tenga la clave general de la app sigue viendo el dashboard.</div></div>'
   + '<label class="chk"><input type="checkbox" id="cl-ver"> Ver las contraseñas</label></header>'
   + '<div id="cl-cuerpo"></div>'
   + '<div style="height:14px"></div><div class="row">'
   + '<span class="muted" style="font-size:12px" id="cl-info"></span>'
   + '<span class="spacer"></span><button class="btn primary" id="cl-ok">Guardar contraseñas</button></div></div>');
  v.appendChild(c);
  var ver = false;
  var cuerpo = c.querySelector('#cl-cuerpo');

  function pinta(){
    cuerpo.innerHTML = '';
    var conClave = 0, total = 0;
    S.ediciones.forEach(function(ed){
      S.ramas.forEach(function(ra){
        var filas = [];
        S.disciplinas.forEach(function(di){
          S.categorias.forEach(function(ca){
            var k = rutaClave(ed.id, di.id, ra.id, ca.id);
            var n = equiposDe({ed:ed.id, di:di.id, ra:ra.id, ca:ca.id}).length;
            var val = S.claves[k] || '';
            total++; if(val) conClave++;
            filas.push('<tr><td>'+esc(di.nombre)+'</td><td><b>'+esc(ca.nombre)+'</b></td>'
              + '<td class="num muted">'+n+'</td>'
              + '<td><input type="'+(ver?'text':'password')+'" data-k="'+esc(k)+'" value="'+esc(val)+'" '
              + 'placeholder="sin contraseña" autocomplete="new-password" style="max-width:190px"></td>'
              + '<td>'+(val? '<span class="pill wa">Protegida</span>' : '<span class="pill nt">Abierta</span>')+'</td></tr>');
          });
        });
        cuerpo.appendChild(el('<div class="sec">'
          + '<div class="row" style="margin:16px 0 8px"><span class="eyebrow">'+esc(ed.nombre+' · '+ra.nombre)+'</span>'
          + '<span class="spacer"></span>'
          + '<input data-todas="'+esc(ed.id+'|'+ra.id)+'" placeholder="Poner la misma a toda la rama" style="max-width:230px">'
          + '<button class="btn ghost sm" data-aplicar="'+esc(ed.id+'|'+ra.id)+'">Aplicar</button></div>'
          + '<div class="tblwrap"><table><thead><tr><th>Disciplina</th><th>Categoría</th>'
          + '<th class="num">Equipos</th><th>Contraseña</th><th>Estado</th></tr></thead>'
          + '<tbody>'+filas.join('')+'</tbody></table></div></div>'));
      });
    });
    c.querySelector('#cl-info').textContent = conClave+' de '+total+' categorías con contraseña.';
    cuerpo.querySelectorAll('[data-aplicar]').forEach(function(btn){
      btn.onclick = function(){
        var par = btn.getAttribute('data-aplicar');
        var campo = cuerpo.querySelector('[data-todas="'+par+'"]');
        var val = campo.value.trim();
        var p = par.split('|');
        cuerpo.querySelectorAll('[data-k]').forEach(function(i){
          var kk = i.getAttribute('data-k').split('|');
          if(kk[0] === p[0] && kk[2] === p[1]) i.value = val;
        });
        campo.value = '';
      };
    });
  }
  c.querySelector('#cl-ver').onchange = function(ev){ ver = ev.target.checked; pinta(); };
  c.querySelector('#cl-ok').onclick = function(){
    cuerpo.querySelectorAll('[data-k]').forEach(function(i){
      var k = i.getAttribute('data-k'), val = i.value.trim();
      if(val) S.claves[k] = val; else delete S.claves[k];
    });
    /* si le quitaron la contraseña a una categoría, ya no tiene caso el candado abierto */
    guardarAbiertas(abiertas().filter(function(k){ return !!S.claves[k]; }));
    marcar(); render();
  };
  pinta();
}

/* ========== contraseña de administración (dashboard, gastos, multas, catálogo) ========== */
var SECC = [
  {id:'dash',   nombre:'Dashboard',           nota:'Totales, gráficas, rendimiento, jornadas y bitácora de toda la liga.'},
  {id:'gastos', nombre:'Gastos',              nota:'Egresos de la liga, su clasificación y sus comprobantes.'},
  {id:'cuentas',nombre:'Cuentas y transferencias', nota:'Integrantes de tesorería, transferencias internas y estados de cuenta.'},
  {id:'multas', nombre:'Multas de jugadores', nota:'Adeudos personales de todos los jugadores.'},
  {id:'cat',    nombre:'Catálogo',            nota:'Ediciones, conceptos, ticket, Copa Fácil y las contraseñas de categoría.'}
];
function adminCfg(){
  if(!S.admin || typeof S.admin !== 'object' || Array.isArray(S.admin)) S.admin = {clave:'', secc:{}};
  if(!S.admin.secc || typeof S.admin.secc !== 'object' || Array.isArray(S.admin.secc)) S.admin.secc = {};
  return S.admin;
}
function adminAbierto(){ return abiertas().indexOf('@admin') >= 0; }
/* una configuración guardada antes de que existiera Cuentas hereda el candado de Gastos */
var SECC_HEREDA = {cuentas:'gastos'};
function seccMarcada(vista){
  var a = adminCfg();
  return !!(a.secc[vista] || (SECC_HEREDA[vista] && a.secc[SECC_HEREDA[vista]]));
}
function seccBloqueada(vista){
  return !!adminCfg().clave && seccMarcada(vista) && !adminAbierto();
}
function hayAlgoBloqueado(){
  var a = adminCfg();
  if(!a.clave) return false;
  return SECC.some(function(s){ return a.secc[s.id]; });
}
/* pide la contraseña de administración; al acertar ejecuta lo que se quería hacer */
function pedirClaveAdmin(alAbrir){
  var a = adminCfg();
  if(!a.clave || adminAbierto()){ if(alAbrir) alAbrir(); return; }
  var b = el('<form><div class="row" style="gap:11px;margin-bottom:14px">'
   + '<span class="candado">'+ico(I.candado)+'</span>'
   + '<span><b>Administración</b><br>'
   + '<span class="muted" style="font-size:12px">Dashboard, gastos, cuentas, multas y catálogo</span></span></div>'
   + '<input type="text" name="usuario" autocomplete="username" value="admin" style="display:none" readonly>'
   + '<label class="f"><span>Contraseña de administración</span>'
   + '<input type="password" id="ad-p" autocomplete="current-password" required></label>'
   + '<div id="ad-e" class="lgerr2"></div>'
   + '<div class="row" style="margin-top:8px"><span class="spacer"></span>'
   + '<button type="button" class="btn" data-x2>Cancelar</button>'
   + '<button type="submit" class="btn primary">Entrar</button></div></form>');
  modal('Sección protegida', b, 'slim');
  var inp = b.querySelector('#ad-p');
  setTimeout(function(){ inp.focus(); }, 60);
  b.querySelector('[data-x2]').onclick = cerrarModal;
  b.onsubmit = function(ev){
    ev.preventDefault();
    if(inp.value === adminCfg().clave){
      abrirCandado('@admin'); cerrarModal();
      if(alAbrir) alAbrir(); else render();
    } else {
      b.querySelector('#ad-e').textContent = 'Contraseña incorrecta.';
      inp.select();
    }
  };
}
function conAdmin(vista, hacer){
  if(!seccBloqueada(vista)) return hacer();
  pedirClaveAdmin(hacer);
}
function pantallaSeccion(v, vista){
  var s = SECC.filter(function(x){ return x.id === vista; })[0] || {nombre:'Sección'};
  var c = el('<div class="card" style="text-align:center;padding:34px 20px">'
   + '<div class="candado grande">'+ico(I.candado)+'</div>'

   + '<div style="height:18px"></div><button class="btn primary" id="ad-ok">Escribir la contraseña</button></div>');
  v.appendChild(c);
  c.querySelector('#ad-ok').onclick = function(){ pedirClaveAdmin(function(){ render(); }); };
}
/* barra para volver a cerrar la administración sin cerrar el navegador */
function barraAdmin(v, vista){
  if(!hayAlgoBloqueado() || !adminAbierto() || !seccMarcada(vista)) return;
  var b = el('<div class="row" style="margin-top:18px">'
   + '<span class="candado">'+ico(I.abierto)+'</span>'

function tarjetaAdmin(v){
  var a = adminCfg();
  var c = el('<div class="card"><header><div><h3>Contraseña de administración</h3>'

      ? 'Sin contraseña: las '+SECC.length+' secciones quedan abiertas.'
      : (n? n + ' de ' + SECC.length + ' secciones protegidas.'
          : 'Al guardar se protegerán las '+SECC.length+' secciones.');
    c.querySelector('#ad-cerrar').style.display = (adminAbierto() && campo.value.trim())? '' : 'none';
  }
  c.querySelector('#ad-ver').onchange = function(ev){ campo.type = ev.target.checked? 'text' : 'password'; };
  c.querySelectorAll('[data-sec]').forEach(function(i){ i.onchange = info; });
  campo.oninput = info;
  c.querySelector('#ad-cerrar').onclick = function(){ cerrarCandado('@admin'); render(); window.scrollTo(0,0); };
  c.querySelector('#ad-guardar').onclick = function(){
    var cfg = adminCfg(), val = campo.value.trim(), sec = {};
    SECC.forEach(function(s){ if(c.querySelector('[data-sec="'+s.id+'"]').checked) sec[s.id] = true; });
    /* al poner contraseña por primera vez sin marcar nada, se protege todo */
    if(val && !Object.keys(sec).length) SECC.forEach(function(s){ sec[s.id] = true; });
    cfg.clave = val; cfg.secc = sec;
    if(val) abrirCandado('@admin'); else cerrarCandado('@admin');
    marcar(); render(); window.scrollTo(0,0);
  };
  info();
}

/* ---------- gastos ---------- */
function opts(lista, sel, vacio){
  return (vacio!=null? '<option value="">'+esc(vacio)+'</option>' : '')
   + lista.map(function(x){ return '<option value="'+esc(x.id)+'"'+(x.id===sel?' selected':'')+'>'+esc(x.nombre)+'</option>'; }).join('');
}
function conceptosDeCat(cat){
  return S.conceptosGasto.filter(function(c){ return c.cat===cat; });
}
function optsJornada(sel, vacio){
  var n = jornadasTope(), o = (vacio!=null? '<option value="">'+esc(vacio)+'</option>' : '');
  for(var i=1;i<=n;i++) o += '<option value="'+i+'"'+(String(sel)===String(i)?' selected':'')+'>J'+i+'</option>';
  return o;
}
function partidoTxt(g){
  var a = nombreEquipo(g.equipoAId), b = nombreEquipo(g.equipoBId);
  if(a && b) return a+' vs '+b;
  return a || b || '';
}
/* la vista de gastos usa sus propios filtros, guardados en U */
function gastosDeVista(){
  return S.gastos.filter(function(g){
    if(!gastoEnAmbito(g, {ed:U.gfEd, ra:U.gfRa, ca:U.gfCa})) return false;
    if(U.gfCat && catGasto(g)!==U.gfCat) return false;
    if(U.gfCon && (g.concepto||'')!==U.gfCon) return false;
    if(U.gfJor && String(Number(g.jornada)||0)!==String(U.gfJor)) return false;
    if(U.gfPag){
      var cid = cuentaDeGasto(g);
      if(U.gfPag==='@sin'? !!cid : cid!==U.gfPag) return false;
    }
    if(U.gfD1 && String(g.fecha||'') < U.gfD1) return false;
    if(U.gfD2 && String(g.fecha||'') > U.gfD2) return false;
    return true;
  }).sort(function(a,b){
    return String(b.fecha||'').localeCompare(String(a.fecha||'')) || (b.folio||0)-(a.folio||0);
  });
}

/* conecta los selectores dependientes y devuelve la función que lee el formulario */
function conectarGasto(root, p, g){
  g = g || {};
  var q = function(s){ return root.querySelector('#'+p+s); };
  var selCat=q('cat'), selCon=q('con'), otro=q('wotro'), conx=q('conx'),
      mon=q('mon'), wpar=q('wpar'), ea=q('ea'), eb=q('eb');
  function pintaEquipos(){
    var lista = equiposDe({ed:q('ed').value, di:q('di').value, ra:q('ra').value, ca:q('ca').value})
      .slice().sort(function(a,b){ return a.nombre.localeCompare(b.nombre,'es'); });
    ea.innerHTML = opts(lista, ea.value || g.equipoAId || '', 'Sin equipo');
    eb.innerHTML = opts(lista, eb.value || g.equipoBId || '', 'Sin equipo');
  }
  function verOtro(){ otro.style.display = (selCon.value==='_otro')? '' : 'none'; }
  function pintaConceptos(inicial){
    var cat = selCat.value, lista = conceptosDeCat(cat);
    var actual = inicial? (g.concepto||'') : '';
    var hay = lista.filter(function(c){ return c.nombre===actual; })[0];
    selCon.innerHTML = lista.map(function(c){
        return '<option value="'+esc(c.id)+'"'+(hay&&hay.id===c.id?' selected':'')+'>'
             + esc(c.nombre)+(c.monto? ' — '+mxn0(c.monto):'')+'</option>'; }).join('')
      + '<option value="_otro"'+((!lista.length || (inicial && actual && !hay))? ' selected':'')+'>Otro — escribir…</option>';
    verOtro();
    wpar.style.display = (cat==='Partido')? '' : 'none';
    if(cat!=='Partido'){ q('jor').value=''; ea.value=''; eb.value=''; }
    /* el monto sugerido es editable: si el pago real fue otro, se cambia a mano */
    var c = byId(S.conceptosGasto, selCon.value);
    if(c && Number(c.monto)>0 && !(Number(mon.value)>0)) mon.value = c.monto;
  }
  selCat.onchange = function(){ pintaConceptos(false); };
  selCon.onchange = function(){
    verOtro();
    var c = byId(S.conceptosGasto, selCon.value);
    if(c && Number(c.monto)>0) mon.value = c.monto;
    if(selCon.value==='_otro') conx.focus();
  };
  ['ed','di','ra','ca'].forEach(function(s){ q(s).onchange = pintaEquipos; });
  pintaConceptos(true); pintaEquipos();

  return function leer(){
    var err = q('err'); err.textContent = '';
    var cObj = byId(S.conceptosGasto, selCon.value);
    var concepto = cObj? cObj.nombre : conx.value.trim();
    var monto = Number(mon.value)||0, edId = q('ed').value, cat = selCat.value;
    function falla(msg, nodo){ err.textContent = msg; if(nodo) nodo.focus(); return null; }
    if(!concepto) return falla('Falta el concepto.', cObj? selCon : conx);
    if(monto<=0)  return falla('El monto debe ser mayor que cero.', mon);
    if(!edId)     return falla('Elige la edición: es lo que permite clasificar el gasto en los reportes.', q('ed'));
    var a = cat==='Partido'? ea.value : '', b = cat==='Partido'? eb.value : '';
    if(cat==='Partido' && a && b && a===b) return falla('El Equipo A y el Equipo B no pueden ser el mismo.');
    var cta = cuentaPorId(q('pag').value);
    return {
      fecha: q('fec').value || hoy(), monto: monto,
      categoriaGasto: cat, concepto: concepto,
      categoria: cat || g.categoria || '',        /* compatibilidad con la columna anterior */
      legacy: cat? false : !!g.legacy,
      edicionId: edId, disciplinaId: q('di').value, ramaId: q('ra').value, categoriaId: q('ca').value,
      jornada: cat==='Partido'? (Number(q('jor').value)||0) : 0,
      equipoAId: a, equipoBId: b,
      pagadorId: cta? cta.id : '', pagador: cta? cta.nombre : (g.pagador||''),
      beneficiario: q('ben').value.trim(), detalles: q('det').value.trim()
    };
  };
}

function editarCuenta(id){
  var c = cuentaPorId(id); if(!c) return;
  var usos = S.gastos.filter(function(g){ return cuentaDeGasto(g)===id; }).length
           + transferenciasDe(id).length;
  var b = el('<div><div class="grid-f">'
   + '<label class="f" style="grid-column:span 2"><span>Nombre</span><input id="cx-n" value="'+esc(c.nombre)+'"></label>'
   + '<label class="f" style="grid-column:span 2"><span>Nota</span><input id="cx-o" value="'+esc(c.nota||'')+'"></label>'
   + '<label class="chk" style="align-self:end;padding-bottom:10px"><input type="checkbox" id="cx-a"'+(c.activa===false?'':' checked')+'> Activa</label>'
   + '</div><div class="muted" style="font-size:12px;margin-top:10px">Tiene '+usos+' movimiento'+(usos===1?'':'s')
   + '. Si ya no participa, desactívala: se conserva su historial y deja de aparecer en los selectores.</div>'
   + '<div class="lgerr2" id="cx-e"></div>'
   + '<div style="height:14px"></div><div class="row">'
   + (usos? '' : '<button class="btn danger" id="cx-del">Eliminar cuenta</button>')
   + '<span class="spacer"></span><button class="btn primary" id="cx-ok">Guardar</button></div></div>');
  modal(c.nombre, b, 'slim', 'Editar cuenta');
  b.querySelector('#cx-ok').onclick = function(){
    var n = b.querySelector('#cx-n').value.trim();
    if(!n){ b.querySelector('#cx-e').textContent = 'El nombre no puede quedar vacío.'; return; }
    var otra = cuentaPorNombre(n);
    if(otra && otra.id !== id){ b.querySelector('#cx-e').textContent = 'Ya hay otra cuenta con ese nombre.'; return; }
    c.nombre = n; c.nota = b.querySelector('#cx-o').value.trim(); c.activa = b.querySelector('#cx-a').checked;
    cerrarModal(); marcar(); render();
  };
  var del = b.querySelector('#cx-del');
  if(del) del.onclick = function(){
    confirmar('¿Eliminar '+c.nombre+'?','No tiene movimientos, así que no se pierde información.', function(){
      S.cuentas = S.cuentas.filter(function(x){ return x.id!==id; });
      marcar(); render();
    });
  };
}
function abrirTransferencia(deId){
  if(S.cuentas.length < 2){
    avisoSimple('Faltan cuentas','Necesitas al menos dos integrantes o cuentas para poder transferir. Agrégalos en esta misma pantalla.');
    return;
  }
  var b = el('<div><div class="grid-f">'
   + '<label class="f"><span>Fecha</span><input id="t-fec" type="date" value="'+hoy()+'"></label>'
   + '<label class="f"><span>Monto</span><input id="t-mon" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></label>'
   + '<label class="f"><span>Entrega</span><select id="t-de">'+opcionesCuenta(deId||'', 'Selecciona…')+'</select></label>'
   + '<label class="f"><span>Recibe</span><select id="t-pa">'+opcionesCuenta('', 'Selecciona…')+'</select></label>'
   + '<label class="f" style="grid-column:1/-1"><span>Detalles / nota</span><input id="t-det" placeholder="Corte del domingo, adelanto de arbitraje…"></label>'
   + '</div><div class="lgerr2" id="t-err"></div>'
   + '<div class="banner" style="margin-top:10px">Esto no es ingreso ni gasto: baja el saldo de quien entrega y sube el de quien recibe. '
   + 'El resultado de la liga no cambia.</div>'
   + '<div style="height:14px"></div><div class="row"><span class="spacer"></span>'
   + '<button class="btn primary" id="t-ok">Guardar e imprimir</button></div></div>');
  modal('Nueva transferencia', b, null, 'Movimiento interno de tesorería');
  var err = b.querySelector('#t-err');
  b.querySelector('#t-ok').onclick = function(){
    err.textContent = '';
    var de = b.querySelector('#t-de').value, pa = b.querySelector('#t-pa').value;
    var monto = Number(b.querySelector('#t-mon').value)||0;
    if(monto<=0){ err.textContent = 'El monto debe ser mayor que cero.'; return; }
    if(!de){ err.textContent = 'Falta la cuenta que entrega.'; return; }
    if(!pa){ err.textContent = 'Falta la cuenta que recibe.'; return; }
    if(de===pa){ err.textContent = 'El origen y el destino no pueden ser la misma cuenta.'; return; }
    var t = {id:uid('tr'), folio:S.liga.folioTransf++, fecha:b.querySelector('#t-fec').value||hoy(), hora:ahora(),
      deId:de, deNombre:nombreCuenta(de), paraId:pa, paraNombre:nombreCuenta(pa),
      monto:monto, detalles:b.querySelector('#t-det').value.trim()};
    S.transferencias.push(t);
    cerrarModal(); marcar(); render(); abrirTicketTransfer(t.id);
  };
}
function abrirEstadoCuenta(id){
  var c = cuentaPorId(id); if(!c) return;

  var filas = ms.map(function(x){
    acum += x.entra - x.sale;
    var tk = x.tk? '<button class="btn ghost sm" data-tk="'+x.tk+'">Ticket</button>'

     + '<td class="num muted" style="font-size:11.5px">'+esc(x.folio)+'</td>'
     + '<td><b>'+esc(x.concepto)+'</b>'+(x.detalles? '<br><span class="muted" style="font-size:11px">'+esc(x.detalles)+'</span>':'')+'</td>'
     + '<td class="num" style="color:var(--accent)">'+(x.entra? esc(mxn(x.entra)):'—')+'</td>'
     + '<td class="num" style="color:var(--bad)">'+(x.sale? esc(mxn(x.sale)):'—')+'</td>'
     + '<td class="num" style="font-weight:600;color:'+(acum<0?'var(--bad)':'inherit')+'">'+esc(mxn(acum))+'</td>'
     + '<td class="ta-r">'+tk+'</td></tr>';
  }).join('');
  var b = el('<div>'
   + '<div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">'
   + tile('Saldo actual', mxn(r.saldo), r.n+' movimiento'+(r.n===1?'':'s'), r.saldo<0?'neg':'hero')
   + tile('Recibido', mxn(r.recibido), 'Transferencias a su favor','')
   + tile('Transferido', mxn(r.transferido), 'Transferencias que entregó','')
   + tile('Gastos pagados', mxn(r.gastos), 'Salidas a terceros','')
   + tile('Cobró a equipos', mxn(r.cobrado), 'Ingresos recibidos como cajero','')
   + '</div><div style="height:16px"></div>'
   + '<div class="tblwrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Folio</th><th>Concepto</th>'
   + '<th class="num">Entró</th><th class="num">Salió</th><th class="num">Saldo</th><th></th></tr></thead><tbody>'
   + (filas || '<tr><td colspan="8"><div class="empty">Sin movimientos.</div></td></tr>')
   + '</tbody></table></div>'
   + '<div style="height:16px"></div><div class="row">'
   + '<button class="btn" id="ec-csv">Exportar movimientos (CSV)</button><span class="spacer"></span>'
   + '<button class="btn primary" id="ec-tr">Transferir desde esta cuenta</button></div></div>');
  modal(c.nombre, b, 'ancho', 'Estado de cuenta · saldo calculado de sus movimientos');
  b.querySelectorAll('[data-tk]').forEach(function(x){ x.onclick=function(){ abrirTicket(x.getAttribute('data-tk')); }; });
  b.querySelectorAll('[data-tg]').forEach(function(x){ x.onclick=function(){ abrirTicketGasto(x.getAttribute('data-tg')); }; });
  b.querySelectorAll('[data-tt]').forEach(function(x){ x.onclick=function(){ abrirTicketTransfer(x.getAttribute('data-tt')); }; });

}

/* respaldos de la versión anterior (cargos + pagos) se convierten a movimientos */
function migrar(j){
  COLS.forEach(function(k){ j[k] = j[k] || []; });
  if(!j.claves || typeof j.claves !== 'object' || Array.isArray(j.claves)) j.claves = {};
  if(!j.admin || typeof j.admin !== 'object' || Array.isArray(j.admin)) j.admin = {clave:'', secc:{}};
  if(!j.admin.secc || typeof j.admin.secc !== 'object' || Array.isArray(j.admin.secc)) j.admin.secc = {};
  j.equipos.forEach(function(e){
    if(e.obs == null) e.obs = '';
    if(e.estado == null) e.estado = '';
    e.jugadores = (e.jugadores||[]).map(function(x){
      return {id:x.id||uid('j'), nombre:x.nombre||'', matricula:x.matricula||'', nac:x.nac||'',
              num:x.num||'', tel:x.tel||'', obs:x.obs||'', cred:!!x.cred};
    });
  });
  j.multas.forEach(function(m){
    m.ident = m.ident || {nombre:'', matricula:'', nac:''};
    if(m.pagado == null) m.pagado = 0;
  });
  j.liga = j.liga || {nombre:'PREMIER CHAPINGO', pie:'', folio:1};

  /* ---------- ampliación financiera: cuentas, transferencias y gastos clasificados ----------
     Todo es aditivo: un respaldo viejo que no traiga estas propiedades arranca igual. */
  if(j.liga.folio       == null) j.liga.folio = 1;
  if(j.liga.folioGasto  == null) j.liga.folioGasto = 1;
  if(j.liga.folioTransf == null) j.liga.folioTransf = 1;
  if(j.liga.jornadas    == null) j.liga.jornadas = 10;

  function normNom(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim(); }
  var porNom = {};
  j.cuentas.forEach(function(c){
    if(!c.id) c.id = uid('cu');
    if(c.activa == null) c.activa = true;
    if(c.nota == null) c.nota = '';
    porNom[normNom(c.nombre)] = c;
  });
  function altaCuenta(nombre){
    var k = normNom(nombre); if(!k) return null;
    if(porNom[k]) return porNom[k];
    var c = {id:uid('cu'), nombre:String(nombre).trim(), activa:true, nota:''};
    j.cuentas.push(c); porNom[k] = c; return c;
  }
  /* una sola vez: se siembran los integrantes mencionados y los que ya aparecen en gastos */
  if(!j.liga.cfgGastoV1){
    CUENTAS_BASE.forEach(altaCuenta);
    (j.gastos||[]).forEach(function(g){ altaCuenta(g.pagador); });
    if(!j.conceptosGasto.length){
      j.conceptosGasto = CONCEPTOS_GASTO_BASE.map(function(c){
        return {id:uid('cg'), cat:c.cat, nombre:c.nombre, monto:c.monto};
      });
    }
    j.liga.cfgGastoV1 = 1;
  }
  j.conceptosGasto.forEach(function(c){
    if(!c.id) c.id = uid('cg');
    c.monto = Number(c.monto)||0;
    if(CATG.indexOf(c.cat) < 0) c.cat = 'Otros';
  });

  /* gastos: se completan campos nuevos SIN tocar los valores originales */
  var pendFolio = [];
  j.gastos.forEach(function(g){
    if(g.hora == null) g.hora = '';
    if(g.disciplinaId == null) g.disciplinaId = '';
    if(g.ramaId == null) g.ramaId = '';
    if(g.categoriaId == null) g.categoriaId = '';
    if(g.jornada == null) g.jornada = 0;
    if(g.equipoAId == null) g.equipoAId = '';
    if(g.equipoBId == null) g.equipoBId = '';
    if(g.detalles == null) g.detalles = '';
    if(g.categoriaGasto == null){
      /* solo se reclasifica cuando el nombre coincide exactamente con una categoría nueva;
         si no, se conserva el valor original y queda marcado como histórico */
      if(CATG.indexOf(g.categoria) >= 0) g.categoriaGasto = g.categoria;
      else { g.categoriaGasto = ''; g.legacy = true; }
    }
    if(g.pagadorId == null){
      var c = porNom[normNom(g.pagador)];
      g.pagadorId = c? c.id : '';
    }
    if(!g.folio) pendFolio.push(g);
  });
  pendFolio.sort(function(a,b){ return String(a.fecha||'').localeCompare(String(b.fecha||'')); })
    .forEach(function(g){ g.folio = j.liga.folioGasto++; });

  j.transferencias.forEach(function(t){
    if(!t.id) t.id = uid('tr');
    t.monto = Number(t.monto)||0;
    if(t.detalles == null) t.detalles = '';
    if(t.hora == null) t.hora = '';
    if(!t.folio) t.folio = j.liga.folioTransf++;
  });

  if(j.v === 2) return j;
  if(!j.ediciones.length) j.ediciones = [{id:'ed1',nombre:'Primera Edición'}];
  if(!j.categorias.length) j.categorias = [{id:'ca1',nombre:'Libre'}];
  var ram = {};
  (j.ramas||[]).forEach(function(r){ if(typeof r === 'string'){ var id=uid('ra'); ram[r]={id:id,nombre:r}; } });
  if(Object.keys(ram).length) j.ramas = Object.keys(ram).map(function(k){ return ram[k]; });
  var ed0 = j.ediciones[0].id;
  var porNombre = {};
  j.categorias.forEach(function(c){ porNombre[c.nombre.toLowerCase()] = c.id; });
  j.equipos.forEach(function(e){
    e.edicionId = e.edicionId || ed0;
    if(!e.categoriaId){
      var cn = (e.categoria||'').trim();
      if(cn){
        if(!porNombre[cn.toLowerCase()]){ var nc={id:uid('ca'),nombre:cn}; j.categorias.push(nc); porNombre[cn.toLowerCase()]=nc.id; }
        e.categoriaId = porNombre[cn.toLowerCase()];
      } else e.categoriaId = j.categorias[0].id;
    }
    e.ramaId = e.ramaId || (ram[e.rama]? ram[e.rama].id : (j.ramas[0]? j.ramas[0].id : ''));
    if(!e.encargado && e.delegado) e.encargado = e.delegado;
    e.jugadores = (e.jugadores || []).map(function(j){
      return {id:j.id||uid('j'), nombre:j.nombre||'', matricula:j.matricula||'', num:j.num||'', tel:j.tel||'', cred:!!j.cred};
    });
    delete e.rama; delete e.categoria; delete e.delegado;
  });
  var folio = j.liga.folio || 1, movs = [];
  (j.pagos||[]).forEach(function(p){
    movs.push({id:p.id||uid('m'), equipoId:p.equipoId, conceptoId:p.conceptoId||'', concepto:p.nombre||'Pago',
      importe:Number(p.monto)||0, recibido:Number(p.monto)||0, forma:p.forma||'Efectivo',
      fecha:p.fecha, hora:p.hora||'', nota:p.nota||'', cajero:p.quien||'', folio:p.folio||folio++});
  });
  (j.cargos||[]).forEach(function(c){
    movs.push({id:c.id||uid('m'), equipoId:c.equipoId, conceptoId:c.conceptoId||'', concepto:c.nombre||'Cargo',
      importe:Number(c.monto)||0, recibido:0, forma:'Crédito', fecha:c.fecha, hora:'', nota:c.nota||'',
      cajero:'', folio:folio++});
  });
  j.movs = movs; j.liga.folio = folio; j.v = 2;
  delete j.pagos; delete j.cargos;
  return j;
}

function arrancar(){
  pedir('estado').then(function(r){
    if(r && r.auth === false){ pedirClave(); return; }
    if(r && r.ok){
      var vacio = !r.estado || !r.rev;
      if(!vacio){ S = normaliza(r.estado); dirty = false; }
      else { S = normaliza(S); dirty = true; }   // servidor nuevo: se siembra el catálogo
      rev = r.rev || 0; base = clon(S); modoLocal = false;
      render();
      if(dirty) guardar();
      clearInterval(poll); poll = setInterval(refrescar, 20000);
      return;
    }
    modoSinServidor();
  }).catch(function(){ modoSinServidor(); });
}

render();
arrancar();
window.addEventListener('beforeunload', function(e){
  if(dirty){ guardar(); e.preventDefault(); e.returnValue=''; return ''; }
});
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refrescar(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') cerrarModal(); });
})();
</script>
</body>
</html>
